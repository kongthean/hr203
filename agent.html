<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>Agent - Cambodia Insight Express</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Khmer","Khmer OS System","Noto Sans SC","Microsoft YaHei",sans-serif;background:#eef2f7;color:#0f172a;font-size:15px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.grad{background:linear-gradient(135deg,#0b1d3a 0%,#24406e 100%);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border:0;border-radius:10px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#0b1d3a 0%,#24406e 100%);color:#fff;font-size:14px}
.btn.green{background:linear-gradient(135deg,#064e3b 0%,#15906b 100%)}
.btn.red{background:linear-gradient(135deg,#6b0f2a 0%,#d63a62 100%)}
.btn.gray{background:#e2e8f0;color:#334155}
.btn.small{padding:6px 12px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:default}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font-size:15px}
textarea{min-height:60px;resize:vertical}
label{display:block;font-size:12px;font-weight:700;color:#334155;margin:0 0 4px}
.fg{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(15,23,42,.07);margin-bottom:14px}
h2{margin:0 0 12px;font-size:18px}
h3{margin:0 0 10px;font-size:15px}
.muted{color:#64748b;font-size:12px}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login .box{width:100%;max-width:380px}
#login .logo{font-size:22px;font-weight:800;text-align:center;margin-bottom:2px;color:#0b1d3a}
#login .role{text-align:center;color:#64748b;margin-bottom:18px;font-weight:600}
.err{color:#dc2626;font-size:13px;margin:8px 0;min-height:18px}
div.sticky{position:sticky;top:0;z-index:30}
header.top{padding:10px 14px;display:flex;align-items:center;gap:10px}
header.top .hr{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex:0 0 auto}
header.top .ttl{font-weight:800;font-size:16px;flex:1;min-width:0;text-align:left}
header.top .ttl small{display:block;font-weight:500;opacity:.8;font-size:11px}
header.top select{width:auto;padding:5px 8px;font-size:12px;border-radius:8px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35)}
header.top select option{color:#0f172a}
.ib{position:relative;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px}
.badge{position:absolute;top:-6px;right:-6px;background:#dc2626;color:#fff;border-radius:10px;min-width:18px;height:18px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
nav.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:#fff;box-shadow:0 1px 4px rgba(15,23,42,.08)}
nav.tabs button{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;border:0;background:#e2e8f0;color:#334155;padding:10px 16px;border-radius:22px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
nav.tabs button svg{width:18px;height:18px}
nav.tabs button.on{background:linear-gradient(135deg,#0b1d3a 0%,#24406e 100%);color:#fff}
nav.tabs{justify-content:flex-start}
nav.tabs button:first-child{margin-left:auto}nav.tabs button:last-child{margin-right:auto}
nav.bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid #e2e8f0;box-shadow:0 -2px 10px rgba(15,23,42,.1);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:center}
nav.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:#64748b;font-size:12px;font-weight:700;padding:6px 18px;border-radius:10px;cursor:pointer}
nav.bnav button svg{width:24px;height:24px}
nav.bnav button.on{color:#0b1d3a;background:#e8eef8}
nav.bnav button:not(.xtra){display:none}
body{padding-bottom:78px}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.quick button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:84px;border:0;border-radius:14px;color:#fff;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 4px 12px rgba(15,23,42,.2)}
.quick button svg{width:28px;height:28px}
.btn.big{min-height:50px;font-size:16px;border-radius:12px}
@media(max-width:760px){
 nav.tabs{display:none}
 nav.bnav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:#64748b;font-size:10px;font-weight:700;padding:6px 2px;border-radius:10px;cursor:pointer}
 nav.bnav button:not(.xtra){display:flex}
 nav.bnav button svg{width:24px;height:24px}
 nav.bnav button span{display:none}
 nav.bnav button{padding:10px 2px}
 nav.bnav button svg{width:28px;height:28px}
 nav.bnav button.on{color:#0b1d3a;background:#e8eef8}
 body{padding-bottom:66px}
 main{padding:10px}
 .toast{bottom:90px}
}
main{max-width:980px;margin:0 auto;padding:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{border-radius:12px;padding:12px;color:#fff;cursor:pointer}
.stat b{display:block;font-size:26px}
.stat span{font-size:12px;font-weight:600}
.st{display:inline-block;padding:3px 9px;border-radius:12px;color:#fff;font-size:11px;font-weight:700;white-space:nowrap}
.row{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #eef2f7;cursor:pointer}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .no{font-weight:800;font-size:14px}
.row .sub{color:#64748b;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filters>*{flex:1;min-width:130px}
.tl{border-left:3px solid #cbd5e1;margin:8px 0 0 6px;padding-left:14px}
.tl .it{position:relative;padding:0 0 14px}
.tl .it:before{content:"";position:absolute;left:-21px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--c,#64748b)}
.tl .it b{font-size:14px}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto}
.dlg{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:520px;margin:auto 0}
.dlg h2{margin-bottom:10px}
.dlg .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.dlg .acts .btn{flex:1;min-width:110px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:12px 18px;border-radius:12px;color:#fff;font-weight:600;z-index:90;max-width:90%;text-align:center}
.toast.ok{background:#15803d}.toast.bad{background:#b91c1c}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th{background:#f1f5f9;text-align:left;padding:8px;font-size:12px}
table.tb td{padding:8px;border-bottom:1px solid #eef2f7;vertical-align:middle}
.sc-log{margin-top:10px}
.sc-log div{padding:8px 10px;border-radius:8px;margin-bottom:6px;font-size:13px;font-weight:600}
.sc-log .g{background:#dcfce7;color:#166534}.sc-log .r{background:#fee2e2;color:#991b1b}.sc-log .y{background:#fef9c3;color:#854d0e}
#reader{width:100%;max-width:760px;min-height:320px;margin:10px auto;border-radius:12px;overflow:hidden;background:#0f172a}
#reader video{width:100%!important;height:auto!important;min-height:320px;max-height:70vh;object-fit:cover}
.nl{padding:10px;border-bottom:1px solid #eef2f7;cursor:pointer}.nl.un{background:#eff6ff}
/* label (screen preview + print) */
.lab{border:2px solid #000;border-radius:6px;padding:10px;width:100%;max-width:400px;margin:0 auto 12px;background:#fff;color:#000;font-size:12px}
.lab .h{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:6px;font-weight:800}
.lab .c{font-size:10px;border:1px solid #000;padding:1px 5px;border-radius:3px}
.lab .qrw{display:flex;gap:10px;align-items:center}
.lab .no{font-size:18px;font-weight:900;letter-spacing:.5px}
.lab .rt{font-size:15px;font-weight:800;margin:4px 0}
.lab table{width:100%;border-collapse:collapse;margin-top:6px}
.lab td{padding:2px 0;vertical-align:top}
.lab td:first-child{font-weight:700}
#printArea{display:none}

.scgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.scgrid button{display:flex;align-items:center;gap:12px;min-height:72px;border:0;border-radius:14px;color:#fff;font-weight:800;font-size:16px;padding:12px 16px;text-align:left;cursor:pointer;box-shadow:0 4px 12px rgba(15,23,42,.2)}
.scgrid button svg{width:30px;height:30px;flex:0 0 30px}
.sc-top{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:6px}
.sc-mode{color:#fff;font-weight:800;font-size:15px;padding:9px 14px;border-radius:10px;flex:1}
.pk{text-align:center;border-top:10px solid #64748b;max-width:420px}
.pk.ok{border-color:#16a34a}.pk.warn{border-color:#d97706}.pk.bad{border-color:#dc2626}.pk.ask{border-color:#2563eb}
.pk-ic{width:64px;height:64px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;color:#fff;background:#64748b}
.pk.ok .pk-ic{background:#16a34a}.pk.warn .pk-ic{background:#d97706}.pk.bad .pk-ic{background:#dc2626}.pk.ask .pk-ic{background:#2563eb}
.pk h2{font-size:19px}.pk .no2{font-weight:900;font-size:20px;letter-spacing:.5px;margin:4px 0}
.pk .acts{justify-content:center;flex-direction:column}.pk .acts .btn{width:100%}
#popHost .ov{z-index:300}
.lab{font-family:'Khmer OS Battambang','Noto Sans Khmer','Leelawadee UI','Khmer UI',Arial,sans-serif}
.lab .co{font-size:15px;font-weight:900}.lab .cok{font-size:12px;font-weight:700}
.lab .k{display:block;font-weight:700}.lab .e{display:block;font-size:9px;font-weight:500}
.lab .lbl{width:24%;font-weight:700}
.lab table.rcpt{border:1px solid #000;margin-top:6px}.lab table.rcpt td{border:1px solid #000;padding:3px 5px}
.lab .qrw{align-items:flex-start}.lab .qrbox{text-align:center;flex:0 0 120px}.lab .qrbox .scan{font-size:9px;margin-top:2px}
.lab .muted2 .k,.lab .muted2 .e{display:inline}.lab .muted2 .e{margin-left:4px}
.lab .nos{flex:1}.lab .muted2{font-size:10px;margin-top:2px}
.lab .brs{display:flex;gap:10px;margin-top:6px;font-size:10px}.lab .brs>div{flex:1}
.lab .terms{margin-top:6px;border-top:1px dashed #000;padding-top:4px;font-size:9px}.lab .terms ol{margin:3px 0 0 14px;padding:0}.lab .terms li{margin-bottom:2px}
.lab .trk{margin-top:4px;font-size:9px;text-align:center}
.ib svg{width:20px;height:20px;display:block}
.quick button svg{width:30px;height:30px;padding:11px;box-sizing:content-box;background:rgba(255,255,255,.2);border-radius:50%}
.quick button{gap:8px}
.stat{position:relative;overflow:hidden}
.stat .sti{position:absolute;right:8px;top:8px;opacity:.3}.stat .sti svg{width:30px;height:30px}
.st .si svg{width:12px;height:12px;vertical-align:-2px;margin-right:4px}
.ric{flex:0 0 38px;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff}.ric svg{width:20px;height:20px}
.bp{position:relative}.bplist{max-height:220px;overflow:auto;border:1px solid #cbd5e1;border-radius:10px;margin-top:4px;background:#fff;text-align:left}
.bpi{padding:10px 12px;border-bottom:1px solid #eef2f7;cursor:pointer}.bpi:last-child{border-bottom:0}.bpi:hover,.bpi:active{background:#eef2f7}.bpi b{display:block;font-size:14px}.bpi span{font-size:12px;color:#64748b}
label.chk{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px}label.chk input{width:auto}
.blist table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}.blist th,.blist td{border:1px solid #000;padding:5px 7px;text-align:left;vertical-align:top}.blist h2{margin:0 0 4px}

.mapbox{height:230px;border-radius:12px;overflow:hidden;border:1px solid #cbd5e1;background:#e2e8f0}
.grp{border:1px solid #e2e8f0;border-radius:12px;margin-bottom:8px;overflow:hidden}
.grp-h{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#f8fafc;cursor:pointer;font-size:15px}
.grp-h .gic{width:14px;color:#64748b}.grp-h b{flex:1}.grp-h .cnt{background:#0b1d3a;color:#fff;border-radius:12px;padding:2px 9px;font-size:12px;font-weight:700}
.grp table{margin:0}.pinok{font-size:13px}
@media print{
 body>*:not(#printArea){display:none!important}
 body{background:#fff}
 #printArea{display:block!important}
 #printArea{display:flex!important;flex-wrap:wrap;gap:5mm;align-items:flex-start}
 #printArea .lab{max-width:none;width:94mm;margin:0;padding:2.5mm;font-size:8pt;border-width:1.5px;page-break-inside:avoid}
 #printArea .lab .co{font-size:10pt}#printArea .lab .cok{font-size:8pt}#printArea .lab .no{font-size:12pt}#printArea .lab .rt{font-size:10pt;margin:2px 0}
 #printArea .lab .e{font-size:6pt}#printArea .lab .c{font-size:7pt}
 #printArea .lab .qrbox{flex:0 0 27mm}#printArea .lab .qrbox svg{width:26mm;height:26mm}#printArea .lab .qrw{gap:3mm}
 #printArea .lab table.rcpt td{padding:1px 3px}
 #printArea .lab .brs{font-size:7pt}#printArea .lab .terms{font-size:6pt;margin-top:3px;padding-top:2px}#printArea .lab .terms ol{margin-left:10px}#printArea .lab .trk{font-size:6.5pt;margin-top:2px}
 #printArea .blist{width:100%}
 @page{size:A4 portrait;margin:8mm}
}
.moreg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}.moreg button{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:#eef2f9;color:#0b1d3a;font-weight:700;font-size:14px;padding:16px 8px;border-radius:14px;cursor:pointer}.moreg button svg{width:30px;height:30px}
</style>
</head>
