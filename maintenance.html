<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Maintenance Mode</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--navy:#0b1d3a;--navy2:#24406e;--brand:#0b1d3a;--green:#16a34a;--amber:#d97706;--red:#dc2626;--blue:#2563eb;--hh:60px}
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Khmer","Khmer OS","Noto Sans SC",sans-serif}
body{background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
.hide{display:none!important}
/* top bar */
.top{background:linear-gradient(135deg,#0b1d3a 0%,#24406e 100%);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:40;box-shadow:0 4px 18px rgba(11,29,58,.28)}
body.isLogin .top{display:none}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:38px;height:38px;border-radius:10px;flex:none}
.brand b{display:block;font-size:16px;font-weight:700;line-height:1.2}
.brand small{display:block;font-size:11px;opacity:.7;letter-spacing:.08em;margin-top:1px}
.tools{display:flex;gap:8px;align-items:center}
.langs{display:flex;gap:6px}
.langs button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer;font-weight:600}
.langs button.on{background:#fff;color:var(--navy)}
.icoBtn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-weight:600}
.icoBtn:hover{background:rgba(255,255,255,.22)}
main{flex:1;width:100%;max-width:900px;margin:0 auto;padding:16px}
/* login */
.login{max-width:420px;margin:28px auto 8px;text-align:center}
.login .lgo{width:88px;height:88px;border-radius:22px;display:block;margin:0 auto 16px;box-shadow:0 10px 28px rgba(11,29,58,.3)}
.login h1{font-size:24px;font-weight:800;color:var(--ink);margin-bottom:6px}
.login .sub{font-size:14px;color:var(--mute);margin-bottom:20px;line-height:1.5}
.login .box{background:#fff;border-radius:18px;padding:20px;box-shadow:0 8px 30px rgba(15,23,42,.1);text-align:left}
.login .box label:first-child{margin-top:0}
.login .langs.big{justify-content:center;margin-top:20px;gap:8px}
.login .langs.big button{background:#fff;color:var(--ink);border:1px solid var(--line);padding:11px 18px;border-radius:14px;font-size:14px}
.login .langs.big button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.login .backA{display:block;text-align:center;margin-top:14px;font-size:13px;color:var(--mute);text-decoration:none}
/* cards */
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,23,42,.08),0 6px 20px rgba(15,23,42,.04)}
.card h2{font-size:15.5px;font-weight:700;margin-bottom:4px}
.sub{font-size:12.5px;color:var(--mute);line-height:1.5;margin-bottom:12px}
label{display:block;font-size:12.5px;font-weight:600;margin:12px 0 5px;color:#334155}
input[type=text],input[type=password],input[type=time],input[type=datetime-local],select,textarea{width:100%;padding:11px 13px;border:1.5px solid #cbd5e1;border-radius:12px;font-size:14px;background:#fff;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--navy2);box-shadow:0 0 0 4px rgba(36,64,110,.14)}
textarea{resize:vertical;min-height:46px}
.btn{border:0;border-radius:12px;padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff;transition:transform .12s,box-shadow .12s,opacity .12s;box-shadow:0 4px 12px rgba(11,29,58,.22)}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:none}
.btn.sec{background:#e2e8f0;color:var(--ink);box-shadow:none}
.btn.green{background:var(--green)} .btn.red{background:var(--red)} .btn.amber{background:var(--amber)}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:5px 14px;border-radius:20px;font-weight:700;font-size:13px;color:#fff}
.pill.on{background:var(--red)} .pill.off{background:var(--green)} .pill.sch{background:var(--amber)}
.note{font-size:12px;color:var(--mute);margin-top:8px;line-height:1.5}
.count{font-size:13px;color:var(--mute);margin:6px 0 2px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;margin-top:12px;font-weight:500;cursor:pointer}
.check input{margin-top:3px;width:17px;height:17px;accent-color:var(--navy)}
/* tabs */
.tabs{display:flex;gap:6px;background:#fff;border-radius:16px;padding:5px;box-shadow:0 2px 10px rgba(15,23,42,.1);position:sticky;top:var(--hh);z-index:30;margin-bottom:14px;overflow-x:auto}
.tabs button{flex:1;border:0;background:transparent;padding:11px 12px;border-radius:12px;font-weight:700;font-size:13.5px;color:#475569;cursor:pointer;white-space:nowrap}
.tabs button.sel{background:var(--navy);color:#fff;box-shadow:0 4px 12px rgba(11,29,58,.3)}
/* overview */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:14px}
.tile{background:#fff;border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.08),0 6px 20px rgba(15,23,42,.04);display:flex;flex-direction:column;gap:8px}
.tile .tl{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.tile .tv{font-size:14px;color:var(--ink);line-height:1.45;flex:1}
.tile .pill{align-self:flex-start}
/* services */
.grp{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:16px 0 6px}
.svc{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.svc:last-child{border-bottom:0}
.svc .nm{font-size:14px;font-weight:500;flex:1;min-width:150px}
.seg{display:inline-flex;border:1.5px solid #cbd5e1;border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:8px 14px;font-size:12.5px;cursor:pointer;color:#475569;font-weight:600}
.seg button+button{border-left:1.5px solid #cbd5e1}
.seg button.sel-open{background:var(--green);color:#fff}.seg button.sel-view{background:var(--amber);color:#fff}.seg button.sel-closed{background:var(--red);color:#fff}.seg button.sel-on{background:var(--navy);color:#fff}
.grpSeg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.grpSeg button{border:1.5px solid #cbd5e1;background:#fff;color:#475569;border-radius:20px;padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer}
.grpSeg button.sel-open{background:var(--navy);color:#fff;border-color:var(--navy)}
.exp{border:1.5px solid #cbd5e1;background:#f8fafc;border-radius:10px;padding:7px 11px;font-size:12.5px;cursor:pointer;color:#334155;font-weight:600}
.acts{flex-basis:100%;background:#f8fafc;border-radius:12px;padding:4px 12px 8px;margin:4px 0 6px}
.acts .svc{padding:6px 0}.acts .nm{font-size:13px}
.mini{border:1.5px solid #cbd5e1;background:#fff;border-radius:8px;padding:5px 11px;font-size:12px;cursor:pointer;margin:6px 6px 0 0;font-weight:600}
.savebar{position:sticky;bottom:12px;background:#fff;border-radius:16px;padding:10px 14px;box-shadow:0 8px 30px rgba(15,23,42,.22);display:flex;gap:12px;align-items:center;z-index:25;margin-top:4px}
/* schedule */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.fgrid{grid-template-columns:1fr}}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{border:1.5px solid #cbd5e1;background:#fff;color:#475569;border-radius:10px;min-width:48px;padding:9px 10px;font-size:13px;font-weight:700;cursor:pointer}
.days button.sel{background:var(--navy);color:#fff;border-color:var(--navy)}

const sleep = (ms) => new Promise(r => setTimeout(r, ms));
function hex(buf) { return Array.from(new Uint8Array(buf)).map(b => (b < 16 ? '0' : '') + b.toString(16)).join(''); }
