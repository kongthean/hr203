<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Maintenance Mode</title>
<style>
  :root { --bg:#f1f5f9; --card:#fff; --ink:#0f172a; --mute:#64748b; --line:#e2e8f0; --brand:#0f172a; --green:#16a34a; --amber:#d97706; --red:#dc2626; }
  * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Khmer","Khmer OS",sans-serif; }
  body { background:var(--bg); color:var(--ink); min-height:100vh; }
  header { background:var(--brand); color:#fff; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  header h1 { font-size:17px; font-weight:700; }
  .lang-dropdown { position:relative; display:inline-block; margin-left:auto; }
  .lang-btn { background:#1e293b; border:1px solid #334155; padding:4px 8px; border-radius:4px; cursor:pointer; display:flex; align-items:center; gap:6px; color:#f8fafc; font-size:12px; transition:background .2s; }
  .lang-btn:hover { background:#334155; }
  .flag-icon { width:22px; height:14px; border-radius:2px; object-fit:cover; display:inline-block; box-shadow:0 0 1px rgba(0,0,0,.5); }
  .lang-menu { display:none; position:absolute; right:0; top:110%; background:#fff; border:1px solid #cbd5e1; border-radius:6px; box-shadow:0 4px 12px rgba(0,0,0,.15); min-width:130px; z-index:200; overflow:hidden; }
  .lang-menu.show { display:block; }
  .lang-option { display:flex; align-items:center; gap:8px; padding:8px 12px; color:#1e293b; font-size:12px; cursor:pointer; }
  .lang-option:hover { background:#f1f5f9; }
  .lang-option.active { font-weight:bold; background:#e2e8f0; }
  header { flex-wrap:nowrap; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border-radius:14px; padding:18px; margin-bottom:14px; box-shadow:0 1px 3px rgba(15,23,42,.08); }
  .card h2 { font-size:15px; margin-bottom:6px; }
  .sub { font-size:12.5px; color:var(--mute); line-height:1.5; margin-bottom:12px; }
  label { display:block; font-size:12.5px; font-weight:600; margin:10px 0 4px; }
  input[type=text], input[type=password], textarea { width:100%; padding:10px 12px; border:1px solid #cbd5e1; border-radius:8px; font-size:14px; background:#fff; }
  textarea { resize:vertical; min-height:44px; }
  .btn { border:0; border-radius:9px; padding:11px 18px; font-size:14px; font-weight:600; cursor:pointer; background:var(--brand); color:#fff; }
  .btn.sec { background:#e2e8f0; color:var(--ink); }
  .btn.green { background:var(--green); } .btn.red { background:var(--red); } .btn.amber { background:var(--amber); }
  .btn[disabled] { opacity:.5; cursor:not-allowed; }
  .err { color:var(--red); font-size:13px; margin-top:10px; min-height:18px; }
  .status { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .pill { display:inline-block; padding:5px 14px; border-radius:20px; font-weight:700; font-size:13px; color:#fff; }
  .pill.on { background:var(--red); } .pill.off { background:var(--green); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .grp { font-size:12px; font-weight:700; color:var(--mute); text-transform:uppercase; letter-spacing:.04em; margin:16px 0 6px; }
  .svc { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .svc:last-child { border-bottom:0; }
  .svc .nm { font-size:14px; font-weight:500; flex:1; min-width:150px; }
  .seg { display:inline-flex; border:1px solid #cbd5e1; border-radius:8px; overflow:hidden; }
  .seg button { border:0; background:#fff; padding:7px 12px; font-size:12.5px; cursor:pointer; color:#475569; }
  .seg button + button { border-left:1px solid #cbd5e1; }
  .seg button.sel-open { background:var(--green); color:#fff; } .seg button.sel-view { background:var(--amber); color:#fff; } .seg button.sel-closed { background:var(--red); color:#fff; }
  .exp { border:1px solid #cbd5e1; background:#f8fafc; border-radius:8px; padding:6px 10px; font-size:12.5px; cursor:pointer; color:#334155; }
  .acts { flex-basis:100%; background:#f8fafc; border-radius:10px; padding:4px 12px 8px; margin:4px 0 6px; }
  .acts .svc { padding:6px 0; }
  .acts .nm { font-size:13px; }
  .mini { border:1px solid #cbd5e1; background:#fff; border-radius:7px; padding:4px 10px; font-size:12px; cursor:pointer; margin:6px 6px 0 0; }
  .count { font-size:13px; color:var(--mute); margin:6px 0 2px; }
  .note { font-size:12px; color:var(--mute); margin-top:8px; line-height:1.5; }
  .hide { display:none !important; }
  .toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:#0f172a; color:#fff; padding:9px 18px; border-radius:20px; font-size:13px; z-index:50; }
  .toast.bad { background:var(--red); }
  .check { display:flex; gap:8px; align-items:flex-start; font-size:13px; margin-top:12px; font-weight:500; }
  .check input { margin-top:3px; }
</style>
<style id="hrLogoCss">
.hrLogo{display:inline-flex;align-items:flex-end;flex:none;font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;font-weight:700;color:#fff;font-size:30px;line-height:1;letter-spacing:-.01em;white-space:nowrap}
.hrLogo i{font-style:normal}
.hrLogo s{display:inline-block;width:.2em;height:.36em;background:#ff3030;margin:.072em .2em 0 .03em;align-self:flex-start;text-decoration:none}
@media (max-width:600px){.hrLogo{font-size:24px}}
header .hrLogo{font-size:24px}</style><style id="hrFtCss">
.hrft{text-align:center;padding:14px 0 18px;color:inherit;opacity:.62;line-height:1.2;font-family:Arial,Helvetica,sans-serif;width:100%}
.hrft .hrftL{display:inline-flex;align-items:flex-end;font-weight:700;font-size:16px;line-height:1;letter-spacing:-.01em;white-space:nowrap}
.hrft .hrftL i{font-style:normal}
.hrft .hrftL s{display:inline-block;width:.2em;height:.36em;background:#ff3030;margin:.072em .2em 0 .03em;align-self:flex-start;text-decoration:none}
.hrft .n{font-size:11px;font-weight:700;margin-top:5px}
.hrft .v{font-size:10px;margin-top:2px}
@media print{.hrft{display:none}}
</style>
</head>
<body><!-- SPLASH-BEGIN --><style id="kbSplashCss">
#kbSplash{position:fixed;left:0;top:0;right:0;bottom:0;z-index:2147483000;background:#102d4d;display:flex;align-items:center;justify-content:center;box-sizing:border-box;opacity:1;transition:opacity .5s ease;animation:kbsFail 0s linear 6s forwards}
#kbSplash.out{opacity:0;pointer-events:none}
@keyframes kbsFail{to{opacity:0;visibility:hidden;pointer-events:none}}
#kbSplash .lg{display:flex;align-items:flex-end;font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;font-weight:700;color:#fff;font-size:min(17vw,84px);line-height:1;letter-spacing:-.01em;animation:kbsOut .5s ease 2.15s forwards}
#kbSplash .lg i{font-style:normal;display:inline-block;opacity:0;will-change:transform,opacity}
#kbSplash .h{animation:kbsL .7s cubic-bezier(.2,.9,.25,1) .1s forwards}
#kbSplash .r{animation:kbsL .7s cubic-bezier(.2,.9,.25,1) .24s forwards}
#kbSplash .bar{width:.15em;height:.36em;margin:.072em .2em 0 .04em;align-self:flex-start;background:#ff3030;border-radius:0;opacity:0;transform-origin:50% 0;animation:kbsBar .7s cubic-bezier(.3,1.5,.4,1) 1.05s forwards}
#kbSplash .n1{animation:kbsR .6s cubic-bezier(.2,.9,.25,1) .55s forwards}
#kbSplash .n2{animation:kbsR .6s cubic-bezier(.2,.9,.25,1) .7s forwards}
#kbSplash .n3{animation:kbsR .6s cubic-bezier(.2,.9,.25,1) .85s forwards}
@keyframes kbsL{from{opacity:0;transform:translateX(-.6em)}to{opacity:1;transform:none}}
@keyframes kbsR{from{opacity:0;transform:translateX(.6em)}to{opacity:1;transform:none}}
