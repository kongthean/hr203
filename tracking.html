<title>Track your parcel - Cambodia Insight Express</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Khmer","Khmer OS System","Noto Sans SC","Microsoft YaHei",sans-serif;background:#eef2f7;color:#0f172a;font-size:15px;-webkit-text-size-adjust:100%}
header{background:linear-gradient(135deg,#0b1d3a 0%,#24406e 100%);color:#fff;padding:14px;display:flex;align-items:center;gap:10px}
header b{flex:1;font-size:17px}
header select{padding:5px 8px;border-radius:8px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);font-size:12px}
header select option{color:#0f172a}
main{max-width:560px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(15,23,42,.07);margin-bottom:14px}
h1{font-size:18px;margin:0 0 4px}.muted{color:#64748b;font-size:13px}
.srch{display:flex;gap:8px;margin-top:12px}
input{flex:1;min-width:0;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}
#no{text-transform:uppercase}
button{padding:12px 18px;border:0;border-radius:10px;font-weight:700;font-size:15px;color:#fff;background:linear-gradient(135deg,#0b1d3a 0%,#24406e 100%);cursor:pointer}
.no{font-size:20px;font-weight:900;letter-spacing:.5px}
.route{font-size:16px;font-weight:700;margin:6px 0}
.st{display:inline-block;padding:6px 14px;border-radius:16px;color:#fff;font-weight:800;font-size:14px}
.tl{border-left:3px solid #cbd5e1;margin:14px 0 0 6px;padding-left:16px}
.tl .it{position:relative;padding:0 0 16px}
.tl .it:before{content:"";position:absolute;left:-23px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--c,#64748b)}
.tl .it.first:before{box-shadow:0 0 0 4px rgba(37,99,235,.2)}
.tl b{font-size:15px}.tl .m{color:#64748b;font-size:13px}
.err{color:#b91c1c;font-weight:600}
.hide{display:none}
.tabs{display:flex;gap:8px;max-width:560px;margin:12px auto 0;padding:0 14px}
.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:#e2e8f0;color:#334155;padding:12px 10px;font-size:15px}
.tabs button svg{width:20px;height:20px}
.tabs button.on{background:linear-gradient(135deg,#0b1d3a 0%,#24406e 100%);color:#fff}
#map{height:55vh;min-height:300px;border-radius:12px;overflow:hidden;margin-top:12px;background:#dbeafe}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#ea580c;border:3px solid #0b1d3a;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pin:after{content:"";position:absolute;left:7px;top:7px;width:10px;height:10px;border-radius:50%;background:#fff}
.me{width:14px;height:14px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 3px rgba(37,99,235,.35)}
.bp-n{font-weight:800;font-size:15px}.bp-g{color:#64748b;font-size:12px;margin-bottom:4px}.bp-a{font-size:13px;margin:4px 0}
.bp-ph a{display:inline-block;margin:2px 6px 2px 0;padding:5px 10px;border-radius:14px;background:#e0f2fe;color:#075985;text-decoration:none;font-weight:700;font-size:13px}
.bp-nav{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.bp-nav a{flex:1;text-align:center;padding:8px 6px;border-radius:10px;color:#fff;text-decoration:none;font-weight:700;font-size:12px;background:#0b1d3a;min-width:80px}
.bp-nav a.g{background:#16a34a}.bp-nav a.w{background:#0ea5e9}.bp-nav a.a{background:#475569}
.mlist .grp{margin-top:12px;font-weight:800;color:#334155;font-size:13px;text-transform:uppercase;letter-spacing:.4px}
.mlist .it{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #eef2f7;cursor:pointer}
.mlist .it .ic{flex:0 0 34px;height:34px;border-radius:50%;background:#ea580c;color:#fff;display:flex;align-items:center;justify-content:center}
.mlist .it .ic svg{width:18px;height:18px}.mlist .it b{display:block;font-size:14px}.mlist .it span{color:#64748b;font-size:12px}
.fbtn{margin-top:10px;background:#16a34a;width:100%}
.tabs{gap:6px}.tabs button{font-size:13px;padding:11px 4px;gap:5px}.tabs button svg{width:18px;height:18px}
.tabs .bd{background:#dc2626;color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;margin-left:2px}
.alt{background:#e2e8f0;color:#0b1d3a;width:100%;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px}.alt svg{width:20px;height:20px}
#scanOv{position:fixed;inset:0;background:rgba(15,23,42,.92);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;gap:12px}
#scanOv.hide{display:none}#qrReader{width:100%;max-width:420px;min-height:300px;background:#000;border-radius:14px;overflow:hidden}
#scanOv .tx{color:#fff;font-weight:700;text-align:center}#scanOv .er{color:#fecaca;font-weight:700;text-align:center}
.fld{margin-top:10px}.fld label{display:block;font-weight:700;font-size:13px;margin-bottom:4px;color:#334155}.fld input{width:100%}
.lnk{background:none;color:#1d4ed8;padding:10px 0;font-weight:700;font-size:14px;width:100%;text-align:center}
.nt{padding:11px 10px;border-radius:10px;border:1px solid #e2e8f0;margin-top:8px;cursor:pointer}.nt.un{background:#eff6ff;border-color:#bfdbfe}.nt b{font-size:14px;display:block}.nt span{color:#64748b;font-size:12px}
.pc{padding:11px 0;border-bottom:1px solid #eef2f7;cursor:pointer}.pc .l1{display:flex;justify-content:space-between;gap:8px;align-items:center}.pc b{font-size:15px}.pc .l2{color:#64748b;font-size:13px;margin-top:2px}
.chip{display:inline-block;padding:3px 10px;border-radius:12px;color:#fff;font-weight:800;font-size:12px}
.sec{margin-top:16px;display:flex;justify-content:space-between;align-items:center}.sec b{font-size:16px}.sec button{padding:7px 12px;font-size:12px;background:#e2e8f0;color:#0b1d3a}
</style>
</head>
<body><!-- SPLASH-BEGIN --><style id="kbSplashCss">
#kbSplash{position:fixed;left:0;top:0;right:0;bottom:0;z-index:2147483000;background:#102d4d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding-top:16px;box-sizing:border-box;opacity:1;visibility:visible;transition:opacity .45s ease;animation:kbsFail .01s linear 3.6s forwards;-webkit-tap-highlight-color:transparent}
#kbSplash.out{opacity:0;pointer-events:none}
@keyframes kbsFail{to{opacity:0;visibility:hidden;pointer-events:none}}
#kbSplash .lg{position:relative;width:min(46vw,190px);aspect-ratio:300/281}
#kbSplash .lg img{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;will-change:transform,opacity}
#kbSplash .o{animation:kbsO .8s cubic-bezier(.2,.9,.25,1.15) .05s forwards}
#kbSplash .g{animation:kbsG 1.1s cubic-bezier(.2,.8,.2,1) .15s forwards}
#kbSplash .c{animation:kbsC .6s cubic-bezier(.2,.9,.3,1.3) .45s forwards}
@keyframes kbsO{from{opacity:0;transform:scale(.78)}to{opacity:1;transform:scale(1)}}
@keyframes kbsG{from{opacity:0;transform:rotate(-120deg) scale(.6)}to{opacity:1;transform:rotate(0) scale(1)}}
@keyframes kbsC{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
#kbSplash .wd{position:relative;height:56px;width:100%;display:flex;align-items:center;justify-content:center}
#kbSplash .wd span{position:absolute;left:0;right:0;text-align:center;color:#fff;font-weight:700;opacity:0;white-space:nowrap;filter:blur(8px);transform:translateY(12px);font-family:"Noto Sans Khmer","Khmer OS Battambang","Khmer Sangam MN","Leelawadee UI","PingFang SC","Noto Sans SC","Microsoft YaHei",-apple-system,"Segoe UI",system-ui,sans-serif}
#kbSplash .w1{font-size:34px;animation:kbsW .75s ease .55s forwards}
#kbSplash .w2{font-size:34px;letter-spacing:5px;text-indent:5px;animation:kbsW .75s ease 1.25s forwards}
#kbSplash .w3{font-size:34px;font-weight:500;letter-spacing:2px;text-indent:2px;animation:kbsW3 .75s ease 1.95s forwards}
@keyframes kbsW{0%{opacity:0;filter:blur(8px);transform:translateY(12px)}28%{opacity:1;filter:blur(0);transform:translateY(0)}72%{opacity:1;filter:blur(0);transform:translateY(0)}100%{opacity:0;filter:blur(6px);transform:translateY(-10px)}}
