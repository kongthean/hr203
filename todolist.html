<style>
:root { --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --mute:#64748b; --line:#e2e8f0; --navy:#0b1d3a; --red:#dc2626; --amber:#d97706; --blue:#2563eb; --green:#16a34a; --grey:#64748b; --soft:#f8fafc; }
@media (prefers-color-scheme: dark) { :root { --bg:#0b1220; --card:#111b2e; --ink:#e5edf8; --mute:#94a3b8; --line:#22314a; --soft:#0e1727; } }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Khmer","Noto Sans SC",Arial,sans-serif; font-size:15px; }
body { min-height:100vh; padding-bottom:calc(30px + env(safe-area-inset-bottom)); }
.hidden { display:none !important; }
button, input { font-family:inherit; font-size:16px; }
/* ---------- header ---------- */
.top { position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; padding:calc(10px + env(safe-area-inset-top)) 14px 10px; display:flex; align-items:center; gap:10px; }
.top h1 { font-size:18px; margin:0; flex:1; font-weight:800; letter-spacing:.2px; }
.top .who { font-size:14px; font-weight:700; opacity:1; max-width:34vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.iconBtn { height:36px; min-width:36px; border-radius:10px; border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08); color:#fff; font-size:14px; padding:0 10px; cursor:pointer; }
.wrap { max-width:720px; margin:0 auto; padding:12px 12px 0; }
/* ---------- login ---------- */
#loginBox { max-width:380px; margin:0 auto; padding:calc(40px + env(safe-area-inset-top)) 18px 24px; }
#loginBox .logo { width:72px; height:72px; border-radius:18px; display:block; margin:0 auto 12px; }
#loginBox h2 { text-align:center; margin:0 0 4px; font-size:22px; }
#loginBox p.sub { text-align:center; color:var(--mute); margin:0 0 18px; font-size:13px; }
.seg { display:flex; background:var(--line); border-radius:12px; padding:3px; gap:3px; margin-bottom:12px; }
.seg button { flex:1; height:38px; border:0; background:transparent; color:var(--mute); border-radius:10px; font-weight:700; font-size:14px; cursor:pointer; }
.seg button.on { background:var(--card); color:var(--ink); box-shadow:0 1px 4px rgba(0,0,0,.12); }
.field { margin-bottom:12px; }
.field label { display:block; font-size:12px; font-weight:700; color:var(--mute); margin-bottom:4px; }
.field input { width:100%; height:46px; border:1px solid var(--line); border-radius:12px; padding:0 14px; background:var(--card); color:var(--ink); }
.field input:focus { outline:2px solid var(--blue); border-color:transparent; }
.bigBtn { width:100%; height:48px; border:0; border-radius:12px; background:var(--navy); color:#fff; font-weight:800; font-size:16px; cursor:pointer; }
.bigBtn:disabled { opacity:.6; }
.err { color:var(--red); font-size:13px; text-align:center; margin:8px 0; min-height:18px; }
.linkBtn { background:none; border:0; color:var(--blue); font-size:13px; padding:8px; cursor:pointer; display:block; margin:6px auto 0; }
.langRow { display:flex; justify-content:center; gap:6px; margin-top:16px; }
.langRow button { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:6px 12px; font-size:13px; cursor:pointer; }
.langRow button.on { background:var(--navy); color:#fff; border-color:var(--navy); }
/* ---------- summary + filters ---------- */
.chips { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:10px; }
.chip { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:8px 4px; text-align:center; }
.chip b { display:block; font-size:22px; line-height:1.1; }
.chip span { font-size:11px; color:var(--mute); }
.chip.red b { color:var(--red); } .chip.amber b { color:var(--amber); } .chip.blue b { color:var(--blue); } .chip.grey b { color:var(--grey); }
.banner { border-radius:14px; padding:10px 14px; margin-bottom:10px; font-weight:700; font-size:14px; }
.banner.red { background:#fee2e2; color:#991b1b; border:1px solid #fecaca; }
.banner.amber { background:#fef3c7; color:#92400e; border:1px solid #fde68a; }
.banner.green { background:#dcfce7; color:#166534; border:1px solid #bbf7d0; }
@media (prefers-color-scheme: dark) { .banner.red { background:#3b1111; color:#fecaca; border-color:#7f1d1d; } .banner.amber { background:#3a2a07; color:#fde68a; border-color:#78350f; } .banner.green { background:#0d2a17; color:#bbf7d0; border-color:#14532d; } }
.filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.filters .seg { margin:0; flex:1 1 100%; }
.search { flex:1 1 100%; height:42px; border:1px solid var(--line); border-radius:12px; padding:0 14px; background:var(--card); color:var(--ink); }
/* ---------- task cards ---------- */
.groupH { font-size:12px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; margin:14px 4px 6px; }
.groupH.red { color:var(--red); } .groupH.amber { color:var(--amber); } .groupH.blue { color:var(--blue); } .groupH.grey { color:var(--grey); }

var PW_OK = !!(window.crypto && window.crypto.subtle && window.TextEncoder);
function pwHex(buf) { return Array.from(new Uint8Array(buf)).map(function (b) { return (b < 16 ? '0' : '') + b.toString(16); }).join(''); }
async function pwDerive(password, salt) {
  var key = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  var bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: new TextEncoder().encode(salt), iterations: 100000 }, key, 256);
  return 'pbkdf2$' + salt + '$' + pwHex(bits);
}
var SA_DOMAIN = 'staff.hr203.com';
function saHexStr(s) { return Array.from(new TextEncoder().encode(String(s))).map(function (b) { return (b < 16 ? '0' : '') + b.toString(16); }).join(''); }
function saLookupKey(role, username) { return saHexStr(role + '|' + username); }
function saEmail(id) { return id + '@' + SA_DOMAIN; }
async function saPw(pass, id) { return (await pwDerive(pass, 'staff-auth:' + id)).split('$')[2].slice(0, 48); }
async function saSignIn(id, pass) { return await firebase.auth().signInWithEmailAndPassword(saEmail(id), await saPw(pass, id)); }
function saSleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
async function saReadRetry(path) {
  var last = null;
  for (var i = 0; i < 40; i++) { try { return (await db.ref(path).once('value')).val(); } catch (e) { last = e; await saSleep(250); } }
  throw last;
}
async function backToAnon() { try { await firebase.auth().signOut(); } catch (e) {} try { await firebase.auth().signInAnonymously(); } catch (e) {} }
async function saCandidates(role, username) { var v = await saReadRetry('staffLookup/' + saLookupKey(role, username)); return v ? Object.keys(v) : []; }
async function secureLogin(role, user, pass) {
  var ids = await saCandidates(role, user);
  for (var n = 0; n < ids.length; n++) {
    var id = ids[n];
    try {
      var cred = await saSignIn(id, pass);
      var uid = (cred && cred.user ? cred.user : firebase.auth().currentUser).uid;
      var st = await saReadRetry('staff/' + uid);
      var acc = (st && st.role === role && st.key) ? await saReadRetry('accounts/' + st.key) : null;
      if (acc && acc.authId === id && acc.role === role && !acc.disabled) return Object.assign({ firebaseKey: st.key }, acc);
      await backToAnon();
    } catch (e) { try { var cu = firebase.auth().currentUser; if (cu && !cu.isAnonymous) await backToAnon(); } catch (e2) {} }
  }
  return null;
}

function base32Decode(b32) {
  var al = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567', clean = (b32 || '').replace(/=+$/, '').toUpperCase().replace(/[^A-Z2-7]/g, ''), bits = '';
  for (var i = 0; i < clean.length; i++) { var v = al.indexOf(clean[i]); if (v !== -1) bits += v.toString(2).padStart(5, '0'); }
  var bytes = []; for (var j = 0; j + 8 <= bits.length; j += 8) bytes.push(parseInt(bits.substr(j, 8), 2));
  return new Uint8Array(bytes);
}
async function generateTOTP(secret, forTime) {
  var keyBytes = base32Decode(secret), counter = Math.floor((forTime || Date.now()) / 1000 / 30), cb = new ArrayBuffer(8), view = new DataView(cb);
  view.setUint32(0, Math.floor(counter / 0x100000000)); view.setUint32(4, counter >>> 0);
  var key = await crypto.subtle.importKey('raw', keyBytes, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
  var h = new Uint8Array(await crypto.subtle.sign('HMAC', key, new Uint8Array(cb))), off = h[h.length - 1] & 0xf;
  var bin = ((h[off] & 0x7f) << 24) | ((h[off + 1] & 0xff) << 16) | ((h[off + 2] & 0xff) << 8) | (h[off + 3] & 0xff);
  return (bin % 1000000).toString().padStart(6, '0');
}
async function verifyTOTP(secret, token) {
  var clean = (token || '').trim(); if (!/^\d{6}$/.test(clean)) return false;
  for (var s = -1; s <= 1; s++) { if ((await generateTOTP(secret, Date.now() + s * 30000)) === clean) return true; }
  return false;
}

var loginRole = 'admin', pending = null;
function setRole(r) { loginRole = r; document.getElementById('roleAdmin').classList.toggle('on', r === 'admin'); document.getElementById('roleHr').classList.toggle('on', r === 'hr'); }
function setErr(k) { document.getElementById('loginErr').textContent = k ? T(k) : ''; }
function showLogin() {
  stopData(); me = '';
  document.getElementById('appView').classList.add('hidden'); document.getElementById('loginView').classList.remove('hidden');
  document.getElementById('stepLogin').classList.remove('hidden'); document.getElementById('stepTotp').classList.add('hidden');
  document.getElementById('inPass').value = ''; setErr(''); applyLang();
}
async function doLogin() {
  var u = document.getElementById('inUser').value.trim(), p = document.getElementById('inPass').value.trim(), btn = document.getElementById('btnLogin');
  if (!u || !p) { setErr('loginFail'); return; }
  btn.disabled = true; setErr('');
  try {
    var found = await secureLogin(loginRole, u, p);
    if (!found) { setErr('loginFail'); return; }
    if (found.totpEnabled || found.totpSecret) {
      if (!found.totpSecret) { await backToAnon(); setErr('totpNotSetup'); return; }
      pending = found; document.getElementById('stepLogin').classList.add('hidden'); document.getElementById('stepTotp').classList.remove('hidden');
      document.getElementById('inTotp').value = ''; document.getElementById('backupField').classList.add('hidden'); document.getElementById('inTotp').parentNode.classList.remove('hidden'); document.getElementById('lnkBackup').classList.remove('hidden');
      setTimeout(function () { document.getElementById('inTotp').focus(); }, 80);
      return;
    }
    finishLogin(found);
  } catch (e) { setErr('loginFail'); }
  finally { btn.disabled = false; }
}
function showBackup() { document.getElementById('backupField').classList.remove('hidden'); document.getElementById('inTotp').parentNode.classList.add('hidden'); document.getElementById('lnkBackup').classList.add('hidden'); setErr(''); setTimeout(function () { document.getElementById('inBackup').focus(); }, 80); }
async function cancelTotp() { pending = null; await backToAnon(); showLogin(); }
async function doTotp() {
  if (!pending) return; setErr('');
  var backupMode = !document.getElementById('backupField').classList.contains('hidden');
  if (backupMode) {
    var code = document.getElementById('inBackup').value.trim().toUpperCase(); if (!code) return;
    try {
      var snap = await db.ref('accounts/' + pending.firebaseKey + '/backupCodes/' + code).once('value');
      if (!snap.exists() || snap.val() === true) { setErr('totpBad'); return; }
      await db.ref('accounts/' + pending.firebaseKey + '/backupCodes/' + code).set(true);
      var a = pending; pending = null; finishLogin(a);
    } catch (e) { setErr('totpBad'); }
    return;
  }
  var ok = await verifyTOTP(pending.totpSecret, document.getElementById('inTotp').value);
  if (!ok) { setErr('totpBad'); return; }
  var acc = pending; pending = null; finishLogin(acc);
}
function finishLogin(acc) {
  try { localStorage.setItem('tdTrust', JSON.stringify({ key: acc.firebaseKey, at: Date.now() })); } catch (e) {}
  startApp(acc.firebaseKey, acc.name || acc.username || '', acc.role);
}
async function doSignOut() { try { localStorage.removeItem('tdTrust'); } catch (e) {} await backToAnon(); showLogin(); }

/* stay signed in for 30 days on this phone; a different login (for example the main website in the same browser) shows the login again */
var authInit = false;
firebase.auth().onAuthStateChanged(async function (u) {
  if (!u) { try { await firebase.auth().signInAnonymously(); } catch (e) {} if (!authInit) { authInit = true; showLogin(); } return; }
  if (u.isAnonymous) { if (!authInit || me) { authInit = true; showLogin(); } return; }
  if (authInit && me) return;      /* already running */
  authInit = true;
  try {
    var st = await saReadRetry('staff/' + u.uid), tr = null;
    try { tr = JSON.parse(localStorage.getItem('tdTrust') || 'null'); } catch (e) {}
    if (st && st.key && tr && tr.key === st.key && Date.now() - tr.at < 30 * 86400000) { startApp(st.key, st.name || '', st.role); return; }
  } catch (e) {}
  await backToAnon(); showLogin();
});
