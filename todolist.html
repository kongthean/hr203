<style>
:root { --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --mute:#64748b; --line:#e2e8f0; --navy:#0b1d3a; --red:#dc2626; --amber:#d97706; --blue:#2563eb; --green:#16a34a; --grey:#64748b; --soft:#f8fafc; }
@media (prefers-color-scheme: dark) { :root { --bg:#0b1220; --card:#111b2e; --ink:#e5edf8; --mute:#94a3b8; --line:#22314a; --soft:#0e1727; } }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Khmer","Noto Sans SC",Arial,sans-serif; font-size:15px; }
body { min-height:100vh; padding-bottom:calc(30px + env(safe-area-inset-bottom)); }
.hidden { display:none !important; }
button, input { font-family:inherit; font-size:16px; }
/* ---------- header ---------- */
.top { position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; padding:calc(10px + env(safe-area-inset-top)) 14px 10px; display:flex; align-items:center; gap:10px; }
.top h1 { font-size:18px; margin:0; flex:1; font-weight:800; letter-spacing:.2px; }
.top .who { font-size:14px; font-weight:700; opacity:1; max-width:34vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.iconBtn { height:36px; min-width:36px; border-radius:10px; border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08); color:#fff; font-size:14px; padding:0 10px; cursor:pointer; }
.wrap { max-width:720px; margin:0 auto; padding:12px 12px 0; }
/* ---------- login ---------- */
#loginBox { max-width:380px; margin:0 auto; padding:calc(40px + env(safe-area-inset-top)) 18px 24px; }
#loginBox .logo { width:72px; height:72px; border-radius:18px; display:block; margin:0 auto 12px; }
#loginBox h2 { text-align:center; margin:0 0 4px; font-size:22px; }
#loginBox p.sub { text-align:center; color:var(--mute); margin:0 0 18px; font-size:13px; }
.seg { display:flex; background:var(--line); border-radius:12px; padding:3px; gap:3px; margin-bottom:12px; }
.seg button { flex:1; height:38px; border:0; background:transparent; color:var(--mute); border-radius:10px; font-weight:700; font-size:14px; cursor:pointer; }
.seg button.on { background:var(--card); color:var(--ink); box-shadow:0 1px 4px rgba(0,0,0,.12); }
.field { margin-bottom:12px; }
.field label { display:block; font-size:12px; font-weight:700; color:var(--mute); margin-bottom:4px; }
.field input { width:100%; height:46px; border:1px solid var(--line); border-radius:12px; padding:0 14px; background:var(--card); color:var(--ink); }
.field input:focus { outline:2px solid var(--blue); border-color:transparent; }
.bigBtn { width:100%; height:48px; border:0; border-radius:12px; background:var(--navy); color:#fff; font-weight:800; font-size:16px; cursor:pointer; }
.bigBtn:disabled { opacity:.6; }
.err { color:var(--red); font-size:13px; text-align:center; margin:8px 0; min-height:18px; }
.linkBtn { background:none; border:0; color:var(--blue); font-size:13px; padding:8px; cursor:pointer; display:block; margin:6px auto 0; }
.langRow { display:flex; justify-content:center; gap:6px; margin-top:16px; }
.langRow button { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:6px 12px; font-size:13px; cursor:pointer; }
.langRow button.on { background:var(--navy); color:#fff; border-color:var(--navy); }
/* ---------- summary + filters ---------- */
.chips { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:10px; }
.chip { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:8px 4px; text-align:center; }
.chip b { display:block; font-size:22px; line-height:1.1; }
.chip span { font-size:11px; color:var(--mute); }
.chip.red b { color:var(--red); } .chip.amber b { color:var(--amber); } .chip.blue b { color:var(--blue); } .chip.grey b { color:var(--grey); }
.banner { border-radius:14px; padding:10px 14px; margin-bottom:10px; font-weight:700; font-size:14px; }
.banner.red { background:#fee2e2; color:#991b1b; border:1px solid #fecaca; }
.banner.amber { background:#fef3c7; color:#92400e; border:1px solid #fde68a; }
.banner.green { background:#dcfce7; color:#166534; border:1px solid #bbf7d0; }
@media (prefers-color-scheme: dark) { .banner.red { background:#3b1111; color:#fecaca; border-color:#7f1d1d; } .banner.amber { background:#3a2a07; color:#fde68a; border-color:#78350f; } .banner.green { background:#0d2a17; color:#bbf7d0; border-color:#14532d; } }
.filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.filters .seg { margin:0; flex:1 1 100%; }
.search { flex:1 1 100%; height:42px; border:1px solid var(--line); border-radius:12px; padding:0 14px; background:var(--card); color:var(--ink); }
/* ---------- task cards ---------- */
.groupH { font-size:12px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; margin:14px 4px 6px; }
.groupH.red { color:var(--red); } .groupH.amber { color:var(--amber); } .groupH.blue { color:var(--blue); } .groupH.grey { color:var(--grey); }
.card { background:var(--card); border:1px solid var(--line); border-left-width:6px; border-radius:16px; padding:12px 14px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
.card.done { opacity:.75; }
.cardHead { display:flex; gap:8px; justify-content:space-between; align-items:flex-start; }
.cardHead b { font-size:14px; line-height:1.3; }
.pill { color:#fff; font-size:11px; font-weight:800; padding:4px 9px; border-radius:99px; white-space:nowrap; }
.meta { font-size:12px; color:var(--mute); margin-top:4px; }
.tag { display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px; background:var(--soft); border:1px solid var(--line); color:var(--mute); margin:4px 4px 0 0; }
.note { margin-top:8px; padding:9px 11px; background:#fffbeb; border:1px solid #fde68a; border-radius:12px; font-size:14px; line-height:1.45; white-space:pre-wrap; color:#78350f; }
@media (prefers-color-scheme: dark) { .note { background:#2a2108; border-color:#78350f; color:#fde68a; } }
.bar { height:6px; background:var(--line); border-radius:99px; margin:10px 0 4px; overflow:hidden; }
.bar div { height:100%; border-radius:99px; }
.step { display:flex; gap:10px; align-items:flex-start; padding:10px 8px; border-radius:12px; cursor:pointer; user-select:none; }
.step + .step { border-top:1px solid var(--line); }
.sdate { display:inline-block; font-size:11px; font-weight:800; padding:1px 8px; border-radius:99px; background:var(--line); color:var(--mute); margin-right:6px; }
.sdate.over { background:#fee2e2; color:#b91c1c; } .sdate.today { background:#fef3c7; color:#b45309; } .sdate.active { background:#dbeafe; color:#1d4ed8; }
.txt, .nowBox .t { white-space:pre-wrap; }
.step.nx { background:var(--soft); outline:2px solid var(--blue); outline-offset:-2px; }
.chk { flex:none; width:26px; height:26px; border:2px solid var(--mute); border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:900; color:#fff; margin-top:1px; }
.step.on .chk { background:var(--green); border-color:var(--green); }
.step.on .txt { text-decoration:line-through; color:var(--mute); }
.txt { flex:1; font-size:15px; line-height:1.35; }
.txt small { display:block; color:var(--mute); font-size:11px; margin-top:2px; text-decoration:none; }
.nowBox { margin-top:10px; background:var(--soft); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
.nowBox .lbl { font-size:11px; font-weight:800; color:var(--blue); text-transform:uppercase; letter-spacing:.5px; }
.nowBox .t { font-size:16px; font-weight:700; margin:2px 0 8px; }
.okBtn { width:100%; height:46px; border:0; border-radius:12px; background:var(--green); color:#fff; font-weight:800; font-size:15px; cursor:pointer; }
.ghost { height:36px; border:1px solid var(--line); background:var(--card); color:var(--mute); border-radius:10px; padding:0 12px; font-size:13px; cursor:pointer; margin-top:8px; }
.empty { text-align:center; color:var(--mute); padding:26px 10px; }
.toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#111827; color:#fff; padding:10px 16px; border-radius:12px; font-size:14px; z-index:50; max-width:90vw; text-align:center; }
.install { background:var(--card); border:1px dashed var(--mute); border-radius:14px; padding:10px 12px; margin-bottom:10px; font-size:13px; display:flex; gap:10px; align-items:center; }
.install button { margin-left:auto; }

.sel { flex:1 1 45%; min-width:0; height:42px; border:1px solid var(--line); border-radius:12px; padding:0 12px; background:var(--card); color:var(--ink); font-size:15px; appearance:none; -webkit-appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%); background-position:calc(100% - 18px) 18px,calc(100% - 13px) 18px; background-size:5px 5px; background-repeat:no-repeat; padding-right:30px; }
.togg { width:100%; height:40px; margin-top:10px; border:1px solid var(--line); background:var(--soft); color:var(--ink); border-radius:12px; font-weight:700; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; padding:0 14px; }
.togg i { font-style:normal; color:var(--mute); font-weight:600; font-size:12px; }
.card { border-radius:18px; box-shadow:0 2px 10px rgba(15,23,42,.06); }
.chip { border:0; box-shadow:0 1px 4px rgba(15,23,42,.06); padding:10px 4px; }
.filters { gap:8px; }
.seg button { font-size:13px; height:36px; }
.top { box-shadow:0 2px 8px rgba(0,0,0,.2); }
.nowBox { background:linear-gradient(180deg,var(--soft),var(--card)); }
.sdate { display:inline-block; font-size:11px; font-weight:800; padding:1px 8px; border-radius:99px; background:var(--line); color:var(--mute); margin-right:6px; }
.sdate.over { background:#fee2e2; color:#b91c1c; } .sdate.today { background:#fef3c7; color:#b45309; } .sdate.active { background:#dbeafe; color:#1d4ed8; }
.txt, .nowBox .t { white-space:pre-wrap; }
.step.nx { outline-width:1.5px; }

/* v compact top area */
.pill.sm { display:inline-block; font-size:10px; padding:2px 8px; margin:4px 4px 0 0; vertical-align:top; }
.wrap { padding-top:8px; }
.banner { padding:6px 10px; margin-bottom:6px; font-size:12px; border-radius:10px; }
.chips { gap:6px; margin-bottom:6px; }
.chip { padding:5px 2px; border-radius:10px; }
.chip b { font-size:16px; }
.chip span { font-size:10px; }
.seg { margin-bottom:0; padding:2px; border-radius:10px; }
.seg button { height:28px; font-size:12px; border-radius:8px; }
.filters { gap:5px; margin-bottom:6px; }
.sel { flex:1 1 30%; height:32px; font-size:12px; padding:0 22px 0 8px; background-position:calc(100% - 13px) 14px,calc(100% - 8px) 14px; border-radius:10px; }
#selType { flex:1 1 30% !important; }
.search { height:32px; font-size:13px; border-radius:10px; }
.groupH { margin:8px 4px 4px; }

.nowBox .lbl { letter-spacing:.3px; }
.tag { margin:3px 3px 0 0; padding:2px 7px; font-size:10.5px; }
.pill.sm { margin:3px 3px 0 0; }
.swipe { position:relative; height:56px; border-radius:99px; background:linear-gradient(100deg,#1b46a8 0%,#2f63d6 55%,#4f7fe8 100%); border:1px solid rgba(255,255,255,.28); overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:pan-y; margin-top:4px; box-shadow:0 4px 14px rgba(37,99,235,.28), inset 0 1px 0 rgba(255,255,255,.25); }
.swipe::after { content:""; position:absolute; top:0; bottom:0; left:0; width:38%; background:linear-gradient(100deg,transparent 0%,rgba(255,255,255,.42) 50%,transparent 100%); transform:translateX(-130%) skewX(-18deg); animation:swShine 2.1s ease-in-out infinite; pointer-events:none; }
@keyframes swShine { 0% { transform:translateX(-130%) skewX(-18deg); } 70%,100% { transform:translateX(330%) skewX(-18deg); } }
.swFill { position:absolute; left:0; top:0; bottom:0; width:0; background:rgba(255,255,255,.22); border-radius:99px; }
.swTxt { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:0; text-align:center; font-weight:800; font-size:14px; letter-spacing:.6px; color:#fff; text-transform:uppercase; pointer-events:none; text-shadow:0 1px 2px rgba(0,0,0,.25); }
.swKnob { position:absolute; left:5px; top:5px; width:44px; height:44px; border-radius:50%; background:#fff; color:#2563eb; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,.3); cursor:grab; touch-action:none; z-index:2; }
.swipe.drag .swKnob { cursor:grabbing; }
.swipe:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
.swipe.done .swKnob { background:#fff; }
@media (prefers-reduced-motion:reduce) { .swipe::after { animation:none; opacity:0; } }
