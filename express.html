<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>Express</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Khmer","Khmer OS System","Noto Sans SC","Microsoft YaHei",sans-serif;background:#eef2f7;color:#0f172a;font-size:15px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.grad{background:linear-gradient(135deg,#0b1d3a 0%,#24406e 100%);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border:0;border-radius:10px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#0b1d3a 0%,#24406e 100%);color:#fff;font-size:14px}
.btn.green{background:linear-gradient(135deg,#064e3b 0%,#15906b 100%)}
.btn.red{background:linear-gradient(135deg,#6b0f2a 0%,#d63a62 100%)}
.btn.gray{background:#e2e8f0;color:#334155}
.btn.small{padding:6px 12px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:default}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font-size:15px}
textarea{min-height:60px;resize:vertical}
label{display:block;font-size:12px;font-weight:700;color:#334155;margin:0 0 4px}
.fg{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(15,23,42,.07);margin-bottom:14px}
h2{margin:0 0 12px;font-size:18px}

    km: { link: 'ចូលជាម្ចាស់', title: 'របៀបម្ចាស់', sub: 'ជ្រើសរើសសាខាដើម្បីចូល។', acting: 'របៀបម្ចាស់៖ សាខា', exit: 'ចាកចេញ', out: 'ចាកចេញពីគណនី', none: 'រកមិនឃើញសាខាទេ។', notset: 'ការចូលជាម្ចាស់មិនទាន់ត្រូវបានដំឡើងនៅគេហទំព័រនេះទេ។ អ្នកគ្រប់គ្រង Express ត្រូវបើកម៉ឺនុយ ហើយចុច "ដំឡើងការចូលជាម្ចាស់" ជាមុន។', setup: 'ដំឡើងការចូលជាម្ចាស់', setupDone: 'ការចូលជាម្ចាស់រួចរាល់សម្រាប់គណនីម្ចាស់នេះ។', setupHave: 'ការចូលជាម្ចាស់ត្រូវបានដំឡើងរួចហើយ។', setupFail: 'មិនអាចដំឡើងការចូលជាម្ចាស់បានទេ។' },
    zh: { link: '所有者入口', title: '所有者模式', sub: '选择要进入的网点。', acting: '所有者模式：网点', exit: '退出', out: '退出登录', none: '没有找到网点。', notset: '本站尚未设置所有者入口。请先由 Express 管理员打开菜单并点击“设置所有者入口”。', setup: '设置所有者入口', setupDone: '该所有者账户的入口已就绪。', setupHave: '该所有者账户已设置过入口。', setupFail: '无法设置所有者入口。' }
  };
  function L() { return TX[LANG] || TX.en; }
  function $$(i) { return document.getElementById(i); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var pick = $$('xpOwnPick'), bar = $$('xpOwnBar');
  async function keys(acc) {
    var id = (await OwnerLogin.derive(acc.__pw, 'express-owner-id:' + acc.authId)).slice(0, 16);
    var pw = await OwnerLogin.derive(acc.__pw, 'express-owner-pw:' + acc.authId);
    return { email: 'o.' + id + '@' + MAILD, pw: pw };
  }
  /* 1) Owner access link on the login box */
  var box = document.querySelector('#login .box'); var lk = document.createElement('button'); lk.type = 'button'; lk.className = 'xpOwnLink'; box.appendChild(lk);
  function lab() { lk.textContent = L().link; } lab(); setInterval(lab, 1500);
  lk.onclick = function () {
    OwnerLogin.open(function (acc) {
      OwnerLogin.audit('owner_enter', PAGE, '', 'Express ' + PAGE, 'Owner entered the ' + PAGE + ' site', acc.name || acc.username);
      keys(acc).then(function (k) { return OwnerLogin.signOutHR().then(function () { return auth.signInWithEmailAndPassword(k.email, k.pw); }); })
        .catch(function (e) { $('lerr').textContent = L().notset; });
    });
  };
  /* 2) one-time setup, started by a normal Express admin from the menu */
  var _om = openMenu;
  openMenu = function () {
    _om.apply(this, arguments);
    try {
      if (!isAdmin() || (me && me.owner)) return;
      var acts = document.querySelector('#dlgHost .acts'); if (!acts) return;
      var b = document.createElement('button'); b.className = 'btn gray'; b.textContent = L().setup;
      b.onclick = function () {
        closeDlg();
        OwnerLogin.open(function (acc) {
          keys(acc).then(function (k) {
            return mkAuthUser(k.email, k.pw).then(function (uid) {
              return db.ref('staff/' + uid).set({ name: acc.name || 'Owner', username: 'owner', role: 'admin', branch: 'HO', active: true, owner: true, at: Date.now() });
            }).then(function () { OwnerLogin.audit('owner_setup', PAGE, '', 'Express ' + PAGE, 'Owner access set up', acc.name || acc.username); toast(L().setupDone); });
          }).catch(function (e) { toast(e && e.code === 'auth/email-already-in-use' ? L().setupHave : L().setupFail); })
            .then(function () { return OwnerLogin.signOutHR(); });
        });
      };
      acts.insertBefore(b, acts.firstChild);
    } catch (e) {}
  };
  /* 3) owners never show in the staff list of other admins */
  var _sh = staffHtml;
  staffHtml = function () {
    try { Object.keys(staffCache || {}).forEach(function (k) { if (staffCache[k] && staffCache[k].owner === true) delete staffCache[k]; }); } catch (e) {}
    return _sh.apply(this, arguments);
  };
  /* 4) Agent site: the Owner chooses a branch */
  function barOn(name) {
    bar.innerHTML = '<span><b>' + esc(L().acting) + '</b> ' + esc(name) + '</span><button type="button" id="xpOwnExit">' + esc(L().exit) + '</button>';
    $$('xpOwnExit').onclick = function () { sessionStorage.removeItem('xpOwnBranch'); location.reload(); };
    document.body.classList.add('xpOwnMode');
  }
  window.xpOwnerEnter = function () {
    if (PAGE !== 'agent') return false;
    var b = sessionStorage.getItem('xpOwnBranch');
    if (b) { me.branch = b; showIn(b); return true; }
    showPicker(); return true;
  };
  function showIn(code) {
    me.branch = code; pick.style.display = 'none';
    $('login').classList.add('hide'); $('app').classList.remove('hide'); tab = 'dash'; startData(); applyLang();
    db.ref('branches/' + code).once('value').then(function (s) { barOn((s.val() && s.val().name) || code); }).catch(function () { barOn(code); });
  }
  function showPicker() {
    $('login').classList.add('hide'); $('app').classList.add('hide'); pick.style.display = 'block';
    db.ref('branches').once('value').then(function (s) {
      var v = s.val() || {}, l = Object.keys(v).filter(function (c) { return v[c] && v[c].active !== false; }).sort().map(function (c) { return { c: c, n: v[c].name || c }; }), x = L();
      pick.innerHTML = '<div class="wrap"><h3>' + esc(x.title) + '</h3><div class="sub">' + esc(x.sub) + '</div><div class="list">' + (l.length ? l.map(function (b) { return '<div class="row" data-c="' + esc(b.c) + '">' + esc(b.n) + '</div>'; }).join('') : '<div class="sub" style="padding:12px">' + esc(x.none) + '</div>') + '</div><button type="button" class="out" id="xpOwnOut">' + esc(x.out) + '</button></div>';
      Array.prototype.forEach.call(pick.querySelectorAll('.row'), function (r) { r.onclick = function () { var c = r.getAttribute('data-c'); sessionStorage.setItem('xpOwnBranch', c); showIn(c); }; });
      $$('xpOwnOut').onclick = function () { sessionStorage.removeItem('xpOwnBranch'); pick.style.display = 'none'; logout(); };
    });
  }
})();
