<style>
:root { --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --mute:#64748b; --line:#e2e8f0; --navy:#0b1d3a; --red:#dc2626; --amber:#d97706; --blue:#2563eb; --green:#16a34a; --grey:#64748b; --soft:#f8fafc; }
@media (prefers-color-scheme: dark) { :root { --bg:#0b1220; --card:#111b2e; --ink:#e5edf8; --mute:#94a3b8; --line:#22314a; --soft:#0e1727; } }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Khmer","Noto Sans SC",Arial,sans-serif; font-size:15px; }
body { min-height:100vh; padding-bottom:calc(30px + env(safe-area-inset-bottom)); }
.hidden { display:none !important; }
button, input { font-family:inherit; font-size:16px; }
/* ---------- header ---------- */
.top { position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; padding:calc(10px + env(safe-area-inset-top)) 14px 10px; display:flex; align-items:center; gap:10px; }
.top h1 { font-size:18px; margin:0; flex:1; font-weight:800; letter-spacing:.2px; }
.top .who { font-size:14px; font-weight:700; opacity:1; max-width:34vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.iconBtn { height:36px; min-width:36px; border-radius:10px; border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08); color:#fff; font-size:14px; padding:0 10px; cursor:pointer; }
.wrap { max-width:720px; margin:0 auto; padding:12px 12px 0; }
/* ---------- login ---------- */
#loginBox { max-width:380px; margin:0 auto; padding:calc(40px + env(safe-area-inset-top)) 18px 24px; }
#loginBox .logo { width:72px; height:72px; border-radius:18px; display:block; margin:0 auto 12px; }
#loginBox h2 { text-align:center; margin:0 0 4px; font-size:22px; }
#loginBox p.sub { text-align:center; color:var(--mute); margin:0 0 18px; font-size:13px; }
.seg { display:flex; background:var(--line); border-radius:12px; padding:3px; gap:3px; margin-bottom:12px; }
.seg button { flex:1; height:38px; border:0; background:transparent; color:var(--mute); border-radius:10px; font-weight:700; font-size:14px; cursor:pointer; }
.seg button.on { background:var(--card); color:var(--ink); box-shadow:0 1px 4px rgba(0,0,0,.12); }
.field { margin-bottom:12px; }
.field label { display:block; font-size:12px; font-weight:700; color:var(--mute); margin-bottom:4px; }
.field input { width:100%; height:46px; border:1px solid var(--line); border-radius:12px; padding:0 14px; background:var(--card); color:var(--ink); }
.field input:focus { outline:2px solid var(--blue); border-color:transparent; }
.bigBtn { width:100%; height:48px; border:0; border-radius:12px; background:var(--navy); color:#fff; font-weight:800; font-size:16px; cursor:pointer; }
.bigBtn:disabled { opacity:.6; }
.err { color:var(--red); font-size:13px; text-align:center; margin:8px 0; min-height:18px; }
.linkBtn { background:none; border:0; color:var(--blue); font-size:13px; padding:8px; cursor:pointer; display:block; margin:6px auto 0; }
.langRow { display:flex; justify-content:center; gap:6px; margin-top:16px; }
.langRow button { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:6px 12px; font-size:13px; cursor:pointer; }
.langRow button.on { background:var(--navy); color:#fff; border-color:var(--navy); }
.toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#111827; color:#fff; padding:10px 16px; border-radius:12px; font-size:14px; z-index:50; max-width:90vw; text-align:center; }

body.bad { background:#b91c1c; }
body.warn { background:#c2410c; }
.top h1 { font-size:12px; text-transform:uppercase; letter-spacing:.5px; margin:0 auto 0 10px; padding-left:10px; border-left:1px solid rgba(255,255,255,.4); font-weight:700; }
.top .hrLogo { font-size:24px; }
.cam { position:relative; max-height:34vh; width:100%; border-radius:18px; overflow:hidden; background:#000; aspect-ratio:4/3; box-shadow:0 2px 10px rgba(0,0,0,.18); }
.cam video { width:100%; height:100%; object-fit:cover; display:block; }
.cam .frame { position:absolute; left:50%; top:50%; width:58%; aspect-ratio:1; transform:translate(-50%,-50%); border-radius:16px; box-shadow:0 0 0 999px rgba(0,0,0,.35); pointer-events:none; }
.cam .frame i { position:absolute; width:26px; height:26px; border:4px solid #fff; }
.cam .frame i:nth-child(1){left:-2px;top:-2px;border-right:0;border-bottom:0;border-top-left-radius:14px}
.cam .frame i:nth-child(2){right:-2px;top:-2px;border-left:0;border-bottom:0;border-top-right-radius:14px}
.cam .frame i:nth-child(3){left:-2px;bottom:-2px;border-right:0;border-top:0;border-bottom-left-radius:14px}
.cam .frame i:nth-child(4){right:-2px;bottom:-2px;border-left:0;border-top:0;border-bottom-right-radius:14px}
.cam .line { position:absolute; left:8%; right:8%; height:3px; background:#ff3030; box-shadow:0 0 10px #ff3030; animation:scanl 2.2s ease-in-out infinite; }
@keyframes scanl { 0%,100%{top:8%} 50%{top:90%} }
.cam .msg { position:absolute; left:0; right:0; bottom:0; padding:8px 12px; color:#fff; font-size:13px; text-align:center; background:linear-gradient(transparent,rgba(0,0,0,.65)); }
.cam .off { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:#cbd5e1; text-align:center; padding:20px; font-size:14px; background:#0f172a; }
.row { display:flex; gap:8px; margin-top:10px; }
.btn { flex:1; height:46px; border:0; border-radius:12px; background:var(--navy); color:#fff; font-weight:800; font-size:15px; cursor:pointer; }
.btn.alt { background:var(--card); color:var(--ink); border:1px solid var(--line); }
.manual { display:flex; gap:8px; margin-top:12px; }
.manual input { flex:1; min-width:0; height:46px; border:1px solid var(--line); border-radius:12px; padding:0 14px; background:var(--card); color:var(--ink); letter-spacing:1px; }
.manual .btn { flex:0 0 96px; }
.mlabel { font-size:12px; font-weight:700; color:var(--mute); margin:14px 0 0; }
.card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; margin-top:12px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
.hint { text-align:center; color:var(--mute); padding:22px 8px; font-size:14px; }
.banner { text-align:center; font-size:30px; font-weight:900; letter-spacing:2px; padding:10px 0 4px; }
.banner small { display:block; font-size:14px; font-weight:600; letter-spacing:0; opacity:.9; }
.res { display:flex; gap:14px; align-items:flex-start; }
.res .ph { width:96px; height:96px; border-radius:14px; background:var(--soft); flex:none; overflow:hidden; display:flex; align-items:center; justify-content:center; color:var(--mute); font-size:12px; }
.res .ph img { width:100%; height:100%; object-fit:cover; }
.res .nm { font-size:20px; font-weight:800; overflow-wrap:anywhere; }
.res .idv { font-size:14px; font-weight:800; color:var(--blue); letter-spacing:1px; }
.kv { margin-top:12px; display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:14px; }
.kv b { color:var(--mute); font-weight:700; }
.kv span { overflow-wrap:anywhere; }
.pill { display:inline-block; padding:3px 12px; border-radius:999px; font-weight:800; font-size:13px; }
.pill.active{background:#dcfce7;color:#166534}.pill.broken{background:#fee2e2;color:#991b1b}.pill.missing{background:#ffedd5;color:#9a3412}.pill.retired{background:#e2e8f0;color:#475569}
.result.bad .card { background:#fff; border-color:#fecaca; }
.result.bad .banner, .result.warn .banner { color:#fff; }
.rcard { padding:12px; border:1px solid var(--line); border-radius:14px; background:var(--card); margin-top:8px; }
.rcard .rn { font-weight:800; font-size:15px; overflow-wrap:anywhere; }
.rcard .rs { color:var(--mute); font-size:12px; margin-top:2px; }
.rbar { height:8px; background:var(--line); border-radius:6px; overflow:hidden; margin-top:8px; }
.rbar div { height:100%; background:#16a34a; }
.rcard .btn { margin-top:10px; height:42px; }
.rcard.on { border-color:#16a34a; box-shadow:0 0 0 2px rgba(22,163,74,.25); }
.rnote { margin-top:10px; padding:10px 12px; border-radius:12px; font-weight:700; font-size:14px; text-align:center; background:#dcfce7; color:#166534; }
.rnote.warn { background:#ffedd5; color:#9a3412; }
.lrow { display:flex; gap:10px; align-items:center; padding:8px 4px; border-bottom:1px solid var(--line); }
.lrow .ph { width:44px; height:44px; border-radius:8px; background:var(--soft); overflow:hidden; flex:none; display:flex; align-items:center; justify-content:center; color:var(--mute); font-size:10px; }
.lrow .ph img { width:100%; height:100%; object-fit:cover; }
@media (max-width:520px){ .top .who { display:none; } }
</style>
<style id="hrLogoCss">
.hrLogo{display:inline-flex;align-items:flex-end;flex:none;font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;font-weight:700;color:#fff;font-size:30px;line-height:1;letter-spacing:-.01em;white-space:nowrap}
.hrLogo i{font-style:normal}
.hrLogo s{display:inline-block;width:.2em;height:.36em;background:#ff3030;margin:.072em .2em 0 .03em;align-self:flex-start;text-decoration:none}
@media (max-width:600px){.hrLogo{font-size:24px}}
.top .hrLogo + h1{margin:0 auto 0 12px;padding-left:12px;border-left:1px solid rgba(255,255,255,.4);font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;line-height:1.2}</style>

<body><!-- SPLASH-BEGIN --><style id="kbSplashCss">
#kbSplash{position:fixed;left:0;top:0;right:0;bottom:0;z-index:2147483000;background:#102d4d;display:flex;align-items:center;justify-content:center;box-sizing:border-box;opacity:1;transition:opacity .5s ease;animation:kbsFail 0s linear 6s forwards}

@keyframes kbsFail{to{opacity:0;visibility:hidden;pointer-events:none}}
#kbSplash .lg{display:flex;align-items:flex-end;font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;font-weight:700;color:#fff;font-size:min(17vw,84px);line-height:1;letter-spacing:-.01em;animation:kbsOut .5s ease 2.15s forwards}
#kbSplash .lg i{font-style:normal;display:inline-block;opacity:0;will-change:transform,opacity}
#kbSplash .h{animation:kbsL .7s cubic-bezier(.2,.9,.25,1) .1s forwards}
#kbSplash .r{animation:kbsL .7s cubic-bezier(.2,.9,.25,1) .24s forwards}
#kbSplash .bar{width:.15em;height:.36em;margin:.072em .2em 0 .04em;align-self:flex-start;background:#ff3030;border-radius:0;opacity:0;transform-origin:50% 0;animation:kbsBar .7s cubic-bezier(.3,1.5,.4,1) 1.05s forwards}

#kbSplash .n3{animation:kbsR .6s cubic-bezier(.2,.9,.25,1) .85s forwards}
@keyframes kbsL{from{opacity:0;transform:translateX(-.6em)}to{opacity:1;transform:none}}
@keyframes kbsR{from{opacity:0;transform:translateX(.6em)}to{opacity:1;transform:none}}
@keyframes kbsBar{0%{opacity:0;transform:translateY(-1.1em) scaleY(.4)}60%{opacity:1;transform:translateY(.08em) scaleY(1.08)}100%{opacity:1;transform:none}}
@keyframes kbsOut{to{opacity:0;transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){#kbSplash .lg i{animation:none;opacity:1}#kbSplash .lg{animation:none}}
</style><div id="kbSplash" aria-hidden="true"><div class="lg"><i class="h">H</i><i class="r">R</i><i class="bar"></i><i class="n1">2</i><i class="n2">0</i><i class="n3">3</i></div></div><script>(function(){var s=document.getElementById('kbSplash');if(!s)return;var done=false;function hide(){if(done)return;done=true;s.classList.add('out');setTimeout(function(){try{s.remove();var c=document.getElementById('kbSplashCss');if(c)c.remove();}catch(e){}},520);}
var rm=false;try{rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}

    <h2 data-i="loginTitle">Sign in</h2>
    <p class="sub" data-i="loginSub">Use the same account as the main system.</p>
    <div id="stepLogin">
      <div class="seg"><button type="button" id="roleAdmin" class="on" onclick="setRole('admin')" data-i="roleAdmin">Administration</button><button type="button" id="roleHr" onclick="setRole('hr')" data-i="roleHr">HR</button></div>

/* authenticator (same method as the main system) */
function base32Decode(b32) {

  var bin = ((h[off] & 0x7f) << 24) | ((h[off + 1] & 0xff) << 16) | ((h[off + 2] & 0xff) << 8) | (h[off + 3] & 0xff);

}

var loginRole = 'admin', pending = null;
function setRole(r) { loginRole = r; document.getElementById('roleAdmin').classList.toggle('on', r === 'admin'); document.getElementById('roleHr').classList.toggle('on', r === 'hr'); }

  stopData(); me = '';

  document.getElementById('stepLogin').classList.remove('hidden'); document.getElementById('stepTotp').classList.add('hidden');

async function doLogin() {
  var u = document.getElementById('inUser').value.trim(), p = document.getElementById('inPass').value.trim(), btn = document.getElementById('btnLogin');
  if (!u || !p) { setErr('loginFail'); return; }
  btn.disabled = true; setErr('');
  try {
    var found = await secureLogin(loginRole, u, p);
    if (!found) { setErr('loginFail'); return; }
    if (found.totpEnabled || found.totpSecret) {
      if (!found.totpSecret) { await backToAnon(); setErr('totpNotSetup'); return; }
      pending = found; document.getElementById('stepLogin').classList.add('hidden'); document.getElementById('stepTotp').classList.remove('hidden');
      document.getElementById('inTotp').value = ''; document.getElementById('backupField').classList.add('hidden'); document.getElementById('inTotp').parentNode.classList.remove('hidden'); document.getElementById('lnkBackup').classList.remove('hidden');
      setTimeout(function () { document.getElementById('inTotp').focus(); }, 80);

function showBackup() { document.getElementById('backupField').classList.remove('hidden'); document.getElementById('inTotp').parentNode.classList.add('hidden'); document.getElementById('lnkBackup').classList.add('hidden'); setErr(''); setTimeout(function () { document.getElementById('inBackup').focus(); }, 80); }
async function cancelTotp() { pending = null; await backToAnon(); showLogin(); }

    var code = document.getElementById('inBackup').value.trim().toUpperCase(); if (!code) return;

      if (!snap.exists() || snap.val() === true) { setErr('totpBad'); return; }

      var a = pending; pending = null; finishLogin(a);

function finishLogin(acc) {

  startApp(acc.firebaseKey, acc.name || acc.username || '', acc.role);
}
async function doSignOut() { try { localStorage.removeItem('tdTrust'); } catch (e) {} await backToAnon(); showLogin(); }

/* stay signed in for 30 days on this phone; a different login (for example the main website in the same browser) shows the login again */
var authInit = false;
firebase.auth().onAuthStateChanged(async function (u) {
  if (!u) { try { await firebase.auth().signInAnonymously(); } catch (e) {} if (!authInit) { authInit = true; showLogin(); } return; }
  if (u.isAnonymous) { if (!authInit || me) { authInit = true; showLogin(); } return; }
  if (authInit && me) return;      /* already running */
  authInit = true;
  try {
    var st = await saReadRetry('staff/' + u.uid), tr = null;
    try { tr = JSON.parse(localStorage.getItem('tdTrust') || 'null'); } catch (e) {}
    if (st && st.key && tr && tr.key === st.key && Date.now() - tr.at < 30 * 86400000) { startApp(st.key, st.name || '', st.role); return; }
  } catch (e) {}
  await backToAnon(); showLogin();
});



/* ================= scanner ================= */
var stream = null, scanTimer = null, detector = null, jsqrReady = false, torchOn = false, lastCode = '', lastAt = 0, current = null;
var cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });

  return new Promise(function (res) {
    if (window.jsQR) { jsqrReady = true; return res(true); }
    var urls = ['https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js', 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'], i = 0;
    (function next() {
      if (i >= urls.length) return res(false);
      var s = document.createElement('script'); s.src = urls[i++];
      s.onload = function () { jsqrReady = !!window.jsQR; if (jsqrReady) res(true); else next(); };
      s.onerror = next; document.head.appendChild(s);

}
async function camStart() {
  if (stream) return;

  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw { name: 'NotFoundError' };
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  } catch (e) {
    stream = null; $('camOff').style.display = 'flex';
    $('camOffTxt').textContent = (e && (e.name === 'NotFoundError' || e.name === 'OverconstrainedError')) ? T('camNone') : T('camDenied');
    return;
  }
  var v = $('vid'); v.srcObject = stream; try { await v.play(); } catch (e) {}
  $('sline').style.display = 'block'; $('frame').style.display = 'block'; $('btnStop').style.display = '';
  try { var tr = stream.getVideoTracks()[0], cap = tr.getCapabilities ? tr.getCapabilities() : {}; $('btnTorch').style.display = cap.torch ? '' : 'none'; } catch (e) {}
  if ('BarcodeDetector' in window) { try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { detector = null; } }
  if (!detector) await loadJsQR();
  camMsgSet(); loop();
}
function camStop() {
  if (scanTimer) { clearTimeout(scanTimer); scanTimer = null; }
  if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  var v = $('vid'); if (v) v.srcObject = null; torchOn = false;
  $('sline').style.display = 'none'; $('frame').style.display = 'none'; $('btnTorch').style.display = 'none'; $('btnStop').style.display = 'none';
  $('camOff').style.display = 'flex'; $('camOffTxt').textContent = ''; camMsgSet();
}
async function torchToggle() { try { torchOn = !torchOn; await stream.getVideoTracks()[0].applyConstraints({ advanced: [{ torch: torchOn }] }); } catch (e) { torchOn = false; } }
function loop() {
  if (!stream) return;
  var v = $('vid');
  var next = function () { scanTimer = setTimeout(loop, 120); };
  if (v.readyState < 2 || !v.videoWidth) return next();
  if (detector) { detector.detect(v).then(function (r) { if (r && r.length) onCode(r[0].rawValue); next(); }).catch(next); return; }
  if (jsqrReady) {
    var w = 480, h = Math.round(w * v.videoHeight / v.videoWidth); cv.width = w; cv.height = h; cx.drawImage(v, 0, 0, w, h);
    var d = cx.getImageData(0, 0, w, h), c = window.jsQR(d.data, w, h, { inversionAttempts: 'dontInvert' }); if (c && c.data) onCode(c.data);

function parseId(txt) { var s = String(txt || '').trim(); var m = s.match(/(?:^|[?&]id=)(\d{4,12})$/); return m ? m[1] : (/^\d{4,12}$/.test(s) ? s : ''); }
function beep(kind) {
  try { var A = window.AudioContext || window.webkitAudioContext, a = new A(), o = a.createOscillator(), g = a.createGain(); o.connect(g); g.connect(a.destination);
    o.type = 'sine'; o.frequency.value = kind === 'bad' ? 220 : 880; g.gain.value = 0.15; o.start(); o.stop(a.currentTime + (kind === 'bad' ? 0.5 : 0.15)); setTimeout(function () { try { a.close(); } catch (e) {} }, 700); } catch (e) {}

  lookup(id);
}
function manualFind() {
  var id = $('inId').value.replace(/\D/g, ''); if (id.length < 4) { toast(T('typeIdErr')); return; }
  lookup(id);
}
async function lookup(id) {

  try { rec = (await db.ref('assets/' + id).once('value')).val(); } catch (e) { toast(T('loadErr')); return; }
  current = rec ? Object.assign({ id: id }, rec) : { id: id, notFound: true };
  var st = current.notFound ? 'nf' : (current.status || 'active');
  beep(st === 'broken' || st === 'nf' || st === 'missing' ? 'bad' : 'ok');
  lastNote = null; if (activeRid) handleRound(id, current.notFound ? null : rec); renderResult(); renderNote();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function sLabel(s) { return T({ active: 'sActive', broken: 'sBroken', missing: 'sMissing', retired: 'sRetired' }[s] || 'sActive'); }
function renderResult() {
  var box = $('result'), a = current; document.body.classList.remove('bad', 'warn'); box.className = 'result';
  $('againRow').style.display = a ? '' : 'none';
  if (!a) { box.innerHTML = '<div class="card hint">' + esc(T('infoHint')) + '</div>'; return; }

  else if (st === 'missing') { document.body.classList.add('warn'); box.className = 'result warn'; banner = '<div class="banner">' + esc(T('bMissing')) + '<small>' + esc(T('missingMsg')) + '</small></div>'; }

    '<div class="kv"><b>' + esc(T('fCat')) + '</b><span>' + esc(a.category || '-') + '</span><b>' + esc(T('fDept')) + '</b><span>' + esc(a.dept || T('noDept')) + '</span><b>' + esc(T('fGroup')) + '</b><span>' + esc(a.group || '-') + '</span><b>' + esc(T('fType')) + '</b><span>' + esc(tr) + '</span>' +
    (a.scanType === 'track' ? '<b>' + esc(T('lastScan')) + '</b><span>' + esc(ls) + '</span>' : '') + (a.note ? '<b>' + esc(T('fNote')) + '</b><span>' + esc(a.note) + '</span>' : '') + '</div></div>';

function scanAgain() { current = null; lastCode = ''; lastNote = null; renderNote(); $('inId').value = ''; renderResult(); if (!stream) camStart(); window.scrollTo({ top: 0, behavior: 'smooth' }); }


/* ================= scan rounds ================= */
var rounds = [], activeRid = '', roundsOn = false, scanName = '', lastNote = null;
function rTotal(r) { return Object.keys(r.items || {}).length; }
function rDone(r) { return Object.keys(r.scans || {}).filter(function (k) { return (r.items || {})[k]; }).length; }
function getRound(rid) { for (var i = 0; i < rounds.length; i++) if (rounds[i].rid === rid) return rounds[i]; return null; }
function listenRounds() {
  if (roundsOn) return; roundsOn = true;
  db.ref('assetRounds').on('value', function (sn) {
    var v = sn.val() || {};
    rounds = Object.keys(v).map(function (k) { return Object.assign({ rid: k }, v[k]); }).sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
    rounds.forEach(function (r) {
      var t = rTotal(r); if (r.status === 'open' && t > 0 && rDone(r) >= t) { var now = Date.now(); db.ref('assetRounds/' + r.rid).update({ status: 'complete', completedAt: now, expireAt: now + 7 * 86400000 }); }
    });
    renderRounds();
  }, function () { roundsOn = false; });
}
var scanMode = 'normal', selDept = '', selGroup = '', selRid = '';
function setMode(m) { scanMode = m; if (m === 'normal') { activeRid = ''; selDept = ''; selGroup = ''; selRid = ''; $('leftBox').innerHTML = ''; } lastNote = null; renderNote(); renderRounds(); }
function selSet(k, v) { if (k === 'd') { selDept = v; selGroup = ''; selRid = ''; } else if (k === 'g') { selGroup = v; selRid = ''; } else selRid = v; renderRounds(); }
function opts(list, cur, ph) { return '<option value="">' + esc(ph) + '</option>' + list.map(function (x) { return '<option value="' + esc(x.v) + '"' + (x.v === cur ? ' selected' : '') + '>' + esc(x.t) + '</option>'; }).join(''); }
var SELST = 'width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;padding:0 12px;margin-top:6px';
function renderRounds() {
  var box = $('roundBox'); if (!box) return;
  var open = rounds.filter(function (r) { return r.status === 'open'; });
  var act = activeRid ? getRound(activeRid) : null;

  var h = '<div class="row" style="margin-bottom:4px"><button class="btn' + (scanMode === 'normal' ? '' : ' alt') + '" onclick="setMode(\'normal\')">' + esc(T('mNormal')) + '</button><button class="btn' + (scanMode === 'round' ? '' : ' alt') + '" onclick="setMode(\'round\')">' + esc(T('mRound')) + '</button></div>';
  if (scanMode === 'normal') { box.innerHTML = h; return; }
  if (act) {
    var t = rTotal(act), a = rDone(act), pc = t ? Math.round(a * 100 / t) : 0;
    h += '<div class="rcard on"><div class="rn">' + esc(act.name || '') + '</div><div class="rs">' + esc([act.dept, act.group].filter(Boolean).join(' › ')) + '</div><div class="rs"><b>' + esc(T('rProg', { a: a, b: t })) + '</b></div><div class="rbar"><div style="width:' + pc + '%"></div></div>' +
      '<div class="row"><button class="btn alt" onclick="leftToggle()">' + esc(T('rLeft')) + '</button><button class="btn alt" onclick="roundStop()">' + esc(T('rStop')) + '</button></div></div>';

function roundStart(rid) { activeRid = rid; lastNote = null; renderNote(); $('leftBox').innerHTML = ''; renderRounds(); if (!stream) camStart(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

async function leftRender() {

  db.ref('assets/' + id + '/lastScan').set(now).catch(function () {});
  if (rDone(r) >= rTotal(r)) lastNote = { t: T('rAllDone'), warn: false };

/* ================= start / stop ================= */
function stopData() { camStop(); activeRid = ''; lastNote = null; current = null; document.body.classList.remove('bad', 'warn'); }
