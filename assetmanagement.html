<style>
:root { --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --mute:#64748b; --line:#e2e8f0; --navy:#0b1d3a; --red:#dc2626; --amber:#d97706; --blue:#2563eb; --green:#16a34a; --grey:#64748b; --soft:#f8fafc; }
@media (prefers-color-scheme: dark) { :root { --bg:#0b1220; --card:#111b2e; --ink:#e5edf8; --mute:#94a3b8; --line:#22314a; --soft:#0e1727; } }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Khmer","Noto Sans SC",Arial,sans-serif; font-size:15px; }
body { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; padding-bottom:calc(10px + env(safe-area-inset-bottom)); }
.wrap { width:100%; }
.hrft { margin-top:auto; }
.hidden { display:none !important; }
button, input { font-family:inherit; font-size:16px; }
/* ---------- header ---------- */
.top { position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; padding:calc(10px + env(safe-area-inset-top)) 14px 10px; display:flex; align-items:center; gap:10px; }
.top h1 { font-size:18px; margin:0; flex:1; font-weight:800; letter-spacing:.2px; }
.top .who { font-size:14px; font-weight:700; opacity:1; max-width:34vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.iconBtn { height:36px; min-width:36px; border-radius:10px; border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08); color:#fff; font-size:14px; padding:0 10px; cursor:pointer; }
.wrap { max-width:720px; margin:0 auto; padding:12px 12px 0; }
/* ---------- login ---------- */
#loginBox { max-width:380px; margin:0 auto; padding:calc(40px + env(safe-area-inset-top)) 18px 24px; }
#loginBox .logo { width:72px; height:72px; border-radius:18px; display:block; margin:0 auto 12px; }
#loginBox h2 { text-align:center; margin:0 0 4px; font-size:22px; }
#loginBox p.sub { text-align:center; color:var(--mute); margin:0 0 18px; font-size:13px; }
.seg { display:flex; background:var(--line); border-radius:12px; padding:3px; gap:3px; margin-bottom:12px; }
.seg button { flex:1; height:38px; border:0; background:transparent; color:var(--mute); border-radius:10px; font-weight:700; font-size:14px; cursor:pointer; }
.seg button.on { background:var(--card); color:var(--ink); box-shadow:0 1px 4px rgba(0,0,0,.12); }
.field { margin-bottom:12px; }
.field label { display:block; font-size:12px; font-weight:700; color:var(--mute); margin-bottom:4px; }
.field input { width:100%; height:46px; border:1px solid var(--line); border-radius:12px; padding:0 14px; background:var(--card); color:var(--ink); }
.field input:focus { outline:2px solid var(--blue); border-color:transparent; }
.bigBtn { width:100%; height:48px; border:0; border-radius:12px; background:var(--navy); color:#fff; font-weight:800; font-size:16px; cursor:pointer; }
.bigBtn:disabled { opacity:.6; }
.err { color:var(--red); font-size:13px; text-align:center; margin:8px 0; min-height:18px; }
.linkBtn { background:none; border:0; color:var(--blue); font-size:13px; padding:8px; cursor:pointer; display:block; margin:6px auto 0; }
.langRow { display:flex; justify-content:center; gap:6px; margin-top:16px; }
.langRow button { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:6px 12px; font-size:13px; cursor:pointer; }
.langRow button.on { background:var(--navy); color:#fff; border-color:var(--navy); }
.toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:#111827; color:#fff; padding:10px 16px; border-radius:12px; font-size:14px; z-index:50; max-width:90vw; text-align:center; }

body.bad { }
body.warn { }
.top h1 { font-size:12px; text-transform:uppercase; letter-spacing:.5px; margin:0 auto 0 10px; padding-left:10px; border-left:1px solid rgba(255,255,255,.4); font-weight:700; }
.top .hrLogo { font-size:24px; }
.cam { position:relative; max-height:27vh; width:100%; border-radius:16px; overflow:hidden; background:#000; aspect-ratio:16/9; margin-top:8px; box-shadow:0 2px 10px rgba(0,0,0,.18); }
.cam video { width:100%; height:100%; object-fit:cover; display:block; }
.cam .frame { position:absolute; left:50%; top:45%; height:74%; width:auto; aspect-ratio:1; transform:translate(-50%,-50%); border-radius:16px; box-shadow:0 0 0 999px rgba(0,0,0,.35); pointer-events:none; }
.cam .frame i { position:absolute; width:22px; height:22px; border:4px solid #fff; }
.cam .frame i:nth-child(1){left:-2px;top:-2px;border-right:0;border-bottom:0;border-top-left-radius:14px}
.cam .frame i:nth-child(2){right:-2px;top:-2px;border-left:0;border-bottom:0;border-top-right-radius:14px}
.cam .frame i:nth-child(3){left:-2px;bottom:-2px;border-right:0;border-top:0;border-bottom-left-radius:14px}
.cam .frame i:nth-child(4){right:-2px;bottom:-2px;border-left:0;border-top:0;border-bottom-right-radius:14px}
.cam .line { position:absolute; left:8%; right:8%; height:3px; background:#ff3030; box-shadow:0 0 10px #ff3030; animation:scanl 2.2s ease-in-out infinite; }
@keyframes scanl { 0%,100%{top:8%} 50%{top:90%} }
.cam .msg { position:absolute; left:0; right:0; bottom:0; padding:8px 12px; color:#fff; font-size:13px; text-align:center; background:linear-gradient(transparent,rgba(0,0,0,.65)); }
.cam .off { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:#cbd5e1; text-align:center; padding:20px; font-size:14px; background:#0f172a; }
.row { display:flex; gap:8px; margin-top:10px; }
.btn { flex:1; height:46px; border:0; border-radius:12px; background:var(--navy); color:#fff; font-weight:800; font-size:15px; cursor:pointer; }
.btn.alt { background:var(--card); color:var(--ink); border:1px solid var(--line); }
.manual { display:flex; gap:8px; margin-top:12px; }
.manual input { flex:1; min-width:0; height:38px; font-size:16px; border:1px solid var(--line); border-radius:10px; padding:0 12px; background:var(--card); color:var(--ink); letter-spacing:1px; }
.manual .btn { flex:0 0 96px; }
.mlabel { font-size:12px; font-weight:700; color:var(--mute); margin:14px 0 0; }
.card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; margin-top:12px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
.hint { text-align:center; color:var(--mute); padding:22px 8px; font-size:14px; }
.banner { text-align:center; font-size:30px; font-weight:900; letter-spacing:2px; padding:10px 0 4px; }
.banner small { display:block; font-size:14px; font-weight:600; letter-spacing:0; opacity:.9; }
.res { display:flex; gap:14px; align-items:flex-start; }
.res .ph { width:96px; height:96px; border-radius:14px; background:var(--soft); flex:none; overflow:hidden; display:flex; align-items:center; justify-content:center; color:var(--mute); font-size:12px; }
.res .ph img { width:100%; height:100%; object-fit:cover; }
.res .nm { font-size:20px; font-weight:800; overflow-wrap:anywhere; }
.res .idv { font-size:14px; font-weight:800; color:var(--blue); letter-spacing:1px; }
.kv { margin-top:12px; display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:14px; }
.kv b { color:var(--mute); font-weight:700; }
.kv span { overflow-wrap:anywhere; }
.pill { display:inline-block; padding:3px 12px; border-radius:999px; font-weight:800; font-size:13px; }
.pill.active{background:#dcfce7;color:#166534}.pill.broken{background:#fee2e2;color:#991b1b}.pill.missing{background:#ffedd5;color:#9a3412}.pill.retired{background:#e2e8f0;color:#475569}
.result.bad .card { background:#fef2f2; border-color:#fecaca; }
.result.warn .card { background:#fff7ed; border-color:#fed7aa; }
.result.bad .banner { color:#b91c1c; }
.result.warn .banner { color:#c2410c; }
.result.bad .banner small, .result.warn .banner small { color:inherit; opacity:.85; }
.rcard { padding:12px; border:1px solid var(--line); border-radius:14px; background:var(--card); margin-top:8px; }
.rcard .rn { font-weight:800; font-size:15px; overflow-wrap:anywhere; }
.rcard .rs { color:var(--mute); font-size:12px; margin-top:2px; }
.rbar { height:8px; background:var(--line); border-radius:6px; overflow:hidden; margin-top:8px; }
.rbar div { height:100%; background:#16a34a; }
.rcard .btn { margin-top:10px; height:42px; }
.rcard.on { border-color:#16a34a; box-shadow:0 0 0 2px rgba(22,163,74,.25); }
.lbl { font-weight:800; font-size:13px; color:var(--mute); margin-top:12px; }
.lbl:first-child { margin-top:0; }
.hero { text-align:center; padding:18px 4px 6px; }
.hero h2 { margin:0; font-size:22px; font-weight:900; color:var(--ink); }
.hero p { margin:6px 0 0; color:var(--mute); font-size:14px; }
.tile { display:flex; align-items:center; gap:16px; width:100%; margin-top:14px; padding:18px; border:1px solid var(--line); border-radius:20px; background:var(--card); color:var(--ink); text-align:left; cursor:pointer; box-shadow:0 2px 10px rgba(0,0,0,.08); font-family:inherit; }
.tile:active { transform:scale(.985); }
.tile .ic { flex:none; width:68px; height:68px; border-radius:18px; display:flex; align-items:center; justify-content:center; }
.tile .ic.b { background:linear-gradient(135deg,#1d4ed8,#0b1d3a); }
.tile .ic.g { background:linear-gradient(135deg,#16a34a,#0f5132); }
.tile .tt { font-size:19px; font-weight:900; }
