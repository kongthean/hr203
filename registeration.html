<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Attendance Face Scan</title>
<!-- Face Attendance - employee scan page (v1, ships with system.html v6.98).
     Employees open this page on their phone; it goes straight to a face scan with no buttons. It
     identifies the employee by face (matching against the face templates the admin enrolled in
     system.html), looks up that employee's shift for the day, decides from the time whether the scan
     is a check-in / half-day leave request / full-day leave request / check-out (same rules engine as
     system.html), and saves the scan with photo, location and time. It uses the SAME Firebase
     project as system.html and never touches employee, leave or Master Sheet data. -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
:root { --bg1:#0f172a; --bg2:#1e3a8a; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --ok:#16a34a; --bad:#dc2626; --warn:#d97706; --accent:#2563eb; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; height:100%; }
body { font-family:'Khmer OS','Noto Sans Khmer','Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; background:linear-gradient(160deg,var(--bg1),var(--bg2)); color:#fff; display:flex; justify-content:center; overflow:hidden; }
.app { width:100%; max-width:560px; height:100vh; height:100dvh; padding:max(8px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom)); display:flex; flex-direction:column; align-items:stretch; gap:6px; }
.top { width:100%; display:flex; justify-content:space-between; align-items:center; gap:8px; flex:0 0 auto; }
.title { font-size:15px; font-weight:700; line-height:1.25; }
.langs { display:flex; gap:4px; flex:0 0 auto; }
.langs button { background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.25); border-radius:14px; padding:7px 11px; font-size:13px; cursor:pointer; min-height:34px; }
.langs button.on { background:#fff; color:var(--bg2); font-weight:700; }
.clockrow { flex:0 0 auto; text-align:center; line-height:1.1; }
.clock { font-size:36px; font-weight:800; letter-spacing:1px; font-variant-numeric:tabular-nums; }
.dateline { font-size:13px; color:#cbd5e1; margin-top:2px; }
/* the camera takes all the remaining height of the phone screen */
.cam { position:relative; flex:1 1 auto; min-height:260px; width:100%; border-radius:18px; overflow:hidden; background:#000; border:4px solid rgba(255,255,255,.4); box-shadow:0 8px 30px rgba(0,0,0,.45); }
.cam.found { border-color:#22c55e; }
.cam video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
/* the box that follows the face: red while a face is seen but not recognised, green once it is recognised */
.facebox { position:absolute; border:4px solid #ef4444; border-radius:10px; box-shadow:0 0 0 1px rgba(0,0,0,.35); pointer-events:none; transition:left .12s linear, top .12s linear, width .12s linear, height .12s linear, border-color .15s; }
.facebox.ok { border-color:#22c55e; }

/* ---------------------------------------------------------------------------------------------
   v7.01 scanning model: every scan is simply the next event of the day - the FIRST scan is a
   check-in (IN), then the scans alternate OUT, IN, OUT ... The system looks at what the employee
   already scanned, never at the clock alone:
     - nothing scanned yet            -> IN (even if it is during the break: coming back after morning leave)
     - last event was IN              -> OUT (going out / leaving / going home)
     - last event was OUT             -> IN  (back again)
   Valid scan times: any minute from 15 min before the shift start until the overtime limit (a first
   IN after the start is simply late; a check-out is NOT limited to a window). Time away from work
   between an OUT and a later IN counts as work (the employee was out on company business); the
   break itself is never paid.
   --------------------------------------------------------------------------------------------- */

/* Lateness in blocks (1 minute late = one block, e.g. 30 minutes; 31 minutes late = two blocks). */
function faLateBlocks(minutesLate, block) { return minutesLate > 0 ? Math.ceil(minutesLate / block) * block : 0; }
function faLateFor(def, m) { return faLateBlocks(m - def.start, def.lateBlock); }

/* Events already recorded for the day, oldest first. state = { ev:{key:{k,m,t}}, ... } and, for days
   recorded before v7.01, the old { checkin, checkout, leave } slots. */
function faStateEvents(state) {

    if (state.ev && typeof state.ev === 'object') {

        });

    out.sort(function (a, b) { return (a.m - b.m) || (a.k === 'in' ? -1 : 1); });
    return out;
}

/* Paid minutes (the break is not paid) between minute a and minute b of the shift. */
function faPaidMin(def, a, b) {
    return faOverlap(a, b, def.start, def.breakStart) + faOverlap(a, b, def.breakEnd, def.end);
}
/* Time missed before the first check-in, in minutes of paid time (shown as "Late"):
   M shift, first scan 13:57 -> work starts 14:00 -> 4 h morning + 2 h = 6 h late. */
function faLateMissed(def, m) {
    if (m >= def.end) return 0;
    return faPaidMin(def, def.start, faEffStart(def, m));

    var next = (Math.floor(m / 60) + 1) * 60;
    if (def.breakStart > m && def.breakStart < next) next = def.breakStart;
    return next;
}

/* Where paid work starts for a first check-in at minute m (late rules; the break is not paid). */
function faEffStart(def, m) {
    if (m < def.breakStart) return def.start + faLateFor(def, m);
    if (m < def.breakEnd) return def.breakEnd;
    return def.breakEnd + faLateBlocks(m - def.breakEnd, def.lateBlock);

/* Where paid work ends for the LAST check-out at minute m (any minute is a valid check-out):
   - in the break: the break start (the morning counts, e.g. 07:00-11:00 = 4h);
   - before the shift end: rounded DOWN to the previous half hour, so the missing time is counted in
     blocks of 30 minutes (M shift ends 16:00: 15:42 = 30 min leave, 15:10 = 1 hour leave);
   - at/after the shift end: as scanned - overtime counts whole hours after the shift end. */

    if (faInBreak(def, m)) return def.breakStart;
    if (m < def.end) {
        var mm = m + (allow > 0 ? allow : 0);   /* special early check-out allowance (pregnant / disabled employees) */
        if (mm >= def.end) return def.end;

   (shift end + overtime block, e.g. 16:16 to 16:29) is recorded and shown as a success, but it is NOT counted. */

/* What does a scan at minute m (on the shift's own time axis) mean for this shift, given the day's
   state so far? Returns { ok:true, kind:'in'|'out', ... } or { ok:false, code, params }. */
function faClassify(def, m, state) {
    if (m < def.openMin) return { ok: false, code: 'tooEarly', params: { at: faMinToHM(def.openMin) } };
    if (m > def.closeMin) return { ok: false, code: 'closed', params: {} };
    var evs = faStateEvents(state).filter(function (e) { return !(e.k === 'out' && faDeadOut(def, e.m)); });   /* an uncounted scan never changes what the next scan means */

    if (!last) {

        return { ok: true, kind: 'in', first: true, lateMinutes: faLateMissed(def, m), otHours: 0, leaveHours: 0, inBreak: faInBreak(def, m) };

       is refused and NOT counted (overtime = do not scan at the shift end, scan once when the overtime is finished). */
    if (last.m >= def.end) return { ok: false, code: 'alreadyCheckedOut', params: { at: last.t || faMinToHM(last.m) } };
    return { ok: true, kind: 'in', first: false, lateMinutes: 0, otHours: 0, leaveHours: 0, inBreak: faInBreak(def, m) };

var FA_FIRST_IN_WINDOW_MS = 30 * 60000;   /* after the day's FIRST check-in, a scan less than 30 min later is a repeat (hours count in 30-min blocks) */

    var b = state && state.burst;

    if (b.evKey && !anchor) return false;

}

/* Applies one scan to the day's state (also used inside the database transaction so two phones can
   never both be recorded). A burst of repeated scans keeps only the first one for the calculation;
   the 2nd and the very last scan of the burst are saved for the record (kind 'repeat').
   Returns { ok:false, code, params } | { ok:true, repeat:true, n, recKey, newState, first } |
           { ok:true, repeat:false, cls, newState }. */
function faApplyScan(def, m, time, state, nowMs, key) {
    var cur = state ? JSON.parse(JSON.stringify(state)) : {};
    var via = faBurstActive(cur, nowMs, m, def);
    if (via) {
        var n = (parseInt(cur.burst.n, 10) || 1) + 1;
        var lastKey = cur.burst.lastKey || '';

        var evs = faStateEvents(cur);

    var cls = faClassify(def, m, cur);

        cur.ev = {};
        faStateEvents(cur).forEach(function (e) { cur.ev[e.key] = { k: e.k, m: e.m, t: e.t }; });
        delete cur.checkin; delete cur.checkout; delete cur.leave;
    }
    cur.ev[key] = { k: cls.kind, m: m, t: time };
    cur.burst = { first: nowMs, last: nowMs, n: 1, lastKey: '', evKey: key };
    return { ok: true, repeat: false, cls: cls, newState: cur };

/* v7.11: the saved check-in / check-out RECORDS of the employee for the shift date (the rows the admin sees in
   Live Scans) are the truth for the day's sequence. A leftover entry in the state node whose record no longer
   exists (a "ghost", e.g. a scan removed another way) is ignored, so it can never turn the next scan into
   the wrong type. The burst timer stays in the state. recs: [{ _key, kind, scanMin, time }] or null when the
   records could not be read (then the state node alone is used, as before).
   Days recorded before v7.01 (kinds checkin / checkout / halfday / fullday) keep the old rule: state + records. */
function faStateWithRecords(state, recs) {
    var cur = state ? JSON.parse(JSON.stringify(state)) : {};
    var legacyKinds = { checkin: 1, checkout: 1, halfday: 1, fullday: 1 };
    var hasLegacy = !!(recs && recs.some(function (r) { return r && legacyKinds[r.kind]; }));
    if (!recs || hasLegacy) {
        if (!cur.ev) {
            var old = faStateEvents(cur);
            cur.ev = {};
            old.forEach(function (e) { cur.ev[e.key] = { k: e.k, m: e.m, t: e.t }; });
            delete cur.checkin; delete cur.checkout; delete cur.leave;
        }
    } else {
        cur.ev = {};
        delete cur.checkin; delete cur.checkout; delete cur.leave;
    }
    (recs || []).forEach(function (r) {
        if (!r || !r._key || (r.kind !== 'in' && r.kind !== 'out') || cur.ev[r._key]) return;
        var m = parseFloat(r.scanMin);
        if (!isFinite(m)) m = faHM(r.time);
        if (isFinite(m)) cur.ev[r._key] = { k: r.kind, m: m, t: r.time || '' };
    });
    return cur;
}

/* The events of a day must alternate IN, OUT, IN, OUT ... starting with IN (checked after sorting by time). */
function faEventsValid(evs) {
    var sorted = evs.slice().sort(function (a, b) { return (a.m - b.m) || (a.k === 'in' ? -1 : 1); });
    for (var i = 0; i < sorted.length; i++) {
        if (sorted[i].k !== (i % 2 === 0 ? 'in' : 'out')) return false;
    }
    return true;
}
/* Admin "Manual entry": adds one IN or OUT at any time (no window rules), keeping the day valid.
   Returns { ok:false, code:'order' } or { ok:true, cls:{kind,lateMinutes,otHours,first}, newState }. */
function faApplyManual(def, kind, m, time, state, key) {
    var cur = state ? JSON.parse(JSON.stringify(state)) : {};
    var evs = faStateEvents(cur);
    var next = evs.concat([{ key: key, k: kind, m: m, t: time }]);
    if (!faEventsValid(next)) return { ok: false, code: 'order', params: {} };
    if (!cur.ev) {
        cur.ev = {};
        evs.forEach(function (e) { cur.ev[e.key] = { k: e.k, m: e.m, t: e.t }; });
        delete cur.checkin; delete cur.checkout; delete cur.leave;
    }
    cur.ev[key] = { k: kind, m: m, t: time };
    var first = evs.length === 0 || m < evs[0].m;
    var cls = { ok: true, kind: kind, first: first,
        lateMinutes: (kind === 'in' && first) ? faLateMissed(def, m) : 0,
        otHours: kind === 'out' ? faOtFor(def, faEffEnd(def, m)) : 0, leaveHours: 0, inBreak: faInBreak(def, m) };
    return { ok: true, cls: cls, newState: cur };
}

function faLocal(epochMs, tz) {
    var d = new Date(epochMs + tz * 60000);
    return { dateStr: d.getUTCFullYear() + '-' + faPad(d.getUTCMonth() + 1) + '-' + faPad(d.getUTCDate()), minutes: d.getUTCHours() * 60 + d.getUTCMinutes() };
}
function faAddDays(dateStr, n) {
    var p = dateStr.split('-');
    var d = new Date(Date.UTC(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10) + n));
    return d.getUTCFullYear() + '-' + faPad(d.getUTCMonth() + 1) + '-' + faPad(d.getUTCDate());
}

/* The whole decision for one scan. epochMs = the (server-corrected) moment of the scan.
   getInfo(dateStr) must return { code: 'M'|'F'|'G'|'H'|'' , state: {...}|null } for that SHIFT date.
   A scan is checked against both today's shift and yesterday's (a night shift that started
   yesterday is still running until early this morning). */
function faResolveScan(epochMs, getInfo, settings) {
    var loc = faLocal(epochMs, settings.tzOffsetMinutes);
    var today = loc.dateStr, yest = faAddDays(today, -1);
    var cands = [{ date: yest, m: loc.minutes + 1440 }, { date: today, m: loc.minutes }];
    var rejects = [];
    for (var i = 0; i < cands.length; i++) {
        var c = cands[i];
        var info = getInfo(c.date) || {};
        var code = info.code || '';
        var def = (code && code !== 'H') ? faBuildShift(code, settings) : null;
        if (!def) {
            rejects.push({ date: c.date, ok: false, code: code === 'H' ? 'dayOff' : 'noShift', params: {}, rank: code === 'H' ? 1.5 : 0 });
            continue;
        }
        if (faBurstActive(info.state, epochMs, c.m, def)) {
            var evs = faStateEvents(info.state);
            var lastEv = evs[evs.length - 1] || null;
            return { ok: true, repeat: true, shiftDate: c.date, shiftCode: code, def: def, scanMin: c.m, time: faMinToHM(loc.minutes), localDate: today,
                     last: lastEv, lastTime: lastEv ? lastEv.t : '' };
        }

        if (!cls.ok) {

function faOverlap(a1, a2, b1, b2) { var lo = Math.max(a1, b1), hi = Math.min(a2, b2); return hi > lo ? hi - lo : 0; }

/* Daily figures for one employee on one shift date, from that day's scan records
   (each record: { kind, time, scanMin, lateMinutes }). Paid work = from the first check-in (late
   rules) to the last check-out inside the shift's paid time, break excluded, time out between an
   OUT and a later IN counted as work (company business). Leave = the rest of the paid day.
   Overtime = whole hours after the shift end up to the last check-out. */
function faSummarizeDay(def, recs, settings, allowMin) {
    var evs = (recs || []).filter(function (r) { return r && (r.kind === 'in' || r.kind === 'out'); }).map(function (r) {
        var m = parseFloat(r.scanMin);
        if (!isFinite(m)) m = faHM(r.time);

    var allEvs = evs, dead = evs.filter(function (e) { return e.k === 'out' && faDeadOut(def, e.m); });

    var first = evs[0], last = evs[evs.length - 1];
    var lastOut = null, k;
    for (k = evs.length - 1; k >= 0; k--) { if (evs[k].k === 'out') { lastOut = evs[k]; break; } }
    var res = { checkIn: first.k === 'in' ? first.t : '', checkOut: lastOut ? lastOut.t : '', workMin: null, nightMin: 0, leaveHours: 0, otHours: 0, lateMinutes: 0, remarks: [], scans: allEvs.length };
    /* every scan time of the day in order: 06:45 / 11:00 / 11:55 / 16:02 (repeat scans are never saved) */
    res.times = []; allEvs.forEach(function (e) { if (e.t) res.times.push(e.t); });
    res.timesText = res.times.join(' / ');
    res.timesCompact = res.times.map(function (x) { return x.replace(':', ''); }).join(',');   /* like the old report: 0657,1000,1158,1900 */

    res.lateMinutes = faLateMissed(def, first.m);   /* always from the first check-in time, so records saved before v7.07 are shown correctly too */
    if (evs.filter(function (e) { return e.k === 'in'; }).length > 1) res.remarks.push('outings');
    if (last.k === 'in' && dead.length) {
        /* the only check-out was an uncounted one: shown in the record, but the day counts 0 working hours and a full day of leave */
        res.checkOut = dead[dead.length - 1].t; res.workMin = 0; res.leaveHours = def.fullHours; res.otHours = 0;

    if (last.k === 'in') { res.remarks.push('missingCheckOut'); if (res.lateMinutes > 0) res.remarks.push('late'); return res; }

    parts.forEach(function (p) {
        if (p[1] <= p[0]) return;

    return res;
}

/* Daily figures for one employee on one shift date, from that day's scan records
   (each record: { kind, time, lateMinutes, otHours, leaveHours }). Working time is the shift's
   own paid time (start..end minus the break) reduced by lateness; OT is reported separately. */
function faSummarizeLegacy(def, recs, settings) {
    var by = {};
    (recs || []).forEach(function (r) { if (!by[r.kind] || (r.time || '') < (by[r.kind].time || '')) by[r.kind] = r; });

    if (!ci && !co && !hd && !fd) { res.remarks.push('noScan'); return res; }
    res.lateMinutes = ci ? (parseFloat(ci.lateMinutes) || 0) : 0;
    res.otHours = co ? (parseFloat(co.otHours) || 0) : 0;
    if (lv) {

        if (!isFinite(res.leaveHours)) res.leaveHours = fd ? def.fullHours : def.halfHours;

    if (!ci) { res.remarks.push('missingCheckIn'); return res; }
    var effS = def.start + res.lateMinutes, effE;
    if (lv) effE = def.breakStart;
    else if (co) effE = def.end;
    else { res.remarks.push('missingCheckOut'); return res; }
    var parts = [];
    if (effE > effS) {
        var b1 = def.breakStart, b2 = def.breakEnd;
        if (effS < b1) parts.push([effS, Math.min(effE, b1)]);
        if (effE > b2) parts.push([Math.max(effS, b2), effE]);
    }
    var nS = faHM(settings.nightStart), nE = faHM(settings.nightEnd);
    if (nE <= nS) nE += 1440;
    var work = 0, night = 0;
    parts.forEach(function (p) {
        if (p[1] <= p[0]) return;
        work += p[1] - p[0];
        for (var k = -1; k <= 2; k++) night += faOverlap(p[0], p[1], nS + 1440 * k, nE + 1440 * k);
    });
    res.workMin = work;
    res.nightMin = night;
    if (res.lateMinutes > 0) res.remarks.push('late');
    return res;
}

/* draws the box that follows the face (the video is mirrored and shown with object-fit: cover) */
function drawFaceBox(box, ok, name) {

  const cam = $('cam');
  const cw = cam.clientWidth, ch = cam.clientHeight, vw = video.videoWidth, vh = video.videoHeight;
  const sc = Math.max(cw / vw, ch / vh);

  const w = box.width * sc, h = box.height * sc;

  const top = oy + box.y * sc;
  fb.style.left = left + 'px'; fb.style.top = top + 'px'; fb.style.width = w + 'px'; fb.style.height = h + 'px';

  drawFaceBox(box, true, m.name);
  $('cam').classList.add('found');
  if (m.id === lastId) streak++; else { lastId = m.id; streak = 1; }

const recsByDate = {};

  let code = '';

    const v = snap.val() || {};

  } catch (e) { throw e; }

  try {

async function processScan(m) {

       again inside a database transaction on the day's state, so two quick scans (or two phones)
       can never both be recorded. A burst of repeated scans keeps only the first one for the
       calculation; the 2nd and the last scan of the burst are saved for the record. */

      applied = faApplyScan(res.def, res.scanMin, res.time, faStateWithRecords(cur, recsByDate[res.shiftDate]), when, key);

    });

      const lastEv = applied.last;

        return showResult({ type: 'reject', code: 'repeat', params: { at: lastEv && lastEv.t ? lastEv.t : res.time }, name: m.name, id: m.id, photo: photo, time: res.time });
      }
