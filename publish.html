<style>
:root{--bg:#edf2f7;--surface:#fff;--ink:#0f2238;--muted:#5b6d80;--line:#d8e1ea;--char:#1a6fbd;--char-ink:#fff;--soft:#e4ecf4;--ok:#1f7a4d;--okbg:#e5f3ec;--bad:#a8341f;--badbg:#fbeae6;--accent:#1a6fbd;--brand:#102d4d;--grad:linear-gradient(135deg,#36a8dc,#1a6fbd);--r:18px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081727;--surface:#0f2339;--ink:#eaf2fa;--muted:#94a9bf;--line:#1d3753;--char:#2f96ca;--char-ink:#fff;--soft:#17304c;--ok:#5fd09a;--okbg:#10291f;--bad:#ff9a85;--badbg:#2e1a16;--accent:#4fb3e3}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Kantumruy Pro",system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
body.km{font-family:"Kantumruy Pro",Inter,system-ui,sans-serif}
.top{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;box-shadow:0 2px 10px rgba(5,20,40,.25)}
.top .brand{display:flex;align-items:center;gap:10px}.top .brand img{width:34px;height:34px;border-radius:9px;box-shadow:0 0 0 1px rgba(255,255,255,.18);flex:none}
.top .brand{overflow:hidden;padding:2px}.top .brand b{white-space:nowrap}@media (max-width:430px){.top .brand b{display:none}}
.top .kst{background:rgba(255,255,255,.1);color:#fff}.top .kst i{background:#9fb3c8}.top .kst.ok{background:rgba(95,208,154,.14);color:#8ee6bb}.top .kst.ok i{background:#5fd09a}.top .kst.bad{background:rgba(255,154,133,.16);color:#ffb7a6}.top .kst.bad i{background:#ff9a85}
.top .lang{background:rgba(255,255,255,.1)}.top .lang button{color:#d9e6f2}.top .lang button.on{background:#fff;color:var(--brand)}.top .ib{background:rgba(255,255,255,.1);color:#fff}
.top .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:1.05rem;letter-spacing:.06em}
.brand small{display:block;color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kst{display:inline-flex;align-items:center;gap:7px;max-width:42vw;border:0;border-radius:999px;padding:7px 12px 7px 10px;font:inherit;font-size:.8rem;font-weight:600;cursor:pointer;background:var(--soft);color:var(--ink)}
.kst i{width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted)}
.kst span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kst.ok{background:var(--okbg);color:var(--ok)}.kst.ok i{background:var(--ok)}
.kst.bad{background:var(--badbg);color:var(--bad)}.kst.bad i{background:var(--bad)}
.kst.chk i{animation:kp 1s infinite alternate}@keyframes kp{to{opacity:.25}}
.lang{display:flex;background:var(--soft);border-radius:999px;padding:3px}
.lang button{border:0;background:none;color:var(--ink);font:inherit;font-size:.82rem;font-weight:600;padding:6px 11px;border-radius:999px;cursor:pointer}
.lang button.on{background:var(--char);color:var(--char-ink)}
.ib{border:0;background:var(--soft);color:var(--ink);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.ib svg,.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{max-width:640px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:1.02rem}
.card .sub{margin:0 0 12px;color:var(--muted);font-size:.86rem;line-height:1.45}
label.f{display:block;font-size:.84rem;color:var(--muted);font-weight:500;margin:10px 0 6px}
input[type=text],input[type=password],input[type=url],input[type=datetime-local],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 13px;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:170px;resize:vertical;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>input{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 18px;font:inherit;font-weight:600;font-size:.94rem;cursor:pointer;background:var(--char);color:var(--char-ink);text-decoration:none}
.btn.soft{background:var(--soft);color:var(--ink)}
.btn.sm{padding:8px 13px;font-size:.84rem}
.btn.wide{width:100%;padding:15px}
.btn:not(.soft){background:var(--grad);color:#fff}.btn:not(.soft):disabled{opacity:.6}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-size:.88rem;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.msg{border-radius:12px;padding:11px 13px;font-size:.9rem;line-height:1.45;margin-top:12px}
.msg.ok{background:var(--okbg);color:var(--ok)}
.msg.bad{background:var(--badbg);color:var(--bad)}
.msg.info{background:var(--soft);color:var(--ink)}
.owner{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.owner img{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--soft)}
.owner b{display:block}
.owner small{color:var(--muted)}
.vid{width:100%;max-height:70vh;border-radius:14px;background:#000;display:block}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--soft);border:0;padding:0;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .15s}
.ph .n{position:absolute;top:6px;right:6px;min-width:24px;height:24px;border-radius:12px;background:var(--char);color:var(--char-ink);font-size:.75rem;font-weight:700;display:grid;place-items:center;padding:0 6px;border:2px solid #fff}
.ph.off img{opacity:.28}
.ph.off .n{background:rgba(255,255,255,.85);color:#1d2328}
.sh4{margin:18px 0 4px;font-size:1rem}
.dests{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.dest{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 13px;font:inherit;font-size:.86rem;font-weight:600;cursor:pointer}
.dest i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:inline-block;flex:none}
.dest.on{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.dest.on i{border-color:var(--ok);background:var(--ok);box-shadow:inset 0 0 0 2.5px var(--okbg)}
.dest.off{opacity:.45}
.dest small{font-weight:500;opacity:.8}
.res{display:grid;gap:6px;margin-top:4px}
.res div{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.9rem}
.res b{font-weight:600}.res .ok{color:var(--ok)}.res .bad{color:var(--bad)}.res .wait{color:var(--muted)}

.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:.92rem}
.tg:first-of-type{border-top:0}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:14px;transition:background .15s;cursor:pointer}
.sw span:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span:after{transform:translateX(18px)}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;font:inherit;font-weight:600;font-size:.9rem;padding:9px;border-radius:999px;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--grad);color:#fff;box-shadow:0 2px 8px rgba(26,111,189,.3)}
.cnt{color:var(--muted);font-size:.84rem}
.hist a{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:.9rem}
.hist a:first-child{border-top:0}
.hist a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist a small{color:var(--muted);flex:none}
.note{font-size:.82rem;color:var(--muted);line-height:1.5;margin-top:10px}
.foot{margin:22px 0 calc(20px + env(safe-area-inset-bottom));text-align:center;color:var(--muted);font-size:.82rem}
.foot .sup{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}.foot .sup b{display:block;color:var(--ink);font-size:.95rem;margin-bottom:2px}.foot p{margin:14px 0 0}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}

.sheet .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sheet h3{margin:0;font-size:1.1rem}
ol.steps{padding-left:20px;margin:8px 0 0;font-size:.88rem;line-height:1.6}
ol.steps li{margin-bottom:8px}
code{background:var(--soft);padding:1px 6px;border-radius:6px;font-size:.85em;word-break:break-all}
details{border-top:1px solid var(--line);margin-top:14px;padding-top:10px}
summary{cursor:pointer;font-weight:600;font-size:.92rem}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
input[type=email]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 13px;outline:none}
body.out main>section:not(#authCard),body.out #needSetup,body.out .top .kst,body.out .top #gear,body.out main>p.note{display:none!important}
body.cust [data-owner]{display:none!important}body:not(.cust) [data-cust]{display:none!important}
#authCard h2{margin:0 0 4px;font-size:1.25rem}#authCard .seg{margin:14px 0 4px}
.top .ib{position:relative}.badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:#e5484d;color:#fff;font-size:.7rem;font-weight:700;display:grid;place-items:center;padding:0 4px}
.av{width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;font:inherit;font-weight:700;font-size:1rem;color:#fff;background:var(--grad);cursor:pointer;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.av.own{box-shadow:0 0 0 2px #f3b11c}.av.big{width:56px;height:56px;font-size:1.4rem;cursor:default}
body.out .top #chatBtn,body.out .top #meBtn{display:none}
.alang{display:flex;justify-content:flex-end;margin-bottom:6px}.alang .lang2{background:var(--soft)}
.lang2{display:inline-flex;border-radius:999px;padding:3px;background:var(--bg)}.lang2 button{border:0;background:none;color:var(--ink);font:inherit;font-size:.82rem;font-weight:600;padding:6px 12px;border-radius:999px;cursor:pointer}.lang2 button.on{background:var(--grad);color:#fff}
.mehd{display:flex;align-items:center;gap:14px;margin:4px 0 14px}.mehd b{display:block;font-size:1.1rem}.mehd small{color:var(--muted)}
.mecard{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;background:var(--bg)}.mecard b{font-size:1.02rem}.mecard span{color:var(--muted);font-size:.88rem}.mecard .btn{margin-top:8px}
.mecard.prem{border-color:transparent;background:linear-gradient(135deg,rgba(54,168,220,.16),rgba(26,111,189,.22))}.mecard.prem b{color:var(--accent)}
.melist{margin-top:14px;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.merow{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px;border:0;border-top:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.95rem;text-align:left;cursor:pointer;text-decoration:none}
.melist>.merow:first-child{border-top:0}.merow i{width:8px;height:8px;border-right:2px solid var(--muted);border-top:2px solid var(--muted);transform:rotate(45deg);flex:none}.merow.red{color:var(--bad)}.merow.lang{cursor:default}
.meform{padding:4px 14px 14px;border-top:1px solid var(--line);background:var(--bg)}.btn.danger{background:var(--bad)!important;color:#fff}
#lockCard h2{margin:0 0 6px;font-size:1.2rem}body.locked main>section:not(#lockCard):not(#authCard),body.locked main>p.note,body.locked #needSetup,body.devblock main>section:not(#devCard):not(#authCard),body.devblock main>p.note,body.devblock #needSetup{display:none!important}
#devCard h2{margin:0 0 6px;font-size:1.2rem}.devul{margin:6px 0;padding-left:20px;line-height:1.7}.devul small{color:var(--muted)}
.cidbox{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 10px;border:1px dashed var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px}.cidbox span{color:var(--muted);font-size:.84rem}.cidbox b{font-size:1.05rem;letter-spacing:.08em}.cidbox small{grid-column:1/-1;color:var(--muted);font-size:.78rem}
.upsell{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:.86rem;color:var(--muted)}
.chatpill{position:relative;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:8px 13px 8px 10px;background:var(--grad);color:#fff;font:inherit;font-size:.84rem;font-weight:700;cursor:pointer;flex:none;box-shadow:0 2px 10px rgba(26,111,189,.35)}
.chatpill svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
body.out .top #chatBtn{display:none}
.sheet.chs{display:flex;flex-direction:column;height:calc(100dvh - 54px);max-height:none;padding:0;overflow:hidden}
@media(min-width:700px){.sheet.chs{height:min(680px,90vh)}}
.chhead{background:linear-gradient(135deg,#0f2a48,#1a5d97);color:#fff;padding:14px 14px 14px 16px;display:flex;align-items:center;gap:12px;flex:none}
.chlogo{width:42px;height:42px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.4);flex:none}
.chhead .who{flex:1;min-width:0}.chhead b{display:block;font-size:1.05rem}.chhead small{display:flex;align-items:center;gap:6px;font-size:.8rem;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chdot{width:8px;height:8px;border-radius:50%;background:#5ab8f0;flex:none}.chdot.wait{background:#f0b429}.chdot.on{background:#3ccf76}
.chx{border:0;background:rgba(255,255,255,.16);color:#fff;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}

.chconf{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;background:var(--soft);border-bottom:1px solid var(--line);font-size:.86rem}.chconf span{flex:1 1 100%}
.chconf button{border:0;border-radius:10px;padding:7px 14px;font:inherit;font-weight:600;font-size:.85rem;cursor:pointer;background:var(--surface);color:var(--ink)}.chconf .yes{background:var(--bad);color:#fff}
.chlist{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain;background:var(--bg)}
.cm{max-width:84%;padding:9px 13px;border-radius:16px;font-size:.93rem;line-height:1.5;overflow-wrap:anywhere}
.cm .tx{white-space:pre-line}.cm.in{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.cm.out{align-self:flex-end;background:#e9eef3;color:#0f2238;border-bottom-right-radius:4px}
.cm .by{display:block;font-size:.74rem;font-weight:700;opacity:.65;margin-bottom:2px}.cm time{display:block;font-size:.68rem;opacity:.55;margin-top:3px;text-align:right}
.cm-btns{display:grid;gap:6px;margin-top:10px}.cm-btns button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-weight:600;font-size:.88rem;cursor:pointer}
.cm-btns button.old{opacity:.65}
.cm-btns button.lock{background:var(--soft,#eef2f7);color:var(--muted);border-color:transparent;opacity:.55;cursor:default;pointer-events:none}
.cm-sys{align-self:center;text-align:center;font-size:.78rem;color:var(--muted);background:var(--soft);border-radius:14px;padding:6px 12px;max-width:92%}
.cm-typing{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:4px}
.cm-typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:tcb 1s infinite}.cm-typing i:nth-child(2){animation-delay:.15s}.cm-typing i:nth-child(3){animation-delay:.3s}
@keyframes tcb{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.chfoot{display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);align-items:flex-end;background:var(--surface);flex:none}
.chfoot textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:18px;padding:10px 14px;background:var(--bg);color:var(--ink);max-height:110px;min-height:44px;line-height:1.4;font:inherit;font-size:16px}
.chatt{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}.chatt svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.chatt.busy{opacity:.5}
.cfile{display:block;margin-top:6px;max-width:240px}.cfile.img img{width:100%;max-height:260px;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block}.cfile.vid{width:100%;max-height:260px;border-radius:12px;background:#000}.cfile.doc{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:inherit;text-decoration:none;font-size:.86rem;overflow-wrap:anywhere}.cfile.doc small{opacity:.65}
.chsend{width:44px;height:44px;border-radius:50%;border:0;background:var(--grad);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}.chsend svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tlist li{margin-bottom:6px}.tchk{display:flex;gap:10px;align-items:flex-start;margin:6px 0 12px;font-weight:600;cursor:pointer}.tchk input{width:20px;height:20px;margin-top:2px;flex:none}
.flinks a{color:inherit}#terms{z-index:30}#doc{z-index:36}
.sheet.docs{display:flex;flex-direction:column;height:calc(100dvh - 54px);max-height:none}@media(min-width:700px){.sheet.docs{height:min(760px,92vh)}}
.docbody{flex:1;overflow:auto;padding:2px 2px 20px;line-height:1.7;font-size:.95rem}.docbody .dup{color:var(--muted);font-size:.84rem;margin:0 0 10px}.docbody h4{font-size:1rem;margin:20px 0 4px}.docbody ul{padding-left:20px;margin:6px 0}.docbody li{margin:3px 0}.docbody p{margin:6px 0}.docbody a{color:var(--accent)}
#chat .hd small{display:block;color:var(--muted);font-size:.8rem;font-weight:400}
.bub{max-width:82%;padding:9px 12px;border-radius:16px;background:var(--soft);align-self:flex-start;font-size:.92rem;line-height:1.45}.bub p{margin:0}.bub small{display:block;font-size:.72rem;color:var(--muted);font-weight:600;margin-bottom:2px}

.chq{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none}.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 12px;font:inherit;font-size:.84rem;font-weight:600;cursor:pointer}
.chin{display:flex;gap:8px}.chin input{flex:1}
#pmaint{position:fixed;inset:0;z-index:15;display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom));overflow:auto;background:var(--bg)}
#pmaint .pmc{width:min(480px,100%);background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px 22px;text-align:center;display:grid;justify-items:center;gap:8px;box-shadow:0 12px 40px rgba(15,34,56,.12)}
#pmaint img{width:64px;height:64px;border-radius:18px}
#pmaint h1{margin:8px 0 0;font-size:1.35rem;line-height:1.4;color:var(--ink)}#pmaint h2{margin:0;font-size:1.15rem;color:var(--ink)}
#pmaint p{margin:0;color:var(--muted);font-size:.95rem;line-height:1.6;white-space:pre-line}
#pmaint .pmd{width:80px;height:1px;background:var(--line);margin:8px 0}
#pmaint .pmb{display:inline-flex;background:var(--soft);border-radius:99px;padding:6px 14px;font-size:.86rem;font-weight:600;margin-top:4px}
#pmaint .pmchat{display:flex;align-items:center;gap:10px;justify-content:center;border:0;border-radius:16px;background:var(--grad);color:#fff;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer;margin-top:12px;text-align:left}
#pmaint .pmchat span{display:grid;line-height:1.3}#pmaint .pmchat small{font-weight:500;opacity:.85;font-size:.8rem}
#pmaint .pmchat svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#pmaint .pmcon{display:grid;gap:8px;width:min(340px,100%);margin-top:12px}#pmaint .pmcon b{font-size:.84rem;color:var(--muted)}
#pmaint .pmcon a{display:grid;padding:10px 14px;border-radius:14px;background:var(--bg);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;font-size:.9rem;text-align:left;line-height:1.3}
#pmaint .pmcon a small{font-weight:500;color:var(--muted);overflow-wrap:anywhere}
#pmaint .pmlink{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;font-size:.84rem;cursor:pointer;margin-top:14px}
body.pm-on{overflow:hidden}body.pm-nochat #chatBtn{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;background:#0f2238;color:#fff;padding:12px 16px;border-radius:14px;font-size:.9rem;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.3)}

.pkh b{display:block;font-size:1rem}.pkh small{color:var(--muted);font-size:.8rem}
.pkm{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.pkm button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:8px 6px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}

function abs(u){u=String(u||'');if(!u)return '';if(/^\/\//.test(u))return 'https:'+u;if(/^\//.test(u))return 'https://www.tikwm.com'+u;return u}

function withTimeout(p,ms){return Promise.race([p,new Promise(function(_,r){setTimeout(function(){r(new Error('timeout'))},ms)})])}
function tikwm(link){var fd=new FormData();fd.append('url',link);fd.append('hd','1');
  return withTimeout(fetch('https://www.tikwm.com/api/',{method:'POST',body:fd}),25000).then(function(r){return r.json()}).then(function(j){if(!j||j.code!==0||!j.data)throw new Error((j&&j.msg)||'no data');return j.data})}
/* photo posts have a headline title plus a description: join both */
function fullCaption(d){var main=String(d.title||'').trim(),found=[];
  (function walk(o,key,depth){if(!o||depth>5)return;if(/^(author|music|music_info|anchors?|commerce)/i.test(key||''))return;
    if(typeof o==='string'){if(depth>0&&/^(title|desc|description|caption|content|text|image_post_title)$/i.test(key||''))found.push(o.trim());return}
    if(typeof o!=='object')return;Object.keys(o).forEach(function(k){if(depth===0&&k==='title')return;walk(o[k],k,depth+1)})})(d,'',0);
  if(d.__oe)found.push(String(d.__oe).trim());
  var norm=function(x){return x.replace(/\s+/g,' ').trim().toLowerCase()},m=norm(main),heads=[];
  found.forEach(function(x){var n=norm(x);if(n.length<3||/^https?:/.test(n))return;
    if(m.indexOf(n)>=0)return;
    if(n.indexOf(m)>=0&&m){main=x;m=n;return}
    if(heads.some(function(h){return norm(h).indexOf(n)>=0}))return;heads.push(x)});
  return heads.concat(main?[main]:[]).join('\n\n')}

  if(WHEN==='later'&&!$('at').value){var d=new Date(Date.now()+60*60000);d.setMinutes(0,0,0);d.setHours(d.getHours()+1);$('at').value=localISO(d)}}});
function localISO(d){function p(n){return String(n).padStart(2,'0')}return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}

/* ---------- Facebook ---------- */
var G='https://graph.facebook.com/';
function gcall(path,params,host){var fd=new FormData();Object.keys(params||{}).forEach(function(k){if(params[k]!=null)fd.append(k,params[k])});fd.append('access_token',C.token);
  return fetch((host||G)+path,{method:'POST',body:fd}).then(function(r){return r.json()}).then(function(j){if(j&&j.error){if(j.error.code===190||j.error.type==='OAuthException'&&/token|session/i.test(j.error.message||'')){KS='bad';KERR=j.error.message;drawKey()}throw new Error(j.error.error_user_msg||j.error.message||'Facebook error')}return j})}
function gget(path){return withTimeout(fetch(G+path+(path.indexOf('?')<0?'?':'&')+'access_token='+encodeURIComponent(C.token)),15000).then(function(r){return r.json()}).then(function(j){if(j&&j.error){var er=new Error(j.error.message||'Facebook error');er.fb=true;er.code=j.error.code;er.type=j.error.type;throw er}return j})}
function cldUp(u){if(!C.cld||!C.pre)return Promise.reject(new Error('no backup'));var fd=new FormData();fd.append('file',u);fd.append('upload_preset',C.pre);
  return fetch('https://api.cloudinary.com/v1_1/'+encodeURIComponent(C.cld)+'/auto/upload',{method:'POST',body:fd}).then(function(r){return r.json()}).then(function(j){if(!j.secure_url)throw new Error((j.error&&j.error.message)||'upload failed');return j.secure_url})}
function prog(f){$('bar').hidden=f==null;$('bar').firstChild.style.width=Math.round((f||0)*100)+'%'}

C.dest=C.dest||{fb:true};
var DESTS=[['fb','dFbPost'],['fbs','dFbStory'],['ig','dIgPost'],['igs','dIgStory'],['tg','dTg']];
function destReady(k){if(destLocked(k))return false;if(k==='ig'||k==='igs')return !!C.igId;if(k==='tg')return !!(C.tgToken&&C.tgChat);return !!C.token}
function drawDests(){var box=$('dests');if(!box)return;var hid=DESTS.filter(function(d){return destLocked(d[0])});box.innerHTML=DESTS.filter(function(d){return !destLocked(d[0])}).map(function(d){var on=!!C.dest[d[0]],ready=destReady(d[0]),sk=WHEN==='later'&&d[0]!=='fb';
  return '<button type="button" class="dest'+(on?' on':'')+(sk||!ready?' off':'')+'" data-dest="'+d[0]+'"><i></i>'+esc(t(d[1]))+(destLocked(d[0])?' <small>· '+esc(t('lockedPlan'))+'</small>':ready?'':' <small>· '+esc(t('setupNeeded'))+'</small>')+'</button>'}).join('')+(hid.length?'<div class="upsell"><span>'+esc(t('subsOnly'))+'</span><button class="link" data-plans>'+esc(t('seePlans'))+'</button></div>':'');
  var on=DESTS.filter(function(d){return C.dest[d[0]]&&destReady(d[0])&&!(WHEN==='later'&&d[0]!=='fb')}).map(function(d){return t(d[1])});$('destSum').textContent=on.length?t('postingTo',{d:on.join(', ')}):t('noDest');
  $('schedNote').hidden=!(WHEN==='later'&&DESTS.some(function(d){return d[0]!=='fb'&&C.dest[d[0]]}))}
document.addEventListener('click',function(e){var b=e.target.closest('[data-dest]');if(!b)return;var k=b.getAttribute('data-dest');if(destLocked(k)){$('settings').hidden=true;openPlans();return}if(!destReady(k)){openSettings();return}C.dest[k]=!C.dest[k];save();drawDests()});

/* ---------- media helpers ---------- */
function mediaList(){var out=[];
  if(ST.kind==='video')out.push({type:'video',url:ST.video});
  else if(ST.kind==='fvideo')out.push({type:'video',file:ST.files[0]});
  else ST.sel.forEach(function(v,i){if(v)out.push(ST.kind==='fphotos'?{type:'photo',file:ST.files[i]}:{type:'photo',url:ST.images[i]})});
  return out}
function asJpg(u){return u.replace(/\.(webp|png|heic|heif|gif|avif|jpeg)(\?.*)?$/i,'.jpg')}
function pubUrl(it,needJpg){if(it.cld)return Promise.resolve(needJpg&&it.type==='photo'?asJpg(it.cld):it.cld);
  if(!C.cld||!C.pre){if(it.url)return Promise.resolve(it.url);return Promise.reject(new Error(t('needCld')))}
  it.cldP=it.cldP||cldUp(it.file||it.url).then(function(u){it.cld=u;return u});
  return it.cldP.then(function(u){return needJpg&&it.type==='photo'?asJpg(u):u}).catch(function(e){if(it.url)return it.url;throw e})}
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}

/* ---------- Facebook post ---------- */
function cx(r){if(r&&r.x){var e=new Error('cancel');e.cancel=true;throw e}}
function undoAdd(r,f){if(r){r.undo=r.undo||[];r.undo.push(f)}}
function fbDel(id){return function(){return gcall(id,{method:'delete'})}}
function fbPost(cap,sched,it,r){var pub=sched?{published:'false',scheduled_publish_time:String(sched)}:{};
  function vid(j){undoAdd(r,fbDel(j.id));return {url:'https://www.facebook.com/'+j.id,video:true}}
  if(ST.kind==='video')return Promise.resolve().then(function(){cx(r);return gcall(C.pageId+'/videos',Object.assign({file_url:ST.video,description:cap},pub))}).catch(function(e){if(e&&e.cancel)throw e;return pubUrl(it[0]).then(function(u){cx(r);return gcall(C.pageId+'/videos',Object.assign({file_url:u,description:cap},pub))})}).then(vid);
  if(ST.kind==='fvideo')return Promise.resolve().then(function(){cx(r);return gcall(C.pageId+'/videos',Object.assign({source:ST.files[0],description:cap},pub),'https://graph-video.facebook.com/')}).then(vid);
  var ids=[];return it.reduce(function(p,x){return p.then(function(){cx(r);return fbPhoto(x,sched).then(function(id){ids.push(id)})})},Promise.resolve())
    .then(function(){cx(r);var params=Object.assign({message:cap},pub);ids.forEach(function(id,i){params['attached_media['+i+']']=JSON.stringify({media_fbid:id})});return gcall(C.pageId+'/feed',params)})
    .then(function(j){undoAdd(r,fbDel(j.id));return {url:'https://www.facebook.com/'+j.id}})}
function fbPhoto(x,sched){var base={published:'false'};if(sched)base.temporary='true';
  if(x.file)return gcall(C.pageId+'/photos',Object.assign({source:x.file},base)).then(function(j){return j.id});
  return gcall(C.pageId+'/photos',Object.assign({url:x.url},base)).catch(function(){return pubUrl(x).then(function(u){return gcall(C.pageId+'/photos',Object.assign({url:u},base))})}).then(function(j){return j.id})}

/* ---------- Facebook Story ---------- */
function fbStory(it,r){
  if(it[0].type==='video'){var v=it[0];
    return Promise.resolve().then(function(){cx(r);return gcall(C.pageId+'/video_stories',{upload_phase:'start'})}).then(function(st){
      var h={Authorization:'OAuth '+C.token},body=null;
      var up=v.file?Promise.resolve(null):pubUrl(v).then(function(u){h.file_url=u});
      return up.then(function(){cx(r);if(v.file){h.offset='0';h.file_size=String(v.file.size);body=v.file}
        return fetch(st.upload_url,{method:'POST',headers:h,body:body}).catch(function(){throw new Error(t('fbsVidNet'))}).then(function(x){return x.json().catch(function(){return {}})}).then(function(j){if(j&&j.error)throw new Error(j.error.message||'upload failed')})})
      .then(function(){cx(r);return gcall(C.pageId+'/video_stories',{upload_phase:'finish',video_id:st.video_id})}).then(function(j){if(j&&j.post_id)undoAdd(r,fbDel(j.post_id))})}).then(function(){return {url:'https://www.facebook.com/'+C.pageId}})}
  return it.slice(0,10).reduce(function(p,x){return p.then(function(){cx(r);return fbPhoto(x,null).then(function(id){cx(r);return gcall(C.pageId+'/photo_stories',{photo_id:id})}).then(function(j){if(j&&j.post_id)undoAdd(r,fbDel(j.post_id))})})},Promise.resolve()).then(function(){return {url:'https://www.facebook.com/'+C.pageId}})}

/* ---------- Instagram ---------- */
function igWait(id,onMsg,r){var tries=0;return (function loop(){cx(r);return gget(id+'?fields=status_code,status').then(function(j){cx(r);
  if(j.status_code==='FINISHED')return;if(j.status_code==='ERROR'||j.status_code==='EXPIRED')throw new Error(t('igFileBad')+' ('+(j.status||j.status_code)+')');
  if(++tries>90)throw new Error(t('igSlow'));if(onMsg&&tries===2)onMsg();return wait(4000).then(loop)})})()}
function igMake(params,onMsg,r){cx(r);return gcall(C.igId+'/media',params).then(function(j){return igWait(j.id,onMsg,r).then(function(){return j.id})})}
function igPublish(id,r){cx(r);return gcall(C.igId+'/media_publish',{creation_id:id}).then(function(j){return gget(j.id+'?fields=permalink').then(function(x){return x.permalink||''}).catch(function(){return ''})})}
/* Instagram feed photos must be between 4:5 (tall) and 1.91:1 (wide). Taller or wider photos get soft side bands, nothing is cut off. */
function igFit(u,x){if(!x||x.type!=='photo'||!/res\.cloudinary\.com\/[^/]+\/image\/upload\//.test(u))return Promise.resolve(u);
  return new Promise(function(res){var im=new Image(),done=false;function end(t){if(done)return;done=true;res(t?u.replace('/image/upload/','/image/upload/'+t+'/'):u)}
    im.onload=function(){var w=im.naturalWidth,h=im.naturalHeight,r=w/h;if(!w||!h)return end('');if(r<0.8)end('w_1080,h_1350,c_pad,b_auto');else if(r>1.91)end('w_1080,h_565,c_pad,b_auto');else end('')};
    im.onerror=function(){end('')};setTimeout(function(){end('')},10000);im.src=u})}
function igCap(cap){var tags=0;cap=cap.replace(/#[^\s#]+/g,function(m){tags++;return tags>30?'':m});return cap.slice(0,2200)}
function igPost(cap,it,onMsg,r){cap=igCap(cap);var list=it.slice(0,10);
  if(list.length===1){var x=list[0];return pubUrl(x,true).then(function(u){return igFit(u,x)}).then(function(u){return igMake(x.type==='video'?{media_type:'REELS',video_url:u,caption:cap,share_to_feed:'true'}:{image_url:u,caption:cap},onMsg,r)}).then(function(id){return igPublish(id,r)}).then(function(u){return {url:u}})}
  var kids=[];return list.reduce(function(p,x){return p.then(function(){var i=kids.length;return pubUrl(x,true).then(function(u){return igFit(u,x)}).then(function(u){return igMake(x.type==='video'?{media_type:'VIDEO',video_url:u,is_carousel_item:'true'}:{image_url:u,is_carousel_item:'true'},onMsg,r)}).then(function(id){kids.push(id)},function(e){if(e&&e.cancel)throw e;throw new Error(t('igItem',{i:i+1})+': '+(e&&e.message||e))})})},Promise.resolve())
    .then(function(){return igMake({media_type:'CAROUSEL',children:kids.join(','),caption:cap},null,r)}).then(function(id){return igPublish(id,r)}).then(function(u){return {url:u}})}
function igStory(it,onMsg,r){return it.slice(0,10).reduce(function(p,x){return p.then(function(){return pubUrl(x,true).then(function(u){return igMake(x.type==='video'?{media_type:'STORIES',video_url:u}:{media_type:'STORIES',image_url:u},onMsg,r)}).then(function(id){return igPublish(id,r)})})},Promise.resolve())
  .then(function(){return {url:C.igUser?'https://www.instagram.com/stories/'+C.igUser+'/':''}})}
/* video length (seconds), 0 if unknown */
function vidLen(x){return new Promise(function(res){var v=document.createElement('video'),u=x.file?URL.createObjectURL(x.file):(x.cld||x.url),done=false;
  function end(d){if(done)return;done=true;try{if(x.file)URL.revokeObjectURL(u)}catch(e){}v.removeAttribute('src');res(isFinite(d)?d:0)}
  v.preload='metadata';v.muted=true;v.onloadedmetadata=function(){end(v.duration)};v.onerror=function(){end(0)};setTimeout(function(){end(0)},10000);v.src=u})}

/* ---------- Telegram ---------- */
function tgCall(m,fd){var tok=String(C.tgToken||'').replace(/[^0-9A-Za-z:_-]/g,'');var url='https://api.telegram.org/bot'+tok+'/'+m,opt={method:'GET'};
  if(fd){var plain=true;fd.forEach(function(v){if(typeof v!=='string')plain=false});
    if(plain){var q=new URLSearchParams();fd.forEach(function(v,k){q.append(k,v)});opt={method:'POST',body:q}}else opt={method:'POST',body:fd}}
  return fetch(url,opt).catch(function(){throw new Error(t('tgNet'))}).then(function(r){return r.text().then(function(x){var j=null;try{j=JSON.parse(x)}catch(e){}
    if(!j){if(r.status===401||r.status===404)throw new Error(t('tgKeyBad'));throw new Error(t('tgNet')+' ('+r.status+')')}
    if(!j.ok){var d=String(j.description||'');if(j.error_code===401||j.error_code===404)throw new Error(t('tgKeyBad'));if(/chat not found/i.test(d))throw new Error(t('tgChatBad'));throw new Error(d||'Telegram error')}return j.result})})}
function tgLink(msg){var c=String(C.tgChat||'');return c.charAt(0)==='@'&&msg&&msg.message_id?'https://t.me/'+c.slice(1)+'/'+msg.message_id:''}
function tgPost(cap,it,r){var long=cap.length>1024,capOne=long?'':cap,first=null;
  function sent(m){[].concat(m).forEach(function(x){if(x&&x.message_id)undoAdd(r,function(){var f=new FormData();f.append('chat_id',C.tgChat);f.append('message_id',String(x.message_id));return tgCall('deleteMessage',f)})});return m}
  function fd(o){var f=new FormData();f.append('chat_id',C.tgChat);Object.keys(o).forEach(function(k){if(o[k]!=null&&o[k]!=='')f.append(k,o[k])});return f}
  var job;
  if(it.length===1){var x=it[0],m=x.type==='video'?'sendVideo':'sendPhoto',key=x.type==='video'?'video':'photo';
    job=(x.file?Promise.resolve(x.file):pubUrl(x).catch(function(){return x.url})).then(function(src){var o={caption:capOne};o[key]=src;if(x.type==='video')o.supports_streaming='true';
      cx(r);return tgCall(m,fd(o)).catch(function(e){if(!x.file&&x.url&&src!==x.url){cx(r);o[key]=x.url;return tgCall(m,fd(o))}throw e})}).then(function(m){first=sent(m)})}
  else{var chunks=[];for(var i=0;i<it.length;i+=10)chunks.push(it.slice(i,i+10));
    job=chunks.reduce(function(p,ch,ci){return p.then(function(){var f=new FormData();f.append('chat_id',C.tgChat);
      return Promise.all(ch.map(function(x,k){return x.file?Promise.resolve('attach://f'+k):pubUrl(x).catch(function(){return x.url})})).then(function(srcs){
        var media=ch.map(function(x,k){var o={type:x.type==='video'?'video':'photo',media:srcs[k]};if(x.file)f.append('f'+k,x.file);if(ci===0&&k===0&&capOne)o.caption=capOne;return o});
        f.append('media',JSON.stringify(media));cx(r);return tgCall('sendMediaGroup',f)}).then(function(m){sent(m);if(!first)first=m[0]})})},Promise.resolve())}
  return job.then(function(){if(long){cx(r);return tgCall('sendMessage',fd({text:cap.slice(0,4096)})).then(sent)}}).then(function(){return {url:tgLink(first)}})}

/* ---------- post everywhere ---------- */
var CUR=null;
function drawRes(R){CUR=R;$('m3').innerHTML='<div class="msg info"><div class="res">'+R.map(function(r){var cls=r.st==='done'?'ok':r.st==='fail'?'bad':'wait',
  txt=r.st==='done'?t('stDone')+(r.note?' · '+r.note:''):r.st==='fail'?t('stFail')+(r.err?': '+r.err:''):r.st==='skip'?t('stSkip')+(r.err?': '+r.err:''):r.st==='cancel'?t('stCancel'):r.st==='stopping'?t('stStopping'):r.st==='work'?(r.note||t('stWork')):t('stWait');
  var act=r.url?'<a class="btn sm soft" target="_blank" rel="noopener" href="'+esc(r.url)+'">'+esc(t('open'))+'</a>':(r.st==='work'||r.st==='wait')?'<button type="button" class="btn sm soft" data-cancel="'+esc(r.k)+'">'+esc(t('cancel'))+'</button>':'';
  return '<div><span><b>'+esc(t(r.label))+'</b> · <span class="'+cls+'">'+esc(txt)+'</span></span>'+act+'</div>'}).join('')+'</div></div>'}
$('m3').addEventListener('click',function(e){var b=e.target.closest('[data-cancel]');if(!b||!CUR)return;var k=b.getAttribute('data-cancel');
  CUR.forEach(function(r){if(r.k===k&&(r.st==='work'||r.st==='wait')){r.x=true;r.st='stopping'}});drawRes(CUR)});
$('post').onclick=function(){
  var cap=$('cap').value,sched=null;
  if(WHEN==='later'){var d=new Date($('at').value),s=Math.floor(d.getTime()/1000),now=Date.now()/1000;if(!$('at').value||isNaN(s)||s<now+15*60||s>now+30*86400){msg('m3','bad',esc(t('badTime')));return}sched=s}
  var sel=DESTS.filter(function(x){return C.dest[x[0]]&&destReady(x[0])});
  if(!sel.length){msg('m3','bad',esc(t('noDest')));return}
  var it=mediaList();
  if(ST.kind==='photos'||ST.kind==='fphotos'){if(!it.length){msg('m3','bad',esc(t('noSel')));return}}
  else if(ST.kind!=='video'&&ST.kind!=='fvideo'){msg('m3','bad',esc(t('noMedia')));return}
  var btn=$('post');btn.disabled=true;btn.textContent=t('posting');prog(0.05);
  var R=sel.map(function(x){return {k:x[0],label:x[1],st:'wait'}});drawRes(R);
  var runs={fb:function(r){return fbPost(cap,sched,it,r)},fbs:function(r){return fbStory(it,r)},ig:function(r){return igPost(cap,it,function(){if(r.st==='work'){r.note=t('igProc');drawRes(R)}},r)},igs:function(r){return igStory(it,function(){if(r.st==='work'){r.note=t('igProc');drawRes(R)}},r)},tg:function(r){return tgPost(cap,it,r)}};
  var fbUrl='',fin=0;
  function undo(r){var u=(r.undo||[]).slice();r.undo=[];return u.reduce(function(p,f){return p.then(f)},Promise.resolve()).then(function(){r.st='cancel'},function(){r.st='done';r.note=t('tooLate')})}
  function pre(r){if(r.k!=='fbs'&&r.k!=='igs')return Promise.resolve();var v=it.filter(function(x){return x.type==='video'})[0];if(!v)return Promise.resolve();
    return vidLen(v).then(function(d){if(d>60.5){var e=new Error(t('storyLong',{s:Math.round(d)}));e.skip=true;throw e}if(d&&d<3){var e2=new Error(t('storyShort'));e2.skip=true;throw e2}})}
  Promise.all(R.map(function(r){
    if(sched&&r.k!=='fb'){r.st='skip';r.err=t('schedSkip');fin++;drawRes(R);return}
    r.st='work';drawRes(R);
    return pre(r).then(function(){cx(r);return runs[r.k](r)}).then(function(o){if(r.x)return undo(r);r.st='done';r.url=o&&o.url||'';r.note='';if(r.k==='fb')fbUrl=r.url})
      .catch(function(e){if(r.x||e&&e.cancel)return undo(r);r.st=e&&e.skip?'skip':'fail';r.err=String(e&&e.message||e).slice(0,200)})
      .then(function(){fin++;prog(fin/R.length);drawRes(R)})}))
  .then(function(){var ok=R.filter(function(r){return r.st==='done'});
    if(ok.length){accCount();logPost(R,cap);var u=fbUrl||ok[0].url||'';C.hist.unshift({u:u,c:(cap.split('\n')[0]||ST.user||'').slice(0,80),at:Date.now(),s:sched||0,d:ok.map(function(r){return r.k})});C.hist=C.hist.slice(0,15);save();drawHist()}
    btn.disabled=false;btn.textContent=t('postBtn');setTimeout(function(){prog(null)},800)})};

function drawHist(){var h=C.hist||[];$('histCard').hidden=!h.length;
  $('hist').innerHTML=h.map(function(x){var d=new Date(x.s?x.s*1000:x.at);return '<a target="_blank" rel="noopener" href="'+esc(x.u||'#')+'"><span>'+esc(x.c||'Post')+(x.d&&x.d.length>1?' · '+x.d.length+' places':'')+'</span><small>'+esc((x.s?t('later')+' · ':'')+d.toLocaleDateString()+' '+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}))+'</small></a>'}).join('')}

/* ---------- Connect with Facebook (customers) ---------- */
var FBSDK=null,FBL=[];
function fbSdk(){var id=cfg().fbAppId;if(!id||ACC.team)return Promise.resolve(null);if(FBSDK)return FBSDK;
  FBSDK=new Promise(function(res){window.fbAsyncInit=function(){FB.init({appId:String(id),cookie:true,xfbml:false,version:'v26.0'});res(window.FB);drawFbBox()};
    var s=document.createElement('script');s.src='https://connect.facebook.net/en_US/sdk.js';s.async=true;s.crossOrigin='anonymous';s.onerror=function(){FBSDK=null;res(null)};document.head.appendChild(s)});return FBSDK}
function fbPages(tok){return fetch(G+'me/accounts?fields=id,name,access_token,instagram_business_account%7Bid,username%7D&limit=100&access_token='+encodeURIComponent(tok)).then(function(r){return r.json()}).then(function(j){if(j.error){var e=new Error(j.error.message||'Facebook error');e.code=j.error.code;throw e}return j.data||[]})}
function usePage(p){C.token=p.access_token;C.pageId=p.id;C.pageName=p.name;C.fbLogin=true;C.fbPage=p.id;
  var ig=p.instagram_business_account;if(ig&&ig.id){C.igId=ig.id;C.igUser=ig.username||''}else{delete C.igId;delete C.igUser}
  C.dest=C.dest||{};C.dest.fb=true;save();KS='ok';KERR='';drawKey();drawDests();drawFbBox()}

  FB.login(function(r){if(!r||!r.authResponse){msg('m8','bad',esc(t('fbcCancel')));return}msg('m8','info',esc(t('aWait')));
    fbPages(r.authResponse.accessToken).then(function(L){

    .catch(function(e){msg('m8','bad',esc(t('fbcFail'))+'<br><small>'+esc(e&&e.message||'')+'</small>')})},o)};

$('fbDisc').onclick=function(){['token','pageId','pageName','igId','igUser','fbLogin','fbPage'].forEach(function(k){delete C[k]});save();KS='none';drawKey();drawDests();drawFbBox();try{window.FB&&FB.logout(function(){})}catch(e){}};

/* ---------- chat with our team (same inbox as the website chat, same look and flow) ---------- */
var CH={chat:null,msgs:[],offs:[],typing:false,on:false};
function chP(){return 'chats/'+ACC.user.uid}function mP(){return 'messages/'+ACC.user.uid}
function clrKey(){return 'thean_post_chatclr_'+(ACC.user?ACC.user.uid:'')}
function clrAt(){try{return +localStorage.getItem(clrKey())||0}catch(e){return 0}}
function chStop(){CH.offs.forEach(function(f){try{f()}catch(e){}});CH.offs=[];CH.on=false;CH.chat=null;CH.msgs=[];drawBadge()}
function chListen(){if(CH.on)return;CH.on=true;
  CH.offs.push(FBX.d.onValue(R(chP()),function(s){CH.chat=s.val();if(!$('chat').hidden&&CH.chat&&CH.chat.unreadVisitor)FBX.d.update(R(chP()),{unreadVisitor:0}).catch(function(){});drawBadge();drawChat()},function(){}));
  CH.offs.push(FBX.d.onValue(FBX.d.query(R(mP()),FBX.d.limitToLast(200)),function(s){var L=[];s.forEach(function(c){var v=c.val();if(v&&!v.staff){v.id=c.key;L.push(v)}});CH.msgs=L;drawChat()},function(){}))}
function chStart(){if(!FBX||!ACC.user)return;FBX.d.get(R(chP())).then(function(s){if(s.exists())chListen()}).catch(function(){})}
function chEnsure(){if(CH.chat)return Promise.resolve();var u=ACC.user;
  return FBX.d.get(R(chP())).then(function(s){if(s.exists())return;
    return FBX.d.set(R(chP()),{visitorUid:u.uid,status:'bot',lang:C.lang,name:(myName()||'Customer')+' · Thean Studio',contact:(u.email||'')+(myCid()?' · ID '+myCid():''),cid:myCid(),page:'/publish',createdAt:FBX.d.serverTimestamp(),updatedAt:FBX.d.serverTimestamp(),lastMsg:'',lastFrom:'',unreadAgent:0,unreadVisitor:0,ua:navigator.userAgent.slice(0,160)})})
  .then(function(){chListen();return new Promise(function(r){var n=0,tm=setInterval(function(){if(CH.chat||++n>60){clearInterval(tm);r()}},50)})})}
function live(){return CH.chat&&(CH.chat.status==='waiting'||CH.chat.status==='assigned')}
function shown(){var c=clrAt();return CH.msgs.filter(function(m){return !(+m.ts<=c)})}
function drawBadge(){var n=CH.chat&&+CH.chat.unreadVisitor||0,b=$('chatBadge');b.hidden=!n||!$('chat').hidden;b.textContent=n>9?'9+':String(n)}
function openChat(){$('chat').hidden=false;$('chConf').hidden=true;drawBadge();drawChat();
  chEnsure().then(function(){if(CH.chat&&CH.chat.unreadVisitor)FBX.d.update(R(chP()),{unreadVisitor:0}).catch(function(){});if(!shown().length&&!live())return welcome(C.lang)}).catch(function(){toast(t('aeNet'))})}
$('chatBtn').onclick=openChat;
function L(k,lg){return (T[lg]&&T[lg][k])||T.en[k]||k}
function menuBtns(lg){return [{l:L('q_live',lg),a:'live'},{l:L('q_pay',lg),a:'pay'},{l:L('q_conn',lg),a:'conn'},{l:L('q_plans',lg),a:'plans'},{l:L('q_prob',lg),a:'prob'},{l:L('q_terms',lg),a:'terms'}]}
function moreBtn(lg){return {l:L('q_more',lg),a:'menu'}}
function liveBtn(lg){return {l:L('q_live',lg),a:'live'}}
function push(m){if(!m.btns)delete m.btns;return FBX.d.push(R(mP()),Object.assign({ts:FBX.d.serverTimestamp()},m))}
function touch(o){return FBX.d.update(R(chP()),Object.assign({updatedAt:FBX.d.serverTimestamp()},o)).catch(function(){})}
function botSay(text,btns,ms){CH.typing=true;drawChat();return new Promise(function(r){setTimeout(r,ms||800)}).then(function(){CH.typing=false;return push({from:'bot',text:text,btns:btns})})
  .then(function(){if(!live())return touch({lastMsg:text.slice(0,120),lastFrom:'bot'})})}
function say(text){var o={lastMsg:text.slice(0,120),lastFrom:'visitor'};if(live())o.unreadAgent=FBX.d.increment(1);return push({from:'visitor',text:text}).then(function(){return touch(o)})}
function greetBoth(lg){var h=new Date().getHours();
  if(lg==='km')return (h<12?'អរុណសួស្ដី':h<18?'ទិវាសួស្ដី':'សាយណ្ហសួស្ដី')+'! ខ្ញុំជាជំនួយការនិម្មិតរបស់អ្នកថ្ងៃនេះ។ តើខ្ញុំអាចជួយអ្វីអ្នកបានខ្លះ?';
  return (h<12?'Good morning':h<18?'Good afternoon':'Good evening')+"! I'm your virtual assistant today. How can I help you?"}
function welcome(lg){return botSay(greetBoth(lg)).then(function(){return botSay(L('chCaps',lg),menuBtns(lg),1000)})}
function plansText(lg){var P=PK.filter(function(k){return packOn(k)&&MON.some(function(m){return price(k,m)})});if(!P.length)return L('noPrices',lg);
  var keep=C.lang;C.lang=lg;var s=L('chPlans',lg)+'\n'+P.map(function(k){return '• '+pkName(k)+': '+MON.filter(function(m){return price(k,m)}).map(function(m){return nm(m)+' '+money(price(k,m))}).join(', ')}).join('\n')+'\n'+L('chPlans2',lg).split('{n}').join(freeTotal());C.lang=keep;return s}

  if(a==='conn')return botSay(L('a_conn',lg),[{l:L('q_openSet',lg),a:'openset'},liveBtn(lg),moreBtn(lg)],1000);
  if(a==='plans')return botSay(plansText(lg),[{l:L('q_openPlans',lg),a:'openplans'},moreBtn(lg)],900);
  if(a==='prob')return botSay(L('a_prob',lg),[liveBtn(lg),moreBtn(lg)],1000);
  if(a==='terms')return botSay(L('a_terms',lg),[{l:L('q_readTerms',lg),a:'readterms'},moreBtn(lg)],900);
  if(a==='hello')return botSay(greetBoth(lg)).then(function(){return botSay(L('chCaps',lg),menuBtns(lg),900)});

function goLive(lg){return say(L('q_live',lg)).then(function(){return FBX.d.update(R(chP()),{status:'waiting',requestedAt:FBX.d.serverTimestamp(),updatedAt:FBX.d.serverTimestamp(),lastMsg:L('q_live',lg),lastFrom:'visitor',unreadAgent:FBX.d.increment(1),lang:lg,name:(myName()||'Customer')+' · Thean Studio'})})
  .then(function(){return botSay(L('hold1',lg),null,1400)}).then(function(){return botSay(L('hold2',lg),[{l:L('q_end',lg),a:'end'}],2000)})}
function endLive(lg){return say(L('q_end',lg)).then(function(){return FBX.d.update(R(chP()),{status:'bot',updatedAt:FBX.d.serverTimestamp(),lastMsg:'Chat ended by the customer',lastFrom:'system'})})
  .then(function(){return push({from:'system',text:'Chat ended by the customer',staff:true})}).then(function(){return botSay(L('chEnded',lg),[moreBtn(lg)],1000)})}
function act(a,label){var lg=C.lang;if(live()&&a!=='end')return;chEnsure().then(function(){
  if(a==='openplans'){$('chat').hidden=true;openPlans();return}
  if(a==='openset'){$('chat').hidden=true;openSettings();return}
  if(a==='readterms'){openDoc('terms');return}
  if(a==='live'){if(live())return;return goLive(lg)}
  if(a==='end'){if(!live())return;return endLive(lg)}
  return say(label).then(function(){return answer(a,lg)})}).catch(function(){toast(t('aeNet'))})}
/* understands simple questions in Khmer and English */
var INTENTS=[['live',/(agent|person|human|staff|admin|talk to|call me|speak|មនុស្ស|ភ្នាក់ងារ|បុគ្គលិក|និយាយជាមួយ|ទាក់ទងក្រុម|ជជែកជាមួយ)/i],
  ['pay',/(pay|paid|payment|khqr|qr|receipt|bank|aba|acleda|wing|money|transfer|បង់|ប្រាក់|លុយ|បង្កាន់ដៃ|ធនាគារ|ផ្ទេរ|វិក្កយបត្រ)/i],
  ['plans',/(plan|price|cost|how much|subscri|month|upgrade|package|គម្រោង|តម្លៃ|ថ្លៃ|ប៉ុន្មាន|ខែ|កញ្ចប់|ជាវ|ដំឡើង)/i],
  ['conn',/(connect|login|log in|facebook|instagram|telegram|page|token|tester|invite|accept|ភ្ជាប់|ចូល|ទំព័រ|ហ្វេសប៊ុក|អញ្ជើញ)/i],
  ['prob',/(error|problem|not work|doesn.?t work|fail|bug|broken|stuck|can.?t|cannot|help|issue|បញ្ហា|មិនដំណើរការ|មិនអាច|ខូច|ជួយ|កំហុស|បរាជ័យ)/i],
  ['terms',/(term|rule|policy|condition|allowed|copyright|ច្បាប់|លក្ខខណ្ឌ|គោលការណ៍|អនុញ្ញាត|រក្សាសិទ្ធិ)/i],
  ['hello',/^(hi|hello|hey|good (morning|afternoon|evening)|សួស្តី|ជំរាបសួរ|សួស្ដី|hi there)\b|^(សួស្តី|ជំរាបសួរ|សួស្ដី)/i]];
function intent(x){for(var i=0;i<INTENTS.length;i++)if(INTENTS[i][1].test(x))return INTENTS[i][0];return ''}

var TERMS_V=2;

document.addEventListener('click',function(e){if(e.target.closest('#footChat')&&ACC.st==='in'){e.preventDefault();openChat()}});

aid by mistake, paid twice, or could not use the App because of a problem on our side, contact us within 7 days and we will review your request fairly. No refund is given when an account is paused or closed because these Terms were broken."]],["11. Records we keep",["To run the App, prevent abuse and meet our legal duties, we keep your account details, the history of posts made through the App (time, places, Page name, source link and caption), your Plans, payments and receipts, and your chats with our team. Details are explained in our Privacy Policy."]],["12. When these Terms are broken",[["We may remove Content links from our records, warn you, pause your account for a period, close it permanently, or refuse a new account, depending on how serious the problem is.","We may act without warning when the law, the safety of other people, or a Platform requires it.","If we find a violation, we may use the account information and activity history described above to investigate, and we may share them with the competent authorities so that the matter is handled under the laws of the Kingdom of Cambodia."]]],["13. Our service and other companies",[["We work hard to keep the App available and correct, but we provide it \"as is\" and cannot promise that it will always work without errors or interruption.","The App depends on other companies, including Meta (Facebook and Instagram), Telegram, TikTok, Google Firebase, Cloudinary and GitHub. When they change, limit or stop a feature, parts of the App may stop working. We are not responsible for their services or decisions.","We may change, add or remove features of the App at any time."]]],["14. Limitation of liability",["As far as the law allows, we are not responsible for indirect losses, such as lost profit, lost followers or a Page being limited, that come from using the App or from your Content. Our total responsibility for any claim is limited to the amount you paid us in the 3 months before the claim."]],["15. Your responsibility to us",["If someone makes a claim against us because of your Content or because you broke these Terms, you agree to cover the reasonable costs and losses that result, as far as the law allows."]],["16. Closing your account",["You can delete your account at any time in My account. Deleting your account ends any Plan without refund. Some records are kept for a limited time as explained in the Privacy Policy."]],["17. Changes to these Terms",["We may update these Terms when our service or the law changes. When we make an important change, the App will show the new Terms and ask you to agree again before you continue posting."]],["18. Law and disputes",["These Terms are governed by the laws of the Kingdom of Cambodia. If there is a problem, please contact us first so we can try to solve it together. Any dispute that cannot be solved this way will be handled by the competent courts of the Kingdom of Cambodia."]],["19. Contact us",["Thean team · kongthean.com","Chat: the Chat button in the App","Email: info@kongthean.com"]]]},"km":{"title":"លក្ខខណ្ឌប្រើប្រាស់","intro":"លក្ខខណ្ឌប្រើប្រាស់ទាំងនេះ («លក្ខខណ្ឌ») គឺជាកិច្ចព្រមព្រៀងរវាងអ្នក និងក្រុមការងារ ធាន («ធាន» «យើង») ដែលជាអ្នកគ្រប់គ្រង kongthean.com និង Thean Studio ដែលជាកម្មវិធីរបស់យើងសម្រាប់បង្ហោះវីដេអូ និងរូបភាពទៅបណ្តាញសង្គម («កម្មវិធី»)។ សូមអានដោយយកចិត្តទុកដាក់។ ដោយបង្កើតគណនី ឬប្រើកម្មវិធី អ្នកបញ្ជាក់ថាអ្នកបានអាន យល់ និងយល់ព្រមលើលក្ខខណ្ឌទាំងនេះ និងគោលការណ៍ឯកជនភាពរបស់យើង។","sections":[["១. អ្នកដែលអាចប្រើកម្មវិធី",["អ្នកត្រូវមានអាយុយ៉ាងតិច ១៨ ឆ្នាំ ឬមានការអនុញ្ញាតពីឪពុកម្តាយ ឬអាណាព្យាបាលស្របច្បាប់ ដែលយល់ព្រមលើលក្ខខណ្ឌទាំងនេះជំនួសអ្នក។","ប្រសិនបើអ្នកប្រើកម្មវិធីសម្រាប់អាជីវកម្ម អ្នកបញ្ជាក់ថាអ្នកមានសិទ្ធិទទួលយកលក្ខខណ្ឌទាំងនេះជំនួសអាជីវកម្មនោះ។","យើងអាចបដិសេធការបង្កើតគណនី ឬកំណត់ចំនួនគណនី តាមការសម្រេចរបស់យើង។"]],["២. និយមន័យ",[["«គណនី» មានន័យថា គណនីដែលអ្នកបង្កើតក្នុងកម្មវិធី ដោយប្រើអ៊ីមែល និងពាក្យសម្ងាត់។","«មាតិកា» មានន័យថា វីដេអូ រូបភាព ចំណងជើង ហាស់ថេក តំណ ឬសម្ភារៈផ្សេងៗ ដែលអ្នកបង្ហោះតាមកម្មវិធី។","«វេទិកា» មានន័យថា Facebook, Instagram, Telegram, TikTok និងសេវាកម្មផ្សេងទៀតដែលកម្មវិធីភ្ជាប់ទៅ។","«គម្រោង» មានន័យថា កញ្ចប់បង់ប្រាក់ ដែលបើកកន្លែងបង្ហោះបន្ថែម ក្នុងរយៈពេលកំណត់។"]]],["៣. គណនី និងសុវត្ថិភាព",[["សូមផ្តល់ព័ត៌មានពិត ថ្មី និងពេញលេញ ហើយធ្វើបច្ចុប្បន្នភាពក្នុង គណនីរបស់ខ្ញុំ។","គណនីមួយសម្រាប់មនុស្សម្នាក់ ឬអាជីវកម្មមួយ។ កុំចែករំលែក លក់ ជួល ឬផ្ទេរគណនីរបស់អ្នក។","សូមរក្សាពាក្យសម្ងាត់ជាការសម្ងាត់។ អ្នកទទួលខុសត្រូវចំពោះអ្វីៗទាំងអស់ដែលកើតឡើងក្រោមគណនីរបស់អ្នក។","សូមប្រាប់យើងភ្លាមៗតាមការជជែកក្នុងកម្មវិធី ប្រសិនបើអ្នកគិតថាមាននរណាម្នាក់ប្រើគណនីរបស់អ្នក។"]]],["៤. ការភ្ជាប់គណនីបណ្តាញសង្គម",[["ដើម្បីបង្ហោះទៅ Facebook និង Instagram ក្រុមការងាររបស់យើងបន្ថែមគណនី Facebook របស់អ្នកជាអ្នកសាកល្បង (Tester) នៃកម្មវិធី Facebook របស់យើង ហើយអ្នកភ្ជាប់ទំព័ររបស់អ្នកដោយចុច ភ្ជាប់ជាមួយ Facebook។","ដោយភ្ជាប់ទំព័រ គណនី Instagram ឬឆានែល Telegram អ្នកអនុញ្ញាតឱ្យកម្មវិធីបង្ហោះមាតិកាដែលអ្នកជ្រើស តាមពេលវេលាដែលអ្នកជ្រើស ទៅកន្លែងនោះជំនួសអ្នក។","កូនសោចូលប្រើ Facebook, Instagram និង Telegram ត្រូវបានរក្សាទុកតែនៅលើឧបករណ៍របស់អ្នកប៉ុណ្ណោះ។ យើងមិនរក្សាទុកវានៅលើម៉ាស៊ីនមេរបស់យើងទេ។ អ្នកអាចលុបវាគ្រប់ពេល ក្នុង ការកំណត់ការបង្ហោះ។","អ្នកត្រូវមានសិទ្ធិគ្រប់គ្រងទំព័រ គណនី ឬឆានែលនីមួយៗដែលអ្នកភ្ជាប់។","វេទិកានីមួយៗមានលក្ខខណ្ឌ និងច្បាប់សហគមន៍ផ្ទាល់ខ្លួន។ អ្នកត្រូវគោរពតាម។ វេទិកាអាចលុបប៉ុស្តិ៍ កំណត់ការផ្សព្វផ្សាយ ឬបិទទំព័រ ហើយយើងមិនអាចផ្លាស់ប្តូរការសម្រេចរបស់ពួកគេបានទេ។"]]],["៥. មាតិការបស់អ្នក និងការអនុញ្ញាត",[["អ្នកនៅតែជាម្ចាស់មាតិការបស់អ្នក។ អ្នកផ្តល់ឱ្យយើងតែសិទ្ធិមានកំណត់ ដែលចាំបាច់ដើម្បីដំណើរការ រក្សាទុកបណ្តោះអាសន្ន និងបង្ហោះវា តាមសំណើរបស់អ្នក។","អ្នកអាចបង្ហោះតែមាតិកាដែលអ្នកបង្កើត ឬដែលម្ចាស់បានអនុញ្ញាតឱ្យអ្នកប្រើយ៉ាងច្បាស់។ ការសរសេរឈ្មោះ ឬឈ្មោះអ្នកប្រើរបស់ម្ចាស់ («ផ្តល់កិត្តិយស») មិនមែនជាការអនុញ្ញាតទេ។","នៅពេលអ្នកចម្លងតំណពី TikTok ឬវេទិកាផ្សេង អ្នកបញ្ជាក់ថាអ្នកមានការអនុញ្ញាតពីម្ចាស់ ដើម្បីបង្ហោះមាតិកានោះឡើងវិញ។","អ្នកទទួលខុសត្រូវទាំងស្រុងចំពោះមាតិការបស់អ្នក រួមទាំងចំណងជើង និងហាស់ថេក ព្រមទាំងការខូចខាតណាមួយដែលវាបង្កឡើង។"]]],["៦. មាតិកាដែលមិនអនុញ្ញាត",["អ្នកមិនត្រូវប្រើកម្មវិធី ដើម្បីបង្ហោះ ចែករំលែក ឬផ្សព្វផ្សាយ៖",["មាតិកាផ្លូវភេទ ភាពអាក្រាត រូបភាពអាសអាភាស ឬមាតិកាបញ្ឆេះផ្លូវភេទគ្រប់ប្រភេទ។","មាតិកាផ្លូវភេទ ការកេងប្រវ័ញ្ច ឬការរំលោភបំពានណាមួយ ដែលពាក់ព័ន្ធនឹងកុមារ។ យើងមិនអត់ឱនដាច់ខាត៖ គណនីនឹងត្រូវបិទភ្លាមៗ ហើយរឿងនេះនឹងត្រូវរាយការណ៍ទៅអាជ្ញាធរមានសមត្ថកិច្ច។","ហិង្សា ការគំរាមកំហែង ភេរវកម្ម ភាពឃោរឃៅចំពោះមនុស្ស ឬសត្វ ឬមាតិកាដែលលើកទឹកចិត្តឱ្យធ្វើបាបខ្លួនឯង ឬអ្នកដទៃ។","ការនិយាយញុះញង់ស្អប់ ការសម្លុត ការយាយី ឬមាតិកាដែលប្រមាថមនុស្សដោយសារសញ្ជាតិ ជនជាតិ សាសនា ភេទ ពិការភាព ឬលក្ខណៈផ្សេងទៀត។","ព័ត៌មានឯកជនរបស់អ្នកដទៃ ដូចជាលេខទូរស័ព្ទ អាសយដ្ឋាន ឬអត្តសញ្ញាណប័ណ្ណ ដោយគ្មានការយល់ព្រម។","ការបោកប្រាស់ ការក្លែងបន្លំ ព័ត៌មានក្លែងក្លាយ ការអះអាងខុសអំពីសុខភាព ឬហិរញ្ញវត្ថុ ឬការចែករង្វាន់ក្លែងក្លាយ។","ទំនិញ ឬសេវាកម្មខុសច្បាប់ រួមមាន គ្រឿងញៀន អាវុធ ល្បែងស៊ីសង ផលិតផលក្លែងក្លាយ និងការជួញដូរសត្វព្រៃ។","មាតិកាដែលមិនគោរព ជាតិ សាសនា ព្រះមហាក្សត្រ ឬដែលល្មើសនឹងច្បាប់ណាមួយនៃព្រះរាជាណាចក្រកម្ពុជា។","មាតិកាដែលចម្លង ឬរំលោភលើសិទ្ធិអ្នកនិពន្ធ ពាណិជ្ជសញ្ញា ឬសិទ្ធិផ្សេងទៀតរបស់អ្នកដទៃ។","សារឥតបានការ (Spam) មេរោគ ឬការក្លែងខ្លួនជាមនុស្ស ម៉ាក ឬស្ថាប័នផ្សេង។"]]],["៧. ការប្តឹងអំពីសិទ្ធិអ្នកនិពន្ធ",["ប្រសិនបើអ្នកជឿថា មាតិកាដែលបានបង្ហោះតាមកម្មវិធី ប្រើស្នាដៃរបស់អ្នកដោយគ្មានការអនុញ្ញាត សូមទាក់ទងយើងតាម info@kongthean.com ឬតាមការជជែក ដោយភ្ជាប់តំណប៉ុស្តិ៍ និងភស្តុតាងថាអ្នកជាម្ចាស់។ យើងនឹងពិនិត្យការប្តឹង អាចស្នើឱ្យអ្នកប្រើលុបមាតិកា និងអាចផ្អាក ឬបិទគណនីដែលរំលោភម្តងហើយម្តងទៀត។ ការលុបចេញពីវេទិកាផ្ទាល់ ត្រូវស្នើទៅវេទិកានោះ។"]],["៨. ការបង្ហោះឥតគិតថ្លៃ គម្រោង និងតម្លៃ",[["គណនីថ្មីទទួលបានការបង្ហោះទៅ Facebook ឥតគិតថ្លៃមួយចំនួន។ ចំនួននេះបង្ហាញក្នុងកម្មវិធី ហើយអាចផ្លាស់ប្តូរ។","Facebook Story, Instagram, Instagram Story និង Telegram អាចប្រើបានតែជាមួយគម្រោងដែលរួមបញ្ចូលវាប៉ុណ្ណោះ។","គម្រោងត្រូវបង់ជាមុន សម្រាប់រយៈពេល ១ ២ ៣ ៦ ឬ ១២ ខែ។ តម្លៃបច្ចុប្បន្នបង្ហាញក្នុងកម្មវិធី មុនពេលអ្នកបង់។ ការផ្លាស់ប្តូរតម្លៃ មិនប៉ះពាល់ដល់គម្រោងដែលអ្នកបានបង់រួចឡើយ។","គម្រោងចាប់ផ្តើមនៅពេលវាត្រូវបានបើក ហើយបញ្ចប់នៅថ្ងៃដែលបង្ហាញក្នុង គណនីរបស់ខ្ញុំ។ គម្រោងមិនបន្តដោយស្វ័យប្រវត្តិទេ ដើម្បីបន្ត អ្នកត្រូវបង់ម្តងទៀត។"]]],["៩. ការបង់ប្រាក់ និងការពិនិត្យបង្កាន់ដៃ",[["អ្នកបង់តាម KHQR ទៅគណនីដែលបង្ហាញក្នុងកម្មវិធី ហើយផ្ញើរូបភាពបង្កាន់ដៃធនាគាររបស់អ្នក។","ប្រព័ន្ធរបស់យើងអានបង្កាន់ដៃ ហើយពិនិត្យចំនួនទឹកប្រាក់ អ្នកទទួល កាលបរិច្ឆេទ និងលេខប្រតិបត្តិការ។ ប្រសិនបើត្រឹមត្រូវ គម្រោងនឹងបើកដោយស្វ័យប្រវត្តិ ជាធម្មតាក្នុងរយៈពេល ៥ ទៅ ១៥ នាទី។ បើមិនដូច្នោះទេ ក្រុមការងារនឹងពិនិត្យដោយដៃ។","ក្រុមការងាររបស់យើងអាចពិនិត្យការបង់ប្រាក់ណាមួយម្តងទៀតនៅពេលក្រោយ។ ប្រសិនបើប្រាក់មិនបានចូលគណនីរបស់យើងទេ យើងនឹងដកគម្រោងចេញ។","ការផ្ញើបង្កាន់ដៃក្លែងក្លាយ កែប្រែ ខ្ចីគេ ឬប្រើឡើងវិញ គឺជាការបោកប្រាស់។ យើងនឹងដកគម្រោង ផ្អាក ឬបិទគណនីដោយគ្មានការសងប្រាក់វិញ ហើយអាចរាយការណ៍ទៅអាជ្ញាធរមានសមត្ថកិច្ច។"]]],["១០. ការសងប្រាក់វិញ",["ជាទូទៅ ការបង់ប្រាក់មិនអាចសងវិញបានទេ បន្ទាប់ពីគម្រោងត្រូវបានបើក។ ប្រសិនបើអ្នកបង់ខុស បង់ពីរដង ឬមិនអាចប្រើកម្មវិធីបានដោយសារបញ្ហាពីខាងយើង សូមទាក់ទងយើងក្នុងរយៈពេល ៧ ថ្ងៃ ហើយយើងនឹងពិនិត្យសំណើរបស់អ្នកដោយយុត្តិធម៌។ គ្មានការសងប្រាក់វិញទេ នៅពេលគណនីត្រូវបានផ្អាក ឬបិទ ដោយសារការរំលោភលក្ខខណ្ឌទាំងនេះ។"]],["១១. កំណត់ត្រាដែលយើងរក្សាទុក",["ដើម្បីដំណើរការកម្មវិធី ការពារការប្រើខុស និងបំពេញកាតព្វកិច្ចតាមច្បាប់ យើងរក្សាទុកព័ត៌មានគណនីរបស់អ្នក ប្រវត្តិប៉ុស្តិ៍ដែលបង្ហោះតាមកម្មវិធី (ពេលវេលា កន្លែង ឈ្មោះទំព័រ តំណប្រភព និងចំណងជើង) គម្រោង ការបង់ប្រាក់ និងបង្កាន់ដៃ ព្រមទាំងការជជែកជាមួយក្រុមការងារ។ ព័ត៌មានលម្អិតមានពន្យល់ក្នុងគោលការណ៍ឯកជនភាព។"]],["១២. ពេលលក្ខខណ្ឌទាំងនេះត្រូវបានរំលោភ",[["យើងអាចដកតំណមាតិកាចេញពីកំណត់ត្រា ព្រមាន ផ្អាកគណនីក្នុងរយៈពេលមួយ បិទជាអចិន្ត្រៃយ៍ ឬបដិសេធគណនីថ្មី អាស្រ័យលើកម្រិតធ្ងន់ធ្ងរនៃបញ្ហា។","យើងអាចចាត់វិធានការដោយគ្មានការព្រមាន នៅពេលច្បាប់ សុវត្ថិភាពរបស់អ្នកដទៃ ឬវេទិកាតម្រូវ។","ប្រសិនបើយើងរកឃើញការរំលោភ យើងអាចប្រើព័ត៌មានគណនី និងប្រវត្តិសកម្មភាពខាងលើ ដើម្បីស៊ើបអង្កេត ហើយអាចចែករំលែកជាមួយអាជ្ញាធរមានសមត្ថកិច្ច ដើម្បីដោះស្រាយតាមច្បាប់នៃព្រះរាជាណាចក្រកម្ពុជា។"]]],["១៣. សេវាកម្មរបស់យើង និងក្រុមហ៊ុនផ្សេង",[["យើងខិតខំរក្សាឱ្យកម្មវិធីអាចប្រើបាន និងត្រឹមត្រូវ ប៉ុន្តែយើងផ្តល់វា «តាមស្ថានភាពជាក់ស្តែង» ហើយមិនអាចសន្យាថាវានឹងដំណើរការជានិច្ច ដោយគ្មានកំហុស ឬការរំខានទេ។","កម្មវិធីពឹងផ្អែកលើក្រុមហ៊ុនផ្សេង រួមមាន Meta (Facebook និង Instagram), Telegram, TikTok, Google Firebase, Cloudinary និង GitHub។ នៅពេលពួកគេផ្លាស់ប្តូរ កំណត់ ឬបញ្ឈប់មុខងារណាមួយ ផ្នែកខ្លះនៃកម្មវិធីអាចឈប់ដំណើរការ។ យើងមិនទទួលខុសត្រូវចំពោះសេវាកម្ម ឬការសម្រេចរបស់ពួកគេឡើយ។","យើងអាចផ្លាស់ប្តូរ បន្ថែម ឬដកមុខងារនៃកម្មវិធីគ្រប់ពេល។"]]],["១៤. ការកំណត់ការទទួលខុសត្រូវ",["តាមកម្រិតដែលច្បាប់អនុញ្ញាត យើងមិនទទួលខុសត្រូវចំពោះការខាតបង់ដោយប្រយោល ដូចជាការបាត់បង់ប្រាក់ចំណេញ ការបាត់បង់អ្នកតាមដាន ឬទំព័រត្រូវបានកំណត់ ដែលកើតចេញពីការប្រើកម្មវិធី ឬពីមាតិការបស់អ្នកឡើយ។ ការទទួលខុសត្រូវសរុបរបស់យើងចំពោះការទាមទារណាមួយ មិនលើសពីចំនួនទឹកប្រាក់ដែលអ្នកបានបង់ឱ្យយើង ក្នុងរយៈពេល ៣ ខែមុនការទាមទារនោះទេ។"]],["១៥. ការទទួលខុសត្រូវរបស់អ្នកចំពោះយើង",["ប្រសិនបើមាននរណាម្នាក់ទាមទារពីយើង ដោយសារមាតិការបស់អ្នក ឬដោយសារអ្នករំលោភលក្ខខណ្ឌទាំងនេះ អ្នកយល់ព្រមចេញថ្លៃចំណាយ និងការខាតបង់សមហេតុផលដែលកើតឡើង តាមកម្រិតដែលច្បាប់អនុញ្ញាត។"]],["១៦. ការបិទគណនីរបស់អ្នក",["អ្នកអាចលុបគណនីរបស់អ្នកគ្រប់ពេល ក្នុង គណនីរបស់ខ្ញុំ។ ការលុបគណនីបញ្ចប់គម្រោងណាមួយដោយគ្មានការសងប្រាក់វិញ។ កំណត់ត្រាមួយចំនួនត្រូវបានរក្សាទុកក្នុងរយៈពេលកំណត់ ដូចដែលបានពន្យល់ក្នុងគោលការណ៍ឯកជនភាព។"]],["១៧. ការផ្លាស់ប្តូរលក្ខខណ្ឌ",["យើងអាចធ្វើបច្ចុប្បន្នភាពលក្ខខណ្ឌទាំងនេះ នៅពេលសេវាកម្ម ឬច្បាប់ផ្លាស់ប្តូរ។ នៅពេលមានការផ្លាស់ប្តូរសំខាន់ កម្មវិធីនឹងបង្ហាញលក្ខខណ្ឌថ្មី ហើយស្នើឱ្យអ្នកយល់ព្រមម្តងទៀត មុនពេលបន្តបង្ហោះ។"]],["១៨. ច្បាប់ និងវិវាទ",["លក្ខខណ្ឌទាំងនេះស្ថិតក្រោមច្បាប់នៃព្រះរាជាណាចក្រកម្ពុជា។ ប្រសិនបើមានបញ្ហា សូមទាក់ទងយើងជាមុនសិន ដើម្បីយើងអាចដោះស្រាយជាមួយគ្នា។ វិវាទណាដែលមិនអាចដោះស្រាយតាមវិធីនេះបាន នឹងត្រូវដោះស្រាយដោយតុលាការមានសមត្ថកិច្ចនៃព្រះរាជាណាចក្រកម្ពុជា។"]],["១៩. ទំនាក់ទំនង",["ក្រុមការងារ ធាន · kongthean.com","ការជជែក៖ ប៊ូតុង ជជែក ក្នុងកម្មវិធី","អ៊ីមែល៖ info@kongthean.com"]]]}},"privacy":{"en":{"title":"Privacy Policy","intro":"This Privacy Policy explains what information the Thean team (\"we\", \"us\") collects on kongthean.com and in Thean Studio, our publishing app, why we collect it, how we keep it safe, and the choices you have. By using our website or the App, you agree to this policy.","sections":[["1. Who we are",["Thean is a Cambodian travel team that shares places, culture and travel tips on kongthean.com and on our social media pages. We also run Thean Studio, an app that helps people publish videos and photos to their own Facebook Page, Instagram account and Telegram channel. Contact: info@kongthean.com."]],["2. Information we collect on the website",[["Chat and calls: your messages, the name you give, and call details (time and length). A call is recorded only if you are told before it starts.","Forms and feedback: anything you choose to send us, such as a rating, message, phone number or email.","Notifications: if you turn them on, a technical address that lets us send notifications to your device.","Visitor statistics: we use Google Analytics to count visits and see which pages are popular, which country and type of device visitors use, and how they found our website. It uses cookies and does not tell us your name. You can block it with your browser's privacy settings or an ad blocker.","Settings on your device: your language and theme, saved in your own browser."]]],["3. Information we collect in Thean Studio",[["Account details: email, name, phone number, Facebook profile link, the date you joined, and your acceptance of the Terms of Use.","Activity history: for each post made through the App, the time, the places it was posted, the Page name, the source link and the caption.","Plans and payments: the plan you chose, the amount, the receipt picture you upload, the text our system reads from it, the transaction number and the result of the check.","Support: your chats with our team and our assistant.","Free post count and account status, such as a pause."]]],["4. Information that stays only on your device",["Your Facebook, Instagram and Telegram access keys, your caption settings and your recent posts list are saved only in your own browser. We do not receive or store them on our servers. You can remove them in Posting settings, and they are removed when you sign out."]],["5. How we use information",[["To provide the website and the App, and to publish posts you request.","To check payments, turn plans on, and prevent fake or reused receipts.","To answer your questions and give support.","To keep the service safe, investigate misuse, and enforce our Terms of Use.","To meet our legal obligations under the laws of the Kingdom of Cambodia.","To understand and improve our service."]]],["6. When we share information",[["Service providers that run our service: Google Firebase (accounts and database), Cloudinary (photos, videos and receipt pictures), and GitHub (website hosting and automatic checks).","Google Analytics: visitor statistics for the website, as explained in section 2.","Platforms you choose: when you post, your Content is sent to Facebook, Instagram or Telegram and is then covered by their own privacy policies.","Authorities: when the law requires it, or when we find a serious violation of our Terms of Use, we may share account information and activity history with the competent authorities of the Kingdom of Cambodia.","We never sell your information, and we do not use it for advertising."]]],["7. How long we keep information",[["Website chats and messages: as long as needed to help you, and up to 12 months.","App account details: while your account is open.","Activity history, payments, receipts and support chats: while your account is open and up to 2 years after it is closed, to handle disputes, fraud and legal requests.","Longer, if the law or an ongoing investigation requires it."]]],["8. How we protect information",["Information is stored with trusted providers that use encryption in transit. Only our team can see customer records. Passwords are handled by Google Firebase and are never visible to us. No system is completely secure, so please use a strong password and keep it private."]],["9. Your choices and rights",[["See and correct your details in My account at any time.","Delete your account in My account, or ask us to delete your information by email or chat. We reply within 30 days. Some records may be kept as explained in section 7.","Turn notifications off at any time in your browser or on the website.","Remove your social media keys from your device in Posting settings."]]],["10. Children",["Thean Studio is not for people under 18 without the permission of a parent or guardian. If you believe a child gave us information without permission, contact us and we will delete it."]],["11. Changes to this policy",["We may update this policy. The date at the top shows the latest version. When we make an important change, we will tell you in the App."]],["12. Contact us",["Thean team · kongthean.com","Email: info@kongthean.com","Chat: on the website or in the App"]]]},"km":{"title":"គោលការណ៍ឯកជនភាព","intro":"គោលការណ៍ឯកជនភាពនេះពន្យល់ពីព័ត៌មានដែលក្រុមការងារ ធាន («យើង») ប្រមូលនៅលើ kongthean.com និងក្នុង Thean Studio ដែលជាកម្មវិធីបង្ហោះរបស់យើង មូលហេតុដែលយើងប្រមូល របៀបដែលយើងរក្សាសុវត្ថិភាព និងជម្រើសដែលអ្នកមាន។ ដោយប្រើគេហទំព័រ ឬកម្មវិធីរបស់យើង អ្នកយល់ព្រមលើគោលការណ៍នេះ។","sections":[["១. យើងជានរណា",["ធាន គឺជាក្រុមការងារទេសចរណ៍កម្ពុជា ដែលចែករំលែកទីកន្លែង វប្បធម៌ និងគន្លឹះធ្វើដំណើរ នៅលើ kongthean.com និងទំព័របណ្តាញសង្គមរបស់យើង។ យើងក៏ដំណើរការ Thean Studio ដែលជាកម្មវិធីជួយមនុស្សបង្ហោះវីដេអូ និងរូបភាពទៅទំព័រ Facebook គណនី Instagram និងឆានែល Telegram របស់ពួកគេផ្ទាល់។ ទំនាក់ទំនង៖ info@kongthean.com។"]],["២. ព័ត៌មានដែលយើងប្រមូលនៅលើគេហទំព័រ",[["ការជជែក និងការហៅទូរស័ព្ទ៖ សាររបស់អ្នក ឈ្មោះដែលអ្នកផ្តល់ និងព័ត៌មានការហៅ (ពេលវេលា និងរយៈពេល)។ ការហៅត្រូវបានថតតែនៅពេលអ្នកត្រូវបានជូនដំណឹងមុនចាប់ផ្តើមប៉ុណ្ណោះ។","ទម្រង់បែបបទ និងមតិកែលម្អ៖ អ្វីដែលអ្នកជ្រើសផ្ញើមកយើង ដូចជាការវាយតម្លៃ សារ លេខទូរស័ព្ទ ឬអ៊ីមែល។","ការជូនដំណឹង៖ ប្រសិនបើអ្នកបើក អាសយដ្ឋានបច្ចេកទេសមួយ ដែលអនុញ្ញាតឱ្យយើងផ្ញើការជូនដំណឹងទៅឧបករណ៍របស់អ្នក។","ស្ថិតិអ្នកចូលមើល៖ យើងប្រើ Google Analytics ដើម្បីរាប់ចំនួនអ្នកចូលមើល និងដឹងថាទំព័រណាពេញនិយម អ្នកចូលមើលមកពីប្រទេសណា ប្រើឧបករណ៍ប្រភេទណា និងរកឃើញគេហទំព័ររបស់យើងតាមរបៀបណា។ វាប្រើខូគី (cookies) ហើយមិនប្រាប់យើងពីឈ្មោះរបស់អ្នកទេ។ អ្នកអាចរារាំងវាដោយការកំណត់ឯកជនភាពក្នុងកម្មវិធីរុករក ឬកម្មវិធីរារាំងការផ្សាយពាណិជ្ជកម្ម។","ការកំណត់នៅលើឧបករណ៍៖ ភាសា និងរចនាប័ទ្មរបស់អ្នក ដែលរក្សាទុកក្នុងកម្មវិធីរុករករបស់អ្នកផ្ទាល់។"]]],["៣. ព័ត៌មានដែលយើងប្រមូលក្នុង Thean Studio",[["ព័ត៌មានគណនី៖ អ៊ីមែល ឈ្មោះ លេខទូរស័ព្ទ តំណប្រូហ្វាល Facebook ថ្ងៃចូលរួម និងការយល់ព្រមលើលក្ខខណ្ឌប្រើប្រាស់។","ប្រវត្តិសកម្មភាព៖ សម្រាប់ប៉ុស្តិ៍នីមួយៗដែលបង្ហោះតាមកម្មវិធី ពេលវេលា កន្លែងដែលបានបង្ហោះ ឈ្មោះទំព័រ តំណប្រភព និងចំណងជើង។","គម្រោង និងការបង់ប្រាក់៖ គម្រោងដែលអ្នកជ្រើស ចំនួនទឹកប្រាក់ រូបភាពបង្កាន់ដៃដែលអ្នកផ្ញើ អត្ថបទដែលប្រព័ន្ធរបស់យើងអានពីវា លេខប្រតិបត្តិការ និងលទ្ធផលនៃការពិនិត្យ។","ជំនួយ៖ ការជជែករបស់អ្នកជាមួយក្រុមការងារ និងជំនួយការរបស់យើង។","ចំនួនការបង្ហោះឥតគិតថ្លៃ និងស្ថានភាពគណនី ដូចជាការផ្អាក។"]]],["៤. ព័ត៌មានដែលនៅតែលើឧបករណ៍របស់អ្នក",["កូនសោចូលប្រើ Facebook, Instagram និង Telegram ការកំណត់ចំណងជើង និងបញ្ជីប៉ុស្តិ៍ថ្មីៗរបស់អ្នក ត្រូវបានរក្សាទុកតែក្នុងកម្មវិធីរុករករបស់អ្នកផ្ទាល់។ យើងមិនទទួល ឬរក្សាទុកវានៅលើម៉ាស៊ីនមេរបស់យើងទេ។ អ្នកអាចលុបវាក្នុង ការកំណត់ការបង្ហោះ ហើយវាត្រូវបានលុបនៅពេលអ្នកចាកចេញ។"]],["៥. របៀបដែលយើងប្រើព័ត៌មាន",[["ដើម្បីផ្តល់គេហទំព័រ និងកម្មវិធី ហើយបង្ហោះប៉ុស្តិ៍តាមសំណើរបស់អ្នក។","ដើម្បីពិនិត្យការបង់ប្រាក់ បើកគម្រោង និងការពារបង្កាន់ដៃក្លែងក្លាយ ឬប្រើឡើងវិញ។","ដើម្បីឆ្លើយសំណួរ និងផ្តល់ជំនួយ។","ដើម្បីរក្សាសុវត្ថិភាពសេវាកម្ម ស៊ើបអង្កេតការប្រើខុស និងអនុវត្តលក្ខខណ្ឌប្រើប្រាស់។","ដើម្បីបំពេញកាតព្វកិច្ចតាមច្បាប់នៃព្រះរាជាណាចក្រកម្ពុជា។","ដើម្បីយល់ និងកែលម្អសេវាកម្មរបស់យើង។"]]],["៦. ពេលដែលយើងចែករំលែកព័ត៌មាន",[["អ្នកផ្តល់សេវាដែលដំណើរការសេវាកម្មរបស់យើង៖ Google Firebase (គណនី និងមូលដ្ឋានទិន្នន័យ) Cloudinary (រូបភាព វីដេអូ និងរូបបង្កាន់ដៃ) និង GitHub (ការបង្ហោះគេហទំព័រ និងការពិនិត្យស្វ័យប្រវត្តិ)។","Google Analytics៖ ស្ថិតិអ្នកចូលមើលគេហទំព័រ ដូចដែលបានពន្យល់ក្នុងផ្នែកទី២។","វេទិកាដែលអ្នកជ្រើស៖ នៅពេលអ្នកបង្ហោះ មាតិការបស់អ្នកត្រូវបានផ្ញើទៅ Facebook, Instagram ឬ Telegram ហើយស្ថិតក្រោមគោលការណ៍ឯកជនភាពរបស់ពួកគេ។","អាជ្ញាធរ៖ នៅពេលច្បាប់តម្រូវ ឬនៅពេលយើងរកឃើញការរំលោភធ្ងន់ធ្ងរលើលក្ខខណ្ឌប្រើប្រាស់ យើងអាចចែករំលែកព័ត៌មានគណនី និងប្រវត្តិសកម្មភាព ជាមួយអាជ្ញាធរមានសមត្ថកិច្ចនៃព្រះរាជាណាចក្រកម្ពុជា។","យើងមិនដែលលក់ព័ត៌មានរបស់អ្នក ហើយមិនប្រើវាសម្រាប់ការផ្សាយពាណិជ្ជកម្មឡើយ។"]]],["៧. រយៈពេលរក្សាទុកព័ត៌មាន",[["ការជជែក និងសារលើគេហទំព័រ៖ ដរាបណាចាំបាច់ដើម្បីជួយអ្នក និងរហូតដល់ ១២ ខែ។","ព័ត៌មានគណនីកម្មវិធី៖ ដរាបណាគណនីរបស់អ្នកនៅបើក។","ប្រវត្តិសកម្មភាព ការបង់ប្រាក់ បង្កាន់ដៃ និងការជជែកជំនួយ៖ ដរាបណាគណនីនៅបើក និងរហូតដល់ ២ ឆ្នាំបន្ទាប់ពីបិទ ដើម្បីដោះស្រាយវិវាទ ការបោកប្រាស់ និងសំណើតាមច្បាប់។","យូរជាងនេះ ប្រសិនបើច្បាប់ ឬការស៊ើបអង្កេតដែលកំពុងដំណើរការតម្រូវ។"]]],["៨. របៀបដែលយើងការពារព័ត៌មាន",["ព័ត៌មានត្រូវបានរក្សាទុកជាមួយអ្នកផ្តល់សេវាដែលគួរឱ្យទុកចិត្ត ដែលប្រើការអ៊ិនគ្រីបពេលបញ្ជូន។ មានតែក្រុមការងាររបស់យើងទេ ដែលអាចមើលកំណត់ត្រាអតិថិជន។ ពាក្យសម្ងាត់ត្រូវបានគ្រប់គ្រងដោយ Google Firebase ហើយយើងមិនអាចមើលឃើញវាទេ។ គ្មានប្រព័ន្ធណាមានសុវត្ថិភាពទាំងស្រុងទេ ដូច្នេះសូមប្រើពាក្យសម្ងាត់រឹងមាំ ហើយរក្សាវាជាការសម្ងាត់។"]],["៩. ជម្រើស និងសិទ្ធិរបស់អ្នក",[["មើល និងកែព័ត៌មានរបស់អ្នកក្នុង គណនីរបស់ខ្ញុំ គ្រប់ពេល។","លុបគណនីរបស់អ្នកក្នុង គណនីរបស់ខ្ញុំ ឬស្នើឱ្យយើងលុបព័ត៌មានរបស់អ្នកតាមអ៊ីមែល ឬការជជែក។ យើងឆ្លើយតបក្នុងរយៈពេល ៣០ ថ្ងៃ។ កំណត់ត្រាមួយចំនួនអាចត្រូវបានរក្សាទុក ដូចដែលបានពន្យល់ក្នុងផ្នែកទី៧។","បិទការជូនដំណឹងគ្រប់ពេល ក្នុងកម្មវិធីរុករក ឬនៅលើគេហទំព័រ។","លុបកូនសោបណ្តាញសង្គមចេញពីឧបករណ៍របស់អ្នក ក្នុង ការកំណត់ការបង្ហោះ។"]]],["១០. កុមារ",["Thean Studio មិនមែនសម្រាប់អ្នកដែលមានអាយុក្រោម ១៨ ឆ្នាំ ដោយគ្មានការអនុញ្ញាតពីឪពុកម្តាយ ឬអាណាព្យាបាលឡើយ។ ប្រសិនបើអ្នកជឿថាកុមារបានផ្តល់ព័ត៌មានមកយើងដោយគ្មានការអនុញ្ញាត សូមទាក់ទងយើង ហើយយើងនឹងលុបវា។"]],["១១. ការផ្លាស់ប្តូរគោលការណ៍នេះ",["យើងអាចធ្វើបច្ចុប្បន្នភាពគោលការណ៍នេះ។ កាលបរិច្ឆេទនៅខាងលើបង្ហាញកំណែចុងក្រោយ។ នៅពេលមានការផ្លាស់ប្តូរសំខាន់ យើងនឹងជូនដំណឹងអ្នកក្នុងកម្មវិធី។"]],["១២. ទំនាក់ទំនង",["ក្រុមការងារ ធាន · kongthean.com","អ៊ីមែល៖ info@kongthean.com","ការជជែក៖ នៅលើគេហទំព័រ ឬក្នុងកម្មវិធី"]]]}},"up":{"en":"Version 2 · Effective 15 November 2026","km":"កំណែទី២ · ចូលជាធរមាន ថ្ងៃទី១៥ ខែវិច្ឆិកា ឆ្នាំ២០២៦"}};

LEGAL.about={"en":{"title":"About Thean Studio","intro":"Thean Studio is a social media publishing app made in Cambodia by the Thean team, the creators behind kongthean.com. It helps creators, shops, guesthouses, tour guides and small businesses publish their videos and photos to Facebook, Instagram and Telegram in one simple step.","sections":[["Why we built it",["As a travel team, we post every day to several social media pages. Uploading the same video again and again, rewriting captions and checking each platform took hours. We built Thean Studio to do this work for us, and now we share it with other Cambodian creators and businesses so they can spend less time uploading and more time creating."]],["What Thean Studio does",[["Publishes one video or a set of photos to your Facebook Page, Facebook Story, Instagram, Instagram Story and Telegram channel at the same time.","Prepares captions and hashtags for each platform, and fits photos to the shape Instagram needs.","Lets you schedule Facebook posts for later.","Keeps a list of your recent posts so you can open them quickly.","Works in Khmer and English, on phones and computers, without installing anything."]]],["Built for safety and privacy",[["Your Facebook, Instagram and Telegram keys stay only on your own device. We never store them on our servers.","Each account has a personal 14-digit Customer ID, so our team can help you quickly and safely.","Payments are made with KHQR to our official account, and every receipt is checked.","Clear Terms of Use protect creators and keep harmful content off the platform."]]],["Plans",["Every new account can try Thean Studio with free Facebook posts. Paid plans unlock Facebook Story, Instagram and Telegram for 1, 2, 3, 6 or 12 months, at prices shown in the app. There are no automatic charges: you choose when to renew."]],["Respect for creators",["We believe creators deserve credit and fair treatment. Thean Studio is made for publishing your own content, or content you have permission to use. We act on copyright complaints and remove access for anyone who misuses the app."]],["Support",["Our team answers in the in-app chat every day. Tap Chat with us, choose a topic or tap Talk to Live Agent, and give us your Customer ID if you need help with your account or a payment. You can also email info@kongthean.com."]],["Who is behind Thean Studio",["Thean Studio is made and run by the Thean team in Cambodia, the same team that shares travel stories on kongthean.com, Facebook, Telegram and TikTok. Thank you for choosing a Cambodian-made tool."]]]},"km":{"title":"អំពី Thean Studio","intro":"Thean Studio គឺជាកម្មវិធីបង្ហោះលើបណ្តាញសង្គម ផលិតនៅកម្ពុជាដោយក្រុមការងារ ធាន ដែលជាអ្នកបង្កើត kongthean.com។ វាជួយអ្នកបង្កើតមាតិកា ហាង ផ្ទះសំណាក់ មគ្គុទ្ទេសក៍ទេសចរណ៍ និងអាជីវកម្មខ្នាតតូច បង្ហោះវីដេអូ និងរូបភាពរបស់ខ្លួនទៅ Facebook, Instagram និង Telegram ក្នុងជំហានសាមញ្ញតែមួយ។","sections":[["មូលហេតុដែលយើងបង្កើតវា",["ក្នុងនាមជាក្រុមការងារទេសចរណ៍ យើងបង្ហោះរៀងរាល់ថ្ងៃទៅទំព័របណ្តាញសង្គមជាច្រើន។ ការផ្ទុកវីដេអូដដែលម្តងហើយម្តងទៀត ការសរសេរចំណងជើងឡើងវិញ និងការពិនិត្យវេទិកានីមួយៗ ចំណាយពេលច្រើនម៉ោង។ យើងបង្កើត Thean Studio ដើម្បីធ្វើការងារនេះជំនួសយើង ហើយឥឡូវនេះយើងចែករំលែកវាជាមួយអ្នកបង្កើតមាតិកា និងអាជីវកម្មកម្ពុជាផ្សេងទៀត ដើម្បីឱ្យពួកគេចំណាយពេលតិចលើការផ្ទុក និងច្រើនលើការបង្កើត។"]],["អ្វីដែល Thean Studio ធ្វើ",[["បង្ហោះវីដេអូមួយ ឬរូបភាពមួយឈុត ទៅទំព័រ Facebook, Facebook Story, Instagram, Instagram Story និងឆានែល Telegram របស់អ្នក ក្នុងពេលតែមួយ។","រៀបចំចំណងជើង និងហាស់ថេកសម្រាប់វេទិកានីមួយៗ ហើយកែរូបភាពឱ្យត្រូវទំហំដែល Instagram ត្រូវការ។","អនុញ្ញាតឱ្យអ្នកកំណត់ពេលបង្ហោះ Facebook សម្រាប់ពេលក្រោយ។","រក្សាបញ្ជីប៉ុស្តិ៍ថ្មីៗរបស់អ្នក ដើម្បីបើកមើលបានរហ័ស។","ដំណើរការជាភាសាខ្មែរ និងអង់គ្លេស លើទូរស័ព្ទ និងកុំព្យូទ័រ ដោយមិនចាំបាច់ដំឡើងអ្វីទាំងអស់។"]]],["សុវត្ថិភាព និងឯកជនភាព",[["កូនសោ Facebook, Instagram និង Telegram របស់អ្នក នៅតែលើឧបករណ៍របស់អ្នកប៉ុណ្ណោះ។ យើងមិនដែលរក្សាទុកវានៅលើម៉ាស៊ីនមេរបស់យើងទេ។","គណនីនីមួយៗមានលេខសម្គាល់អតិថិជន ១៤ ខ្ទង់ផ្ទាល់ខ្លួន ដើម្បីឱ្យក្រុមការងាររបស់យើងអាចជួយអ្នកបានរហ័ស និងមានសុវត្ថិភាព។","ការបង់ប្រាក់ធ្វើឡើងតាម KHQR ទៅគណនីផ្លូវការរបស់យើង ហើយរាល់បង្កាន់ដៃត្រូវបានពិនិត្យ។","លក្ខខណ្ឌប្រើប្រាស់ច្បាស់លាស់ ការពារអ្នកបង្កើតមាតិកា និងរក្សាមាតិកាដែលបង្កគ្រោះថ្នាក់ឱ្យនៅក្រៅវេទិកា។"]]],["គម្រោង",["គណនីថ្មីនីមួយៗអាចសាកល្បង Thean Studio ជាមួយការបង្ហោះ Facebook ឥតគិតថ្លៃ។ គម្រោងបង់ប្រាក់បើក Facebook Story, Instagram និង Telegram សម្រាប់រយៈពេល ១ ២ ៣ ៦ ឬ ១២ ខែ តាមតម្លៃដែលបង្ហាញក្នុងកម្មវិធី។ មិនមានការកាត់ប្រាក់ដោយស្វ័យប្រវត្តិទេ៖ អ្នកជាអ្នកសម្រេចពេលបន្ត។"]],["ការគោរពអ្នកបង្កើតមាតិកា",["យើងជឿថា អ្នកបង្កើតមាតិកាសមនឹងទទួលបានកិត្តិយស និងការប្រព្រឹត្តដោយយុត្តិធម៌។ Thean Studio ត្រូវបានបង្កើតឡើងសម្រាប់បង្ហោះមាតិការបស់អ្នកផ្ទាល់ ឬមាតិកាដែលអ្នកមានការអនុញ្ញាតឱ្យប្រើ។ យើងចាត់វិធានការលើការប្តឹងអំពីសិទ្ធិអ្នកនិពន្ធ ហើយដកសិទ្ធិពីអ្នកដែលប្រើកម្មវិធីខុសគោលបំណង។"]],["ជំនួយ",["ក្រុមការងាររបស់យើងឆ្លើយក្នុងការជជែកក្នុងកម្មវិធីរៀងរាល់ថ្ងៃ។ ចុច ជជែកជាមួយយើង ជ្រើសប្រធានបទ ឬចុច ជជែកជាមួយភ្នាក់ងារ ហើយផ្តល់លេខសម្គាល់អតិថិជនរបស់អ្នក ប្រសិនបើអ្នកត្រូវការជំនួយអំពីគណនី ឬការបង់ប្រាក់។ អ្នកក៏អាចផ្ញើអ៊ីមែលមក info@kongthean.com។"]],["អ្នកនៅពីក្រោយ Thean Studio",["Thean Studio ត្រូវបានបង្កើត និងដំណើរការដោយក្រុមការងារ ធាន នៅកម្ពុជា ដែលជាក្រុមតែមួយដែលចែករំលែករឿងរ៉ាវទេសចរណ៍នៅលើ kongthean.com, Facebook, Telegram និង TikTok។ សូមអរគុណដែលបានជ្រើសរើសឧបករណ៍ដែលផលិតនៅកម្ពុជា។"]]]}};
